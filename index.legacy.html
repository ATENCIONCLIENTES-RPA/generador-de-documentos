const cleanSpecialCharacters = (name) => {
  if (!name) return '';
  return name
    .replace(/[/\\_-]+/g, ' ')
    .replace(/[;,.:]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
};

const toTitleCase = (text) => {
  if (!text) return '';
  const clean = cleanSpecialCharacters(text);
  const words = clean.split(/\s+/);
  const lowerParticles = new Set(['de', 'del', 'la', 'las', 'los', 'y', 'e', 'von', 'van']);
  return words
    .map((word, index) => {
      const lower = word.toLowerCase();
      if (index > 0 && lowerParticles.has(lower)) return lower;
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    })
    .join(' ');
};

const extractFirstName = (rawName) => {
  if (!rawName) return '';
  const rawTrimmed = rawName.trim();
  if (!rawTrimmed) return '';

  if (rawTrimmed.includes('/') || rawTrimmed.includes('\\')) {
    const parts = rawTrimmed.split(/[/|\\]/);
    if (parts.length >= 2) {
      const afterSlash = cleanSpecialCharacters(parts[1]);
      if (afterSlash) {
        const afterWords = afterSlash.split(/\s+/);
        if (afterWords.length > 0 && afterWords[0]) return toTitleCase(afterWords[0]);
      }
    }
  }

  if (rawTrimmed.includes('-')) {
    const parts = rawTrimmed.split('-');
    if (parts.length >= 2) {
      const afterHyphen = cleanSpecialCharacters(parts[parts.length - 1]);
      const afterUpper = afterHyphen.toUpperCase();
      if (COMMON_GIVEN_NAMES.has(afterUpper) || !COMMON_SURNAMES.has(afterUpper)) {
        const words = afterHyphen.split(/\s+/);
        if (words.length > 0 && words[0]) return toTitleCase(words[0]);
      }
    }
  }

  const clean = cleanSpecialCharacters(rawTrimmed);
  const words = clean.split(/\s+/);
  if (words.length === 0 || !words[0]) return '';
  if (words.length === 1) return toTitleCase(words[0]);

  const upperWords = words.map((w) => w.toUpperCase());

  if (words.length === 4) {
    const [w0, w1, w2, w3] = upperWords;
    const isW0Given = COMMON_GIVEN_NAMES.has(w0) && !COMMON_SURNAMES.has(w0);
    const isW2Given = COMMON_GIVEN_NAMES.has(w2);
    const isW0Surname = COMMON_SURNAMES.has(w0);
    if (isW0Given && !isW0Surname) return toTitleCase(words[0]);
    if (isW2Given || isW0Surname) return toTitleCase(words[2]);
    return toTitleCase(words[2]);
  }

  if (words.length === 3) {
    const [w0, w1, w2] = upperWords;
    const w0IsSurname = COMMON_SURNAMES.has(w0);
    const w0IsGiven = COMMON_GIVEN_NAMES.has(w0);
    const w1IsSurname = COMMON_SURNAMES.has(w1);
    const w1IsGiven = COMMON_GIVEN_NAMES.has(w1);
    const w2IsSurname = COMMON_SURNAMES.has(w2);
    const w2IsGiven = COMMON_GIVEN_NAMES.has(w2);
    if ((w0IsSurname && w1IsGiven) || (w0IsSurname && !w0IsGiven && !w1IsSurname)) return toTitleCase(words[1]);
    if (w0IsSurname && (w1IsSurname || w2IsGiven) && w2IsGiven) return toTitleCase(words[2]);
    if (w0IsGiven && !w0IsSurname) return toTitleCase(words[0]);
    if (w0IsSurname) return toTitleCase(words[1]);
    return toTitleCase(words[0]);
  }

  if (words.length === 2) {
    const [w0, w1] = upperWords;
    const w0IsSurname = COMMON_SURNAMES.has(w0);
    const w0IsGiven = COMMON_GIVEN_NAMES.has(w0);
    const w1IsSurname = COMMON_SURNAMES.has(w1);
    const w1IsGiven = COMMON_GIVEN_NAMES.has(w1);
    if (w0IsSurname && w1IsGiven) return toTitleCase(words[1]);
    if (w0IsGiven) return toTitleCase(words[0]);
    if (w1IsGiven && !w0IsGiven) return toTitleCase(words[1]);
    return toTitleCase(words[0]);
  }

  for (let i = 0; i < words.length; i++) {
    const wUpper = upperWords[i];
    if (COMMON_GIVEN_NAMES.has(wUpper)) return toTitleCase(words[i]);
  }
  return toTitleCase(words[0]);
};

const formatApplicantName = (rawName) => {
  if (!rawName) return '';
  const rawTrimmed = rawName.trim();
  if (!rawTrimmed) return '';

  if (/[\/\-\\_\,|;]/.test(rawTrimmed)) {
    const cleaned = cleanSpecialCharacters(rawTrimmed);
    return toTitleCase(cleaned);
  }

  const clean = cleanSpecialCharacters(rawTrimmed);
  const words = clean.split(/\s+/);
  if (words.length <= 1) return toTitleCase(clean);

  const upperWords = words.map((w) => w.toUpperCase());

  if (words.length === 4) {
    const [w0, w1, w2, w3] = upperWords;
    const isW0Given = COMMON_GIVEN_NAMES.has(w0) && !COMMON_SURNAMES.has(w0);
    const isW2Given = COMMON_GIVEN_NAMES.has(w2);
    const isW0Surname = COMMON_SURNAMES.has(w0);
    if (isW0Given && !isW0Surname) return toTitleCase(clean);
    if (isW2Given || isW0Surname) {
      const nombres = `${words[2]} ${words[3]}`;
      const apellidos = `${words[0]} ${words[1]}`;
      return `${toTitleCase(nombres)} ${toTitleCase(apellidos)}`;
    }
    return toTitleCase(clean);
  }

  if (words.length === 3) {
    const [w0, w1, w2] = upperWords;
    const w0IsSurname = COMMON_SURNAMES.has(w0);
    const w0IsGiven = COMMON_GIVEN_NAMES.has(w0);
    const w1IsSurname = COMMON_SURNAMES.has(w1);
    const w1IsGiven = COMMON_GIVEN_NAMES.has(w1);
    const w2IsSurname = COMMON_SURNAMES.has(w2);
    const w2IsGiven = COMMON_GIVEN_NAMES.has(w2);
    if (w0IsSurname && w1IsGiven && w2IsGiven) {
      const nombres = `${words[1]} ${words[2]}`;
      const apellido = words[0];
      return `${toTitleCase(nombres)} ${toTitleCase(apellido)}`;
    }
    if (w0IsSurname && w1IsSurname && w2IsGiven) {
      const nombre = words[2];
      const apellidos = `${words[0]} ${words[1]}`;
      return `${toTitleCase(nombre)} ${toTitleCase(apellidos)}`;
    }
    if (w0IsSurname && !w1IsSurname && !w2IsSurname) return toTitleCase(clean);
    return toTitleCase(clean);
  }

  if (words.length === 2) {
    const [w0, w1] = upperWords;
    const w0IsSurname = COMMON_SURNAMES.has(w0);
    const w1IsGiven = COMMON_GIVEN_NAMES.has(w1);
    if (w0IsSurname && w1IsGiven) return `${toTitleCase(words[1])} ${toTitleCase(words[0])}`;
    return toTitleCase(clean);
  }

  return toTitleCase(clean);
};

// XML Helpers for safe DOCX manipulation
// ============================================

const escapeXml = (str) => {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&')
    .replace(/</g, '<')
    .replace(/>/g, '>')
    .replace(/"/g, '"')
    .replace(/'/g, '&apos;');
};

const patchXmlText = (xml, findText, replaceText) => {
  if (!findText) return xml;
  const escapedFind = findText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const escapedReplace = escapeXml(replaceText);
  const regex = new RegExp(
    '(<w:t[^>]*>)([\\s\\S]*?)(' + escapedFind + ')([\\s\\S]*?)(<\\/w:t>)',
    'g'
  );
  return xml.replace(regex, (match, open, before, found, after, close) => {
    return open + before + escapedReplace + after + close;
  });
};

const parseDocxFile = async (file) => {
  try {
    const arrayBuffer = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(arrayBuffer);
    const docXml = await zip.file('word/document.xml').async('text');
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(docXml, 'application/xml');
    const paragraphs = xmlDoc.getElementsByTagName('w:p');
    let text = '';
    for (let i = 0; i < paragraphs.length; i++) {
      const runs = paragraphs[i].getElementsByTagName('w:r');
      let paraText = '';
      for (let j = 0; j < runs.length; j++) {
        const tElements = runs[j].getElementsByTagName('w:t');
        for (let k = 0; k < tElements.length; k++) {
          paraText += tElements[k].textContent;
        }
      }
      text += paraText + '\n';
    }
    return text.trim();
  } catch (err) {
    console.warn('Error parsing docx:', file.name, err);
    return '';
  }
};

const extractTemplateVariables = (content) => {

  const regex = /\[([A-Z_]+)\]/g;

  while ((match = regex.exec(content)) !== null) {

  }
  const varDefs = [];
  const varLabels = {
    NOMBRE_SOLICITANTE: 'Nombre Solicitante',
    PRIMER_NOMBRE: 'Primer Nombre',

    NUMERO_CUENTA: 'Numero de Cuenta',
    CORREO_SOLICITANTE: 'Correo Solicitante',
    DIRECCION_SOLICITANTE: 'Direccion Solicitante',
    CEDULA_SOLICITANTE: 'Cedula Solicitante',
    NOMBRE_FIRMANTE: 'Nombre del Firmante',
    CARGO_FIRMANTE: 'Cargo del Firmante',
    CORREO_FIRMANTE: 'Correo del Firmante',
    FIRMA_DOCUMENTO: 'Firma del Documento',
  };
  const varSources = {
    NOMBRE_SOLICITANTE: 'Excel', PRIMER_NOMBRE: 'Calculado',
    RADICADO_ENTRADA: 'Excel', NUMERO_PROCESO: 'Excel',
    FECHA_SOLICITUD: 'Excel', NUMERO_CUENTA: 'Excel',
    CORREO_SOLICITANTE: 'Excel', DIRECCION_SOLICITANTE: 'Excel',
    CEDULA_SOLICITANTE: 'Excel', TELEFONO_SOLICITANTE: 'Excel',
    CELULAR_SOLICITANTE: 'Excel', MUNICIPIO_SOLICITANTE: 'Excel',
    DEPTO_SOLICITANTE: 'Excel', BARRIO_SOLICITANTE: 'Excel',
    MEDIO_SOLICITUD: 'Excel', NOMBRE_SUSCRIPTOR: 'Excel',
    CEDULA_SUSCRIPTOR: 'Excel', OBSERVACION_PROCESO: 'Excel',
    CIRCUITO: 'Excel', NOMBRE_CIRCUITO: 'Excel', ID_TRAFO: 'Excel',
    NUMERO_MEDIDOR: 'Excel', DIAS_REGISTRO: 'Excel',
    NOMBRE_FIRMANTE: 'Perfil',
    CARGO_FIRMANTE: 'Perfil', CORREO_FIRMANTE: 'Perfil',
    FIRMA_DOCUMENTO: 'Firma',
  };
  found.forEach((key) => {
    varDefs.push({
      key,
      label: varLabels[key] || key.replace(/_/g, ' ').toLowerCase(),
      type: key === 'FIRMA_DOCUMENTO' ? 'Imagen' : key === 'FECHA_SOLICITUD' ? 'Fecha' : 'Texto',
      source: varSources[key] || 'Excel',
    });
  });
  return varDefs;
};

const fileToTemplate = async (file, index) => {

};

const getExcelCellValue = (obj, keys) => {
  if (!obj || typeof obj !== 'object') return '';
  for (const k of keys) {
    if (obj[k] !== undefined && obj[k] !== null) return obj[k];
  }
  const normalizedKeyMap = {};
  for (const key of Object.keys(obj)) {
    const cleanKey = key.trim().toLowerCase().replace(/[_\-\.\s]+/g, '');
    normalizedKeyMap[cleanKey] = obj[key];
  }
  for (const k of keys) {
    const cleanQuery = k.trim().toLowerCase().replace(/[_\-\.\s]+/g, '');
    if (normalizedKeyMap[cleanQuery] !== undefined && normalizedKeyMap[cleanQuery] !== null) {
      return normalizedKeyMap[cleanQuery];
    }
  }
  for (const key of Object.keys(obj)) {
    const lowerKey = key.trim().toLowerCase();
    for (const k of keys) {
      const lowerQuery = k.trim().toLowerCase();
      if (lowerKey === lowerQuery || lowerKey.includes(lowerQuery)) {
        return obj[key];
      }
    }
  }
  return '';
};

const formatExcelDate = (val) => {
  if (val === undefined || val === null || val === '') return '';
  const strVal = String(val).trim();
  if (!isNaN(Number(strVal)) && Number(strVal) > 10000 && Number(strVal) < 100000) {
    const d = new Date(Math.round((Number(strVal) - 25569) * 86400 * 1000));
    if (!isNaN(d.getTime())) {
      return d.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }
  }
  const isoMatch = strVal.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (isoMatch) {
    const year = isoMatch[1];
    const month = isoMatch[2].padStart(2, '0');
    const day = isoMatch[3].padStart(2, '0');
    return `${day}/${month}/${year}`;
  }
  const euroMatch = strVal.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
  if (euroMatch) {
    const day = euroMatch[1].padStart(2, '0');
    const month = euroMatch[2].padStart(2, '0');
    const year = euroMatch[3];
    return `${day}/${month}/${year}`;
  }
  return strVal;
};

const parseExcelFile = (dataBinary) => {
  const wb = XLSX.read(dataBinary, { type: typeof dataBinary === 'string' ? 'binary' : 'array' });
  const wsname = wb.SheetNames[0];
  const ws = wb.Sheets[wsname];
  const rawRows = XLSX.utils.sheet_to_json(ws);

  if (!rawRows || rawRows.length === 0) return { records: [], rawCount: 0, db: null };

  const validRows = rawRows.filter((item) => {
    if (!item || typeof item !== 'object') return false;
    const cuenta = item['NUMERO_CUENTA'];
    if (cuenta == null || String(cuenta).trim() === '' || Number(cuenta) === 0) return false;
    const values = Object.values(item).filter((v) => v !== undefined && v !== null && String(v).trim() !== '');
    return values.length > 0;
  });

  const parsedRecords = validRows.map((item, index) => {
    const rawId = item['NUMERO_CUENTA'];
    const recordId = !isNaN(Number(rawId)) && Number(rawId) > 0 ? Number(rawId) : index + 1;

    return {
      ...item,
      id: recordId,
      status: 'Pendiente',
      selected: false,
      fechaSolicitud: formatExcelDate(item['FECHA_SOLICITUD']),
      fechaVencimiento: formatExcelDate(item['FECHA_VENCIMIENTO']),
      numeroProceso: String(item['NUMERO_PROCESO'] || ''),
      radicadoEntrada: String(item['RADICADO_ENTRADA'] || ''),
      nombreSolicitante: String(item['NOMBRE_SOLICITANTE'] || ''),
      cedulaSolicitante: String(item['CEDULA_SOLICITANTE'] || ''),
      telefonoSolicitante: String(item['TELEFONO_SOLICITANTE'] || ''),
      celularSolicitante: String(item['CELULAR_SOLICITANTE'] || ''),
      direccionSolicitante: String(item['DIRECCION_SOLICITANTE'] || ''),
      departamentoSolicitante: String(item['DEPTO_SOLICITANTE'] || ''),
      municipioSolicitante: String(item['MUNICIPIO_SOLICITANTE'] || ''),
      barrioSolicitante: String(item['BARRIO_SOLICITANTE'] || ''),
      correoSolicitante: String(item['CORREO_SOLICITANTE'] || ''),
      numeroCuenta: item['NUMERO_CUENTA'] != null ? String(item['NUMERO_CUENTA']) : '',
      medioSolicitud: String(item['MEDIO_SOLICITUD'] || ''),
      tipoProceso: String(item['TIPO_PROCESO'] || ''),
      descripcionTipoProceso: String(item['DESCRIPCION_TIPO_PROCESO'] || ''),
      tipoTramite: String(item['TIPO_TRAMITE'] || ''),
      estadoProceso: String(item['ESTADO_PROCESO'] || ''),
      subestado: String(item['SUBESTADO'] || ''),
      usuarioInicial: String(item['USUARIO_INICIAL_PROCESO'] || ''),
      nombreUsuarioInicial: String(item['NOMBRE_USUARIO_INICIAL_PROCESO'] || ''),
      usuarioFinal: String(item['USUARIO_FINAL_PROCESO'] || ''),
      nombreUsuarioFinal: String(item['NOMBRE_USUARIO_FINAL_PROCESO'] || ''),
      observacionProceso: String(item['OBSERVACION_PROCESO'] || ''),
      nombreSuscriptor: String(item['NOMBRE_SUSCRIPTOR'] || ''),
      cedulaSuscriptor: String(item['CEDULA_SUSCRIPTOR'] || ''),
      telefonoSuscriptor: String(item['TELEFONO_SUSCRIPTOR'] || ''),
      celularSuscriptor: String(item['CELULAR_SUSCRIPTOR'] || ''),
      direccionSuscriptor: String(item['DIRECCION_SUSCRIPTOR'] || ''),
      deptoSuscriptor: String(item['DEPTO_SUSCRIPTOR'] || ''),
      municipioSuscriptor: String(item['MUNICIPIO_SUSCRIPTOR'] || ''),
      barrioSuscriptor: String(item['BARRIO_SUSCRIPTOR'] || ''),
      observacionDecision: String(item['OBSERVACION_DECISION'] || ''),
      usuarioDecision: String(item['USUARIO_DECISION'] || ''),
      nombreUsuarioDecision: String(item['NOMBRE_USUARIO_DECISION'] || ''),
      circuito: String(item['CIRCUITO'] || ''),
      nombreCircuito: String(item['NOMBRE_CIRCUITO'] || ''),
      idTrafo: String(item['ID_TRAFO'] || ''),
      numeroRevision: String(item['NUMERO_REVISION'] || ''),
      usuarioResponsableRevision: String(item['USUARIO_RESPONSABLE_REVISION'] || ''),
      fechaProgramacionRevision: formatExcelDate(item['FECHA_PROGRAMACION_REVISION']),
      fechaRevision: formatExcelDate(item['FECHA_REVISION']),
      estadoRevision: String(item['ESTADO_REVISION'] || ''),
      tipoRevision: String(item['TIPO_REVISION'] || ''),
      descripcionTipoRevision: String(item['DESCRIPCION_TIPO_REVISION'] || ''),
      descripcionMotivo: String(item['DESCRIPCION_MOTIVO'] || ''),
      observacionRevision: String(item['OBSERVACION_REVISION'] || ''),
      numeroMedidor: String(item['NUMERO_MEDIDOR'] || ''),
      marcaMedidor: String(item['MARCA_MEDIDOR'] || ''),
      tipoMedidor: String(item['TIPO_MEDIDOR'] || ''),
      diasRegistro: item['DIAS_REGISTRO'] != null ? String(item['DIAS_REGISTRO']) : '',
      nombreUsuarioInicialProceso: String(item['NOMBRE_USUARIO_INICIAL_PROCESO'] || ''),
      nombreUsuarioFinalProceso: String(item['NOMBRE_USUARIO_FINAL_PROCESO'] || ''),
    };
  });

  let db = null;
  try {
    db = new alasql.Database('essa_records');
    db.exec('CREATE TABLE registros');
    db.tables.registros.data = parsedRecords;
    db.exec('CREATE INDEX idx_id ON registros(id)');
    db.exec('CREATE INDEX idx_cuenta ON registros(numeroCuenta)');
    db.exec('CREATE INDEX idx_nombre ON registros(nombreSolicitante)');
    db.exec('CREATE INDEX idx_radicado ON registros(radicadoEntrada)');
    db.exec('CREATE INDEX idx_proceso ON registros(numeroProceso)');
  } catch (e) {
    console.warn('Alasql init error:', e);
    db = null;
  }

const SignaturePadModal = ({ isOpen, onClose, onSave, initialSignature }) => {
  const canvasRef = React.useRef(null);
  const [isDrawing, setIsDrawing] = React.useState(false);
  const [penColor, setPenColor] = React.useState('#002f6c');
  const lastPoint = React.useRef(null);

  React.useEffect(() => {
    if (!isOpen) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    // Set canvas size
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width || 480;
    canvas.height = 200;

    // Fill white background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw guide line
    ctx.beginPath();
    ctx.moveTo(20, canvas.height - 30);
    ctx.lineTo(canvas.width - 20, canvas.height - 30);
    ctx.strokeStyle = '#93c5fd';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Load initial signature if provided
    if (initialSignature) {
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      };
      img.src = initialSignature;
    }
  }, [isOpen, initialSignature]);

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height),
    };
  };

  const startDraw = (e) => {
    e.preventDefault();
    setIsDrawing(true);
    const pos = getPos(e);
    lastPoint.current = pos;
    const ctx = canvasRef.current.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  };

  const draw = (e) => {
    e.preventDefault();
    if (!isDrawing) return;
    const ctx = canvasRef.current.getContext('2d');
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastPoint.current.x, lastPoint.current.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = penColor;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    lastPoint.current = pos;
  };

  const stopDraw = (e) => {
    if (e) e.preventDefault();
    setIsDrawing(false);
    lastPoint.current = null;
  };

  const clearCanvas = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Redraw guide line
    ctx.beginPath();
    ctx.moveTo(20, canvas.height - 30);
    ctx.lineTo(canvas.width - 20, canvas.height - 30);
    ctx.strokeStyle = '#93c5fd';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
  };

  const save = () => {
    const dataUrl = canvasRef.current.toDataURL('image/png');
    if (onSave) onSave(dataUrl);
    if (onClose) onClose();
  };

  const handleOverlayClick = (e) => {
    if (e.target === e.currentTarget && onClose) onClose();
  };

  if (!isOpen) return null;

  const penColors = [
    { value: '#002f6c', label: 'Azul marino' },
    { value: '#0f172a', label: 'Negro' },
    { value: '#1e40af', label: 'Azul' },
  ];

  return (
    <div className="modal-overlay" onClick={handleOverlayClick} style={{
      position: 'fixed',
      top: 0,
      left: 0,
      right: 0,
      bottom: 0,
      background: 'rgba(0,0,0,0.5)',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      zIndex: 1000,
      padding: '20px',
    }}>

const ProfileView = ({ profile, onSaveProfile, onNavigate }) => {
  const [form, setForm] = React.useState({
    name: profile?.name || '',
    position: profile?.position || '',
    email: profile?.email || '',
  });
  const [signature, setSignature] = React.useState(profile?.signatureUrl || null);
  const [showSignaturePad, setShowSignaturePad] = React.useState(false);
  const [dragOver, setDragOver] = React.useState(false);
  const fileInputRef = React.useRef(null);

  const handleChange = (field, value) => {
    setForm((prev) => ({ ...prev, [field]: value }));
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    const file = e.dataTransfer?.files?.[0];
    if (file && file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (ev) => setSignature(ev.target.result);
      reader.readAsDataURL(file);
    }
  };

const ConfigView = ({ config, onSaveConfig, onNavigate, onExcelDataLoaded, onTemplatesLoaded }) => {
  const [excelState, setExcelState] = React.useState({
    loading: false,
    progress: 0,
    stage: '',
    loaded: false,
    fileName: '',
    recordCount: 0,
  });
  const [folderState, setFolderState] = React.useState({
    selected: false,
    folderName: '',
    templates: [],
  });
  const [dragOverExcel, setDragOverExcel] = React.useState(false);
  const [dragOverFolder, setDragOverFolder] = React.useState(false);
  const excelInputRef = React.useRef(null);
  const folderInputRef = React.useRef(null);

  const stages = [
    { key: 'read', label: 'Lectura del archivo' },
    { key: 'sheets', label: 'Análisis de hojas' },
    { key: 'data', label: 'Extracción de datos' },
    { key: 'ready', label: 'Listo' },
  ];

  const simulateProgress = (onComplete) => {
    let progress = 0;
    const interval = setInterval(() => {
      progress += Math.random() * 18 + 5;
      if (progress >= 100) {
        progress = 100;
        clearInterval(interval);
        if (onComplete) onComplete();
      }
      const stageIdx = progress < 25 ? 0 : progress < 50 ? 1 : progress < 80 ? 2 : 3;
      setExcelState((prev) => ({
        ...prev,
        progress: Math.min(progress, 100),
        stage: stages[stageIdx].label,
      }));
    }, 250);
  };

  const handleExcelFile = (file) => {
    if (!file) return;
    setExcelState({ loading: true, progress: 0, stage: 'Lectura del archivo', loaded: false, fileName: file.name, recordCount: 0 });
    simulateProgress(() => {
      try {
        const reader = new FileReader();
        reader.onload = (e) => {
          const result = parseExcelFile(new Uint8Array(e.target.result));
          setExcelState({
            loading: false,
            progress: 100,
            stage: 'Listo',
            loaded: true,
            fileName: file.name,
            recordCount: result.records.length,
          });
          onExcelDataLoaded(result.records, result.db);
        };
        reader.readAsArrayBuffer(file);
      } catch (err) {
        setExcelState({ loading: false, progress: 0, stage: '', loaded: false, fileName: '', recordCount: 0 });
      }
    });
  };

  const handleExcelDrop = (e) => {
    e.preventDefault();
    setDragOverExcel(false);
    const file = e.dataTransfer?.files?.[0];
    if (file) handleExcelFile(file);
  };

  const handleExcelSelect = (e) => {
    const file = e.target?.files?.[0];
    if (file) handleExcelFile(file);
  };

  const handleFolderSelect = async (e) => {
    const files = e.target?.files;
    if (files && files.length > 0) {
      const tplFiles = Array.from(files).filter((f) => f.name.endsWith('.docx'));

        selected: true,
        folderName: files[0].webkitRelativePath?.split('/')[0] || 'Plantillas',
        templates: tplFiles.map((f) => ({ name: f.name, size: f.size })),
      });

      onTemplatesLoaded(parsedTemplates);
    }

            }}

              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />

            </svg>

const DataView = ({ records, onUpdateRecords, onNavigate, recordsDb }) => {
  const [currentPage, setCurrentPage] = React.useState(1);
  const [jumpPage, setJumpPage] = React.useState('');
  const [searchTerm, setSearchTerm] = React.useState('');
  const [filters, setFilters] = React.useState({
    numeroCuenta: '',
    proceso: '',
    radicado: '',
    fechaSolicitud: '',
    fechaVencimiento: '',
  });
  const PAGE_SIZE = 20;

  const filteredRecords = React.useMemo(() => {
    if (!records) return [];
    if (searchTerm) return searchRecords(records, searchTerm);
    return records.filter((r) => {
      if (filters.numeroCuenta && !(r.numeroCuenta || '').toLowerCase().includes(filters.numeroCuenta.toLowerCase())) return false;
      if (filters.proceso && !(r.numeroProceso || '').toLowerCase().includes(filters.proceso.toLowerCase())) return false;
      if (filters.radicado && !(r.radicadoEntrada || '').toLowerCase().includes(filters.radicado.toLowerCase())) return false;
      if (filters.fechaSolicitud && !(r.fechaSolicitud || '').toLowerCase().includes(filters.fechaSolicitud.toLowerCase())) return false;
      if (filters.fechaVencimiento && !(r.fechaVencimiento || '').toLowerCase().includes(filters.fechaVencimiento.toLowerCase())) return false;
      return true;
    });
  }, [records, filters, searchTerm]);

  const totalPages = Math.max(1, Math.ceil(filteredRecords.length / PAGE_SIZE));
  const safePage = Math.min(currentPage, totalPages);
  const startIdx = (safePage - 1) * PAGE_SIZE;
  const endIdx = Math.min(startIdx + PAGE_SIZE, filteredRecords.length);
  const pageRecords = filteredRecords.slice(startIdx, endIdx);
  const selectedCount = filteredRecords.filter((r) => r.selected).length;

  const handleFilterChange = (field, value) => {
    setFilters((prev) => ({ ...prev, [field]: value }));
    setCurrentPage(1);
  };

  const toggleRecord = (id) => {
    const updated = records.map((r) => (r.id === id ? { ...r, selected: !r.selected } : r));
    onUpdateRecords(updated);
  };

  const toggleAll = () => {
    const allSelected = pageRecords.every((r) => r.selected);
    const updated = records.map((r) => {
      const onPage = pageRecords.some((p) => p.id === r.id);
      return onPage ? { ...r, selected: !allSelected } : r;
    });
    onUpdateRecords(updated);
  };

  const markPage = () => {
    const updated = records.map((r) => {
      const onPage = pageRecords.some((p) => p.id === r.id);
      return onPage ? { ...r, selected: true } : r;
    });
    onUpdateRecords(updated);
  };

  const handleJump = () => {
    const page = parseInt(jumpPage, 10);
    if (page >= 1 && page <= totalPages) {
      setCurrentPage(page);
      setJumpPage('');
    }
  };

  const handleFilterKeyDown = (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
    }
  };

  if (!records || records.length === 0) {
    return (
      <div className="animate-fade-in">
        <div className="main-container">
          <div className="card" style={{ padding: '3rem', textAlign: 'center' }}>
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{ margin: '0 auto 1rem' }}>
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
            </svg>
            <h3 style={{ fontSize: '1.1rem', fontWeight: 700, color: '#475569', marginBottom: '0.5rem' }}>
              No hay registros cargados
            </h3>
            <p style={{ fontSize: '0.85rem', color: '#94a3b8', marginBottom: '1.5rem' }}>
              Carga un archivo Excel en el Módulo 2 para ver los datos aquí.
            </p>
            <button className="btn-primary" onClick={() => onNavigate('config')}>

                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />

            </button>
          </div>
        </div>
      </div>
    </div>
  );
};


const TemplatesView = ({ templates, selectedTemplate, onSelectTemplate, onNavigate, profile, records }) => {
  const [search, setSearch] = React.useState('');
  const [previewRecord, setPreviewRecord] = React.useState(0);
  const [viewMode, setViewMode] = React.useState('live');
  const [docxRendering, setDocxRendering] = React.useState(false);
  const previewRef = React.useRef(null);
  const renderedTemplateId = React.useRef(null);

  const filtered = React.useMemo(() => {
    if (!templates) return [];
    return templates.filter((t) => {
      const matchSearch = !search || t.title.toLowerCase().includes(search.toLowerCase()) || t.description.toLowerCase().includes(search.toLowerCase());
      return matchSearch;
    });
  }, [templates, search]);

  const record = records && records.length > 0 ? records[Math.min(previewRecord, records.length - 1)] : null;

  const selected = templates?.find((t) => t.id === selectedTemplate?.id) || selectedTemplate;

  const renderContent = () => {
    if (!selected) return null;
    const content = selected.sampleContent || '';
    if (viewMode === 'live' && record) {
      return replaceTemplateVariables(content, record, profile);
    }
    return content;
  };

  React.useEffect(() => {
    if (!selected || !previewRef.current) {
      renderedTemplateId.current = null;
      return;
    }
    if (renderedTemplateId.current === selected.id) return;
    if (!selected.file) {
      renderedTemplateId.current = selected.id;
      return;
    }
    setDocxRendering(true);
    const container = previewRef.current;
    container.innerHTML = '';
    const blob = selected.file;
    const options = {
      className: 'docx-preview',
      inWrapper: true,
      ignoreWidth: false,
      ignoreHeight: false,
      ignoreFonts: false,
      breakPages: true,
      debug: false,
      experimental: false,
      trimXmlDeclaration: true,
      ignoreLastRenderedPageBreak: true,
      renderHeaders: true,
      renderFooters: true,
      renderFootnotes: false,
      renderEndnotes: false,
    };
    docx.renderAsync(blob, container, null, options)
      .then(() => {
        renderedTemplateId.current = selected.id;
        setDocxRendering(false);

      .catch((err) => {
        console.warn('docx-preview error:', err);
        setDocxRendering(false);

const GenerateView = ({ template, records, profile, history, onAddHistory }) => {
  const [progress, setProgress] = React.useState(0);
  const [processing, setProcessing] = React.useState(true);
  const [docResults, setDocResults] = React.useState([]);
  const [downloading, setDownloading] = React.useState(null);

  const selectedRecords = records?.filter((r) => r.selected) || [];
  const successCount = docResults.filter((d) => d.status === 'success').length;
  const errorCount = docResults.filter((d) => d.status === 'error').length;

  const generateDocxForRecord = async (record) => {
    if (!template?.file) {
      return { id: record.id, status: 'error', name: `documento_${record.numeroCuenta || record.id}`, error: 'Sin plantilla DOCX' };
    }
    try {
      const arrayBuffer = await template.file.arrayBuffer();
      const zip = await JSZip.loadAsync(arrayBuffer);
      
      // Helper to apply replacements to a single XML string (document.xml, headers, footers)
      const applyReplacements = (xml) => {
        // Process each paragraph: combine all w:t text, replace markers, write back
        return xml.replace(/<w:p\b[^>]*>([\s\S]*?)<\/w:p>/g, (paraContent) => {
          const texts = [];
          paraContent.replace(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g, (m, t) => { texts.push(t); });
          const combined = texts.join('');
          const markers = combined.match(/\[[A-Z_]+\]/g);
          if (!markers || markers.length === 0) return paraContent;
          
          // Replace ALL markers in the combined text using replaceTemplateVariables
          const replaced = replaceTemplateVariables(combined, record, profile);
          if (replaced === combined) return paraContent;
          
          // Write replaced text to first w:t, empty the rest
          let idx = 0;
          return paraContent.replace(/(<w:t(?:\s[^>]*)?>)([\s\S]*?)(<\/w:t>)/g, (m, open, text, close) => {
            if (idx === 0) { idx++; return open + replaced + close; }
            return open + close;
          });
        });
      };
      
      // Process word/document.xml
      let docXmlFile = zip.file('word/document.xml');
      if (docXmlFile) {
        let docXml = await docXmlFile.async('text');
        
        // Handle signature with proper DrawingML
        if (docXml.includes('[FIRMA_DOCUMENTO]') && profile?.signatureUrl && profile.signatureUrl.startsWith('data:image')) {
          const sigMatch = profile.signatureUrl.match(/^data:image\/(\w+);base64,(.+)$/);
          if (sigMatch) {
            const ext = sigMatch[1] === 'jpeg' ? 'jpg' : sigMatch[1];
            const b64 = sigMatch[2];
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
            zip.file('word/media/signature.' + ext, bytes);
            
            const relsFile = zip.file('word/_rels/document.xml.rels');
            let relsXml = relsFile ? await relsFile.async('text') : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
            const idMatches = relsXml.match(/Id="rId(\d+)"/g) || [];
            let maxId = 0;
            idMatches.forEach((m) => { const n = parseInt(m.match(/\d+/)[0]); if (n > maxId) maxId = n; });
            const newId = maxId + 1;
            const relType = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/image';
            const newRel = '<Relationship Id="rId' + newId + '" Type="' + relType + '" Target="media/signature.' + ext + '"/>';
            relsXml = relsXml.replace('</Relationships>', newRel + '</Relationships>');
            zip.file('word/_rels/document.xml.rels', relsXml);
            
            const cx = 1800000;
            const cy = 720000;
            const drawingXml = 
              '<w:drawing>' +
                '<wp:inline distT="0" distB="0" distL="0" distR="0" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
                  '<wp:extent cx="' + cx + '" cy="' + cy + '"/>' +
                  '<wp:docPr id="1" name="Firma"/>' +
                  '<wp:cNvGraphicFramePr/>' +
                  '<a:graphic>' +
                    '<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
                      '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
                        '<pic:nvPicPr>' +
                          '<pic:cNvPr id="0" name="signature"/>' +
                          '<pic:cNvPicPr/>' +
                        '</pic:nvPicPr>' +
                        '<pic:blipFill>' +
                          '<a:blip r:embed="rId' + newId + '"/>' +
                          '<a:stretch><a:fillRect/></a:stretch>' +
                        '</pic:blipFill>' +
                        '<pic:spPr>' +
                          '<a:xfrm>' +
                            '<a:off x="0" y="0"/>' +
                            '<a:ext cx="' + cx + '" cy="' + cy + '"/>' +
                          '</a:xfrm>' +
                          '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom>' +
                        '</pic:spPr>' +
                      '</pic:pic>' +
                    '</a:graphicData>' +
                  '</a:graphic>' +
                '</wp:inline>' +
              '</w:drawing>';
            
            // Replace [FIRMA_DOCUMENTO] with drawing - handle split across w:t
            docXml = patchXmlText(docXml, '[FIRMA_DOCUMENTO]', drawingXml);
          }
        }
        
        docXml = applyReplacements(docXml);
        zip.file('word/document.xml', docXml);
      }
      
      // Process headers and footers too
      const headerFiles = Object.keys(zip.files).filter(f => f.startsWith('word/header') && f.endsWith('.xml'));
      for (const hf of headerFiles) {
        const hfXml = await zip.file(hf).async('text');
        zip.file(hf, applyReplacements(hfXml));
      }
      const footerFiles = Object.keys(zip.files).filter(f => f.startsWith('word/footer') && f.endsWith('.xml'));
      for (const hf of footerFiles) {
        const hfXml = await zip.file(hf).async('text');
        zip.file(hf, applyReplacements(hfXml));
      }
      
      const outBlob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
      const fileName = `${(template.title || 'documento').replace(/[^a-zA-Z0-9]/g, '_')}_${record.numeroCuenta || record.id}.docx`;
      return { id: record.id, status: 'success', name: fileName, blob: outBlob, record };
    } catch (err) {
      console.error('DOCX generation error:', err);
      return { id: record.id, status: 'error', name: `documento_${record.numeroCuenta || record.id}`, error: err.message };
    }
  };

  React.useEffect(() => {
    if (!processing) return;
    let idx = 0;
    const results = [];
    const processNext = async () => {
      if (idx >= selectedRecords.length) {
        setProcessing(false);
        setProgress(100);
        if (onAddHistory) {
          const hasErrors = results.some((r) => r.status === 'error');
          onAddHistory({
            id: `gen-${Date.now()}`,
            date: new Date().toLocaleDateString('es-CO'),
            type: selectedRecords.length > 1 ? 'Masivo' : 'Individual',
            status: hasErrors ? 'Parcial' : 'Completado',
            recordsCount: selectedRecords.length,
            templateName: template?.title || 'Plantilla',
          });
        }
        return;
      }
      const result = await generateDocxForRecord(selectedRecords[idx]);
      results.push(result);
      setDocResults([...results]);
      idx++;
      setProgress(Math.round((idx / selectedRecords.length) * 100));
      setTimeout(processNext, 50);
    };
    processNext();
  }, []);

  const downloadSingle = (doc) => {
    if (!doc?.blob) return;
    setDownloading(doc.id);
    saveAs(doc.blob, doc.name);
    setTimeout(() => setDownloading(null), 800);
  };

  const downloadAll = async () => {
    const successDocs = docResults.filter((d) => d.status === 'success' && d.blob);
    if (successDocs.length === 0) return;
    if (successDocs.length === 1) {
      downloadSingle(successDocs[0]);
      return;
    }
    setDownloading('zip');
    const zip = new JSZip();
    const folder = zip.folder('ESSA_Documentos_Generados');
    successDocs.forEach((doc) => folder.file(doc.name, doc.blob));
    const blob = await zip.generateAsync({ type: 'blob' });
    saveAs(blob, `ESSA_Documentos_${new Date().toISOString().slice(0, 10)}.zip`);
    setTimeout(() => setDownloading(null), 800);
  };

  return (
    <div className="animate-fade-in">
      <div className="main-container" style={{ maxWidth: 1200, margin: '0 auto' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '24px' }}>
          <div style={{ width: '44px', height: '44px', borderRadius: '12px', background: '#eff6ff', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#004b93" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><path d="M12 18v-6" /><path d="M9 15l3 3 3-3" />
            </svg>
          </div>
          <div>
            <h2 style={{ fontSize: '1.3rem', fontWeight: 700, color: '#1e293b', margin: 0 }}>Módulo 6: Generación y Descarga</h2>
            <p style={{ fontSize: '0.8rem', color: '#64748b', margin: 0 }}>Documentos Word generados desde la plantilla con datos reales</p>
          </div>
        </div>

        <div className="gen-summary-grid">
          <div className="gen-stat-card">
            <div className="stat-icon" style={{ background: '#eff6ff' }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#004b93" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /></svg>
            </div>
            <div className="stat-value" style={{ color: '#004b93' }}>{selectedRecords.length}</div>
            <div className="stat-label">Total documentos</div>
          </div>
          <div className="gen-stat-card">
            <div className="stat-icon" style={{ background: '#ecfdf5' }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#059669" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>
            </div>
            <div className="stat-value" style={{ color: '#059669' }}>{successCount}</div>
            <div className="stat-label">Correctos</div>
          </div>
          <div className="gen-stat-card">
            <div className="stat-icon" style={{ background: '#fef2f2' }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2626" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><line x1="15" y1="9" x2="9" y2="15" /><line x1="9" y1="9" x2="15" y2="15" /></svg>
            </div>
            <div className="stat-value" style={{ color: '#dc2626' }}>{errorCount}</div>
            <div className="stat-label">Con error</div>
          </div>
          <div className="gen-stat-card">
            <div className="stat-icon" style={{ background: '#f5f3ff' }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2" /><path d="M16 7V5a4 4 0 0 0-8 0v2" /></svg>
            </div>
            <div className="stat-value" style={{ color: '#7c3aed' }}>DOCX</div>
            <div className="stat-label">Formato</div>
          </div>
        </div>

        <div style={{ background: '#fff', borderRadius: '12px', border: '1px solid #e2e8f0', padding: '20px 24px', marginBottom: '20px' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '10px' }}>
            <span style={{ fontSize: '0.85rem', fontWeight: 600, color: '#1e293b' }}>
              {processing ? `Procesando ${docResults.length} de ${selectedRecords.length}...` : errorCount > 0 ? `Completado con ${errorCount} error(es)` : 'Generación completada'}
            </span>
            <span style={{ fontSize: '0.85rem', fontWeight: 700, color: processing ? '#004b93' : '#059669' }}>{progress}%</span>
          </div>
          <div className="gen-progress-track">
            <div className={`gen-progress-fill ${!processing ? 'complete' : ''}`} style={{ width: `${progress}%` }} />
          </div>
          <div style={{ fontSize: '0.75rem', color: '#64748b', marginTop: '8px' }}>
            {processing ? 'Generando documentos Word con estructura DOCX real...' : `${successCount} listo${successCount !== 1 ? 's' : ''} para descargar`}
          </div>
        </div>

        {!processing && (
          <div className="fade-in" style={{ display: 'flex', gap: '12px', marginBottom: '20px' }}>
            <button className="btn-success" onClick={downloadAll} disabled={successCount === 0} style={{ padding: '14px 24px', fontSize: '0.9rem', fontWeight: 700, flex: 1, justifyContent: 'center' }}>
              {downloading ? (
                <svg width="18" height="18" viewBox="0 0 24 24" className="animate-spin" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10" strokeOpacity="0.3" /><path d="M12 2 A10 10 0 0 1 22 12" /></svg>
              ) : successCount === 1 ? (
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /></svg>
              ) : (
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>
              )}
              {successCount === 1 ? 'Descargar DOCX' : `Descargar ZIP (${successCount} documentos)`}
            </button>
          </div>
        )}

        <div className="gen-doc-list">
          <div className="list-header">
            <div style={{ fontSize: '0.85rem', fontWeight: 700, color: '#1e293b' }}>Documentos generados</div>
            <div style={{ fontSize: '0.75rem', color: '#64748b' }}>{docResults.length} de {selectedRecords.length}</div>
          </div>
          {docResults.length === 0 && processing && (
            <div style={{ padding: '2rem', textAlign: 'center', color: '#94a3b8', fontSize: '0.85rem' }}>
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" strokeWidth="1.5" style={{ margin: '0 auto 0.75rem', display: 'block', animation: 'spin 1s linear infinite' }}>
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
              </svg>
              Iniciando generación...
            </div>
          )}
          {docResults.map((doc, i) => (
            <div key={doc.id} className="list-row fade-in" style={{ animationDelay: `${i * 30}ms` }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px', flex: 1, minWidth: 0 }}>
                <div style={{ width: '32px', height: '32px', borderRadius: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, background: doc.status === 'success' ? '#ecfdf5' : '#fef2f2' }}>
                  {doc.status === 'success' ? (
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" strokeWidth="2.5"><polyline points="20 6 9 17 4 12" /></svg>
                  ) : (
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dc2626" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
                  )}
                </div>
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div style={{ fontSize: '0.8rem', fontWeight: 600, color: '#1e293b', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{doc.name}</div>
                  <div style={{ fontSize: '0.7rem', color: doc.status === 'success' ? '#059669' : '#dc2626' }}>
                    {doc.status === 'success' ? `Cuenta: ${doc.record?.numeroCuenta || '—'} — ${doc.record?.nombreSolicitante || ''}` : doc.error}
                  </div>
                </div>
              </div>
              {doc.status === 'success' && (
                <button className="btn-secondary" onClick={() => downloadSingle(doc)} disabled={downloading === doc.id} style={{ padding: '6px 14px', fontSize: '0.75rem', fontWeight: 600, flexShrink: 0 }}>
                  {downloading === doc.id ? 'Descargando...' : 'DOCX'}
                </button>
              )}
            </div>
          ))}
          {!processing && docResults.length === 0 && (
            <div style={{ padding: '2rem', textAlign: 'center', color: '#94a3b8' }}>No se generaron documentos</div>
          )}
        </div>

        <div style={{ display: 'flex', gap: '12px', marginTop: '24px', justifyContent: 'space-between' }}>
          <button className="btn-secondary" onClick={() => onNavigate('preview')} style={{ padding: '10px 20px' }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></svg>
            Volver a Vista Previa
          </button>
          <button className="btn-secondary" onClick={() => onNavigate('home')} style={{ padding: '10px 20px' }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>
            Inicio
          </button>
        </div>
      </div>
    </div>
  );
};


// ============================================
// Main App - ESSA Generador Documental
// ============================================

const { useState } = React;

const App = () => {
  const [currentStep, setCurrentStep] = useState('inicio');
  const [generationSubView, setGenerationSubView] = useState('preview');
  const [profile, setProfile] = useState(initialProfile);
  const [config, setConfig] = useState({
    excelFileName: '',
    excelLoaded: false,
    templateFolderName: '',
    templatesLoaded: false,
    selectedPqrAgpeFolder: 'Plantillas_Reclamos_PQR_AGPE',
    folders: ['Plantillas_Reclamos_PQR_AGPE', 'Documentos_2025', 'Contratos_ESSA', 'Reportes_Ventas'],
  });
  const [templates, setTemplates] = useState(sampleTemplates);
  const [selectedTemplateId, setSelectedTemplateId] = useState(null);
  const selectedTemplate = templates.find((t) => t.id === selectedTemplateId) || null;
  const [records, setRecords] = useState([]);
  const [recordsDb, setRecordsDb] = useState(null);
  const [history, setHistory] = useState(initialHistory);
  const [completedSteps, setCompletedSteps] = useState(['inicio', 'perfil', 'configuracion', 'datos']);

  const excelCount = records.length;
  const markedCount = records.filter((r) => r.selected).length;

  const navMap = {
    home: 'inicio',
    profile: 'perfil',
    config: 'configuracion',
    data: 'datos',
    templates: 'plantillas',
    preview: 'generacion',
    generate: 'generacion',
    inicio: 'inicio',
    perfil: 'perfil',
    configuracion: 'configuracion',
    datos: 'datos',
    plantillas: 'plantillas',
    generacion: 'generacion',
  };

  const handleStepChange = (step) => {
    const mapped = navMap[step] || step;
    if (mapped === 'generacion' && !selectedTemplateId) {
      alert("Por favor, seleccione una plantilla primero en el Módulo 4: Selección de Plantillas.");
      return;
    }
    setCurrentStep(mapped);
    if (!completedSteps.includes(mapped)) {
      setCompletedSteps((prev) => [...prev, mapped]);
    }
  };

  return (
    <div className="min-h-screen flex flex-col" style={{ backgroundColor: '#f0f4f9', color: '#1e293b', fontFamily: "'Plus Jakarta Sans', system-ui, sans-serif" }}>
      <Header
        currentStep={currentStep}
        onSelectStep={handleStepChange}
        excelCount={excelCount}
        markedCount={markedCount}
        profile={profile}
        completedSteps={completedSteps}
      />

      {currentStep !== 'inicio' && (
        <StepperBar
          currentStep={currentStep}
          onSelectStep={handleStepChange}
        />
      )}

      <main className="flex-1" style={{ maxWidth: 1600, width: '100%', margin: '0 auto', padding: '1.5rem' }}>
        {currentStep === 'inicio' && (
          <HomeView
            onNavigate={handleStepChange}
            selectedTemplate={selectedTemplate}
            selectedRecord={records.find((r) => r.selected) || records[0]}
            hasExcelLoaded={config.excelLoaded}
          />
        )}

        {currentStep === 'perfil' && (
          <ProfileView
            profile={profile}
            onSaveProfile={(updated) => setProfile(updated)}
            onNavigate={handleStepChange}
          />
        )}

        {currentStep === 'configuracion' && (
          <ConfigView
            config={config}
            onSaveConfig={(updated) => setConfig(updated)}
            onNavigate={handleStepChange}
            onExcelDataLoaded={(newRecords, db) => { setRecords(newRecords); setRecordsDb(db); }}
            onTemplatesLoaded={(newTemplates) => {
              setTemplates(newTemplates);
            }}
          />
        )}

        {currentStep === 'datos' && (
          <DataView
            records={records}
            onUpdateRecords={(updated) => setRecords(updated)}
            onNavigate={(step) => {
              if (step === 'generacion') setGenerationSubView('preview');
              handleStepChange(step);
            }}
            recordsDb={recordsDb}
          />
        )}

        {currentStep === 'plantillas' && (
          <TemplatesView
            templates={templates}
            selectedTemplate={selectedTemplate}
            onSelectTemplate={(tplId) => setSelectedTemplateId(tplId)}
            onNavigate={handleStepChange}
            profile={profile}
            records={records}
          />
        )}

        {currentStep === 'generacion' && (
          <div className="space-y-4">
            <div className="flex items-center justify-between card" style={{ padding: '0.625rem 1.25rem' }}>
              <div className="flex items-center gap-2 text-xs font-bold" style={{ color: '#475569' }}>
                <span style={{ color: '#94a3b8' }}>Flujo Final:</span>
                <button
                  type="button"
                  onClick={() => setGenerationSubView('preview')}
                  className="px-3 py-1 rounded-lg"
                  style={{
                    backgroundColor: generationSubView === 'preview' ? '#004b93' : 'transparent',
                    color: generationSubView === 'preview' ? '#fff' : '#475569',
                    border: 'none',
                    cursor: 'pointer',
                    fontWeight: 700,
                    fontSize: '0.75rem',
                  }}
                >
                  Módulo 5: Vista Previa Real
                </button>
                <button
                  type="button"
                  onClick={() => setGenerationSubView('download')}
                  className="px-3 py-1 rounded-lg"
                  style={{
                    backgroundColor: generationSubView === 'download' ? '#004b93' : 'transparent',
                    color: generationSubView === 'download' ? '#fff' : '#475569',
                    border: 'none',
                    cursor: 'pointer',
                    fontWeight: 700,
                    fontSize: '0.75rem',
                  }}
                >
                  Módulo 6: Generación y Descarga
                </button>
              </div>
              <div className="text-xs font-medium hidden sm:block" style={{ color: '#64748b' }}>
                Plantilla: <strong style={{ color: '#1e293b' }}>{selectedTemplate?.title || 'Ninguna seleccionada'}</strong>
              </div>
            </div>

            {generationSubView === 'preview' ? (
              <PreviewView
                template={selectedTemplate}
                selectedRecords={records.filter((r) => r.selected)}
                profile={profile}
                onNavigate={(step) => {
                  if (step === 'generacion') setGenerationSubView('download');
                  else handleStepChange(step);
                }}
              />
            ) : (
              <GenerateView
                template={selectedTemplate}
                records={records}
                profile={profile}
                history={history}
                onAddHistory={(newItem) => setHistory((prev) => [newItem, ...prev])}
              />
            )}
          </div>
        )}
      </main>

      <Footer />
    </div>
  );
};

// Mount the application
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));



</script>
  </body>
</html>
