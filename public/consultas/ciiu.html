umentos o parques y demás equipos de iluminación exterior.","La fabricación de equipos de iluminación de carretera (excepto semáforos).","La fabricación de equipo de iluminación para equipos de transporte (ej.: para vehículos a motor, aviones, botes) como: faros (excepto faros reflectores sellados), lámparas o luces de estacionamiento, de aviso, direccionales o de iluminación interior.","La fabricación de avisos y carteles iluminados, placas de matrícula iluminadas, y otros anuncios similares."],"n":["La fabricación de vidrio y partes de vidrio para aparatos eléctricos (por ejemplo la fabricación de bulbos de vidrio para bombillas). Se incluye en el código 2310, «Fabricación de vidrio y productos de vidrio».","La fabricación de dispositivos de cableado transportadores de corriente para aparatos eléctricos. Se incluye en el código 2732, «Fabricación de dispositivos de cableado».","La fabricación de ventiladores de techo o baño con aparatos eléctricos integrados. Se incluye en el código 2750, «Fabricación de aparatos de uso doméstico».","La fabricación de equipos de señalización eléctrica tales como semáforos y equipos de señalización peatonal. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","El mantenimiento y reparación especializado de equipos eléctricos de iluminación. Se incluyen en el código 3314, «Mantenimiento y reparación especializado de equipo eléctrico»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["27","Fabricación de aparatos y equipo eléctrico"],"g":["274","Fabricación de equipos eléctricos de iluminación"],"o":""}},{"c":"2750","d":"Fabricación de aparatos de uso doméstico","b":true,"m":"El Usuario Industrial con Código CIIU 2750 cuya Actividad Económica Principal es Fabricación de aparatos de uso doméstico es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de electrodomésticos como: refrigeradores, congeladores, lavaplatos, máquinas de lavar y secar, aspiradoras, enceradoras de piso, trituradores de desperdicio, aparatos para preparar o elaborar alimentos (moledoras, licuadoras, exprimidoras, abrelatas, entre otros), máquinas de afeitar eléctricas, cepillos de dientes eléctricos y otros artículos eléctricos de cuidado personal, afilador de cuchillos, y campanas de ventilación y absorción de humos.","La fabricación de aparatos termoeléctricos de uso doméstico como: calentadores de agua eléctricos, mantas eléctricas, aparatos de peluquería termoeléctricos (secadores, peines, cepillos, rizadores), planchas eléctricas, calentadores de ambiente y ventiladores de uso doméstico, hornos eléctricos, hornos microondas, cocinillas eléctricas, planchas de cocinar, tostadores, cafeteras o teteras, sartenes, asadores, parrillas, tapas, y resistencias eléctricas para calefacción.","La fabricación de equipos de cocina y calefacción de uso doméstico, no eléctricos: calentadores de uso doméstico para ambientes, cocinillas, parrillas, cocinas, calentadores de agua, aparatos de cocina y calentadores de platos.","El mantenimiento y reparación de aparatos y equipo doméstico cuando se realizan en la misma unidad que los produce."],"n":["La fabricación de equipos electrónicos de audio y video para entretenimiento en el hogar, como televisores, DVD, equipos de sonido, radios, videograbadoras, entre otros. Se incluye en el código 2640, «Fabricación de aparatos electrónicos de consumo».","La fabricación de refrigeradores y congeladores de uso industrial y comercial, aparatos de aire acondicionado, ventiladores de techo, calderas permanentes instaladas, ventilación comercial y extractores, equipo de cocina tipo comercial, equipo de lavandería y lavado al seco y equipo de planchado comercial, y aspiradoras comerciales, industriales e institucionales. Se incluye en la clase correspondiente de la división 28, «Fabricación de maquinaria y equipo n.c.p.».","La fabricación de equipo de refrigeración de uso comercial. Se incluye en el código 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de cubas de enfriamiento para alimentos o bebidas y la fabricación de maquinaria para la preparación de alimentos en establecimientos comerciales. Se incluyen en el código 2825, «Fabricación de maquinaria para la elaboración de alimentos, bebidas y tabaco».","La fabricación de equipo de calefacción eléctrica, de montaje permanente, para ambientes y piscinas (no portátil). Se incluye en el código 2815, «Fabricación de hornos, hogares y quemadores industriales».","La fabricación de ventiladores de uso industrial, y campanas de ventilación para uso comercial, industrial y en laboratorios; ventiladores de ático o de techo. Se incluye en el código 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de máquinas de coser de tipo doméstico. Se incluye en el código 2826, «Fabricación de maquinaria para la elaboración de productos textiles, prendas de vestir y cueros».","El mantenimiento y reparación de aparatos de uso doméstico cuando es realizado por establecimientos dedicados exclusivamente a dicha actividad. Se incluye en el código 9522, «Mantenimiento y reparación de aparatos y equipos domésticos y de jardinería».","La instalación de sistemas centrales de limpieza por aspiración al vacío. Se incluye en el código 4329, «Otras instalaciones especializadas»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["27","Fabricación de aparatos y equipo eléctrico"],"g":["275","Fabricación de aparatos de uso doméstico"],"o":""}},{"c":"2790","d":"Fabricación de otros tipos de equipo eléctrico n.c.p.","b":true,"m":"El Usuario Industrial con Código CIIU 2790 cuya Actividad Económica Principal es Fabricación de otros tipos de equipo eléctrico n.c.p. es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de cargadores de baterías de estado sólido.","La fabricación de timbres eléctricos.","La fabricación de cables de extensión de alambre aislado.","La fabricación de máquinas de limpieza ultrasónica (excepto de laboratorio y de uso odontológico).","La fabricación de cámaras bronceadoras.","La fabricación de inversores de estado sólido, rectificadores, convertidores, células energéticas, fuentes de poder reguladas y no reguladas, y convertidores estáticos.","La fabricación de sistemas de potencia interrumpidos UPS. (Dispositivo que mantiene el suministro continuo de energía eléctrica a un determinado equipo tomando energía de otra fuente cuando la misma no está disponible a través del servicio público de electricidad).","La fabricación de limitadores de sobretensión (excepto para voltajes de distribución). Estos son dispositivos utilizados para proteger equipos que utilizan energía eléctrica (computadores) de tensiones o voltajes elevados a través de la reducción de dicha sobretensión.","La fabricación de juegos de cable (a excepción de los juegos de cable de encendido para motores de vehículos automotores) de alambre aislado.","La fabricación de electrodos de grafito y carbón, contactos y otros productos eléctricos de grafito y carbón.","La fabricación de capacitancias, resistencias, transformadores, condensadores y componentes similares.","La fabricación de electroimanes, incluso portaherramientas. Elementos de sujeción eléctrica, embragues, frenos, acoplamientos, abrazaderas o cabezales alzadores electromagnéticos o de imán permanente.","La fabricación de dispositivos de señalización acústica tales como bocinas, sirenas y otros artefactos eléctricos similares. Otros aparatos de señalización visual o acústica accionados por electricidad (ej.: paneles indicadores, entre otros), excepto alarmas contra robos y alarmas contra incendio.","La fabricación de tableros de marcación (como los usados en los estadios y escenarios deportivos).","La fabricación de equipos de señalización eléctrica tales como semáforos.","La fabricación de aislantes eléctricos (excepto vidrio o porcelana), tubos y juntas de metal común, forrados de material aislante para la conducción de electricidad.","La fabricación de equipo eléctrico de soldadura autógena y de soldadura blanda, incluidos soldadores manuales.","La fabricación de aparatos y dispositivos eléctricos de encendido o de arranque para motores de combustión interna, de encendido por chispa o por compresión.","La fabricación de equipo y componentes eléctricos para motores de combustión interna.","La fabricación de aparatos y sus partes eléctricas para motocicletas.","La fabricación de máquinas y aparatos eléctricos no clasificados en otra parte: aceleradores de partículas (utilizan campos electromagnéticos para acelerar las partículas cargadas eléctricamente hasta alcanzar energías muy altas, pudiendo ser cercanas a la de la luz), generadores de señales, detonadores eléctricos de minas y desempañadores con resistencias eléctricas para aeronaves, embarcaciones, trenes y otras máquinas y aparatos eléctricos.","La fabricación de dispositivos eléctricos de apertura y cierre de puertas.","La fabricación de marcadores electrónicos."],"n":["La fabricación de envolturas de vidrio para lámparas. Se incluye en el código 2310, «Fabricación de vidrio y productos de vidrio».","La fabricación de aisladores eléctricos de cerámica. Se incluye en el código 2393, «Fabricación de otros productos de cerámica y porcelana».","La fabricación de fibras de carbón y grafito y productos de estas fibras (excepto electrodos y electrodomésticos). Se incluye en el código 2399, «Fabricación de otros productos minerales no metálicos n.c.p.».","La fabricación de imanes metálicos permanentes. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de tubos y válvulas electrónicos (incluso válvulas de cátodo frío). Se incluye en el código 2610, «Fabricación de componentes y tableros electrónicos».","La fabricación de rectificadores de tipo electrónico; circuitos integrados reguladores de voltaje, convertidores de energía, condensadores electrónicos, resistencias electrónicas y aparatos similares de tipo electrónico. Se incluye en el código CIIU 2610, «Fabricación de componentes y tableros electrónicos».","La fabricación de alarmas contra robos y alarmas contra incendio que envían señales a una estación de control. Se incluye en el código 2630, «Fabricación de equipos de comunicación».","La fabricación de generadores de pulso (señales) detectores de señales, detectores de metales, entre otros. Se incluye en el código 2651, «Fabricación de equipo de medición, prueba, navegación y control».","La fabricación de transformadores, motores, generadores, dispositivos de distribución, relés y controles industriales. Se incluye en el código 2711, «Fabricación de motores, generadores y transformadores eléctricos y de aparatos de distribución y control de la energía eléctrica», según corresponda.","La fabricación de motores fuera de borda. Se incluye en el código 2811, «Fabricación de motores, turbinas y partes para motores de combustión interna».","La fabricación de baterías. Se incluye en el código 2720, «Fabricación de pilas, baterías y acumuladores eléctricos».","La fabricación de conductores de energía (ej. trenzas, bandas, barras, entre otros) y de alambres de equipo de comunicación, dispositivos de cableado transportadores de corriente y no transportadores de corriente. Se incluye en el código 2732, «Fabricación de dispositivos de cableado».","La fabricación de tubos y juntas de metal común, forrados de material aislante para la conducción de electricidad. Se incluye en el código CIIU 2732, «Fabricación de dispositivos de cableado».","La fabricación de equipos de iluminación. Se incluye en el código 2740, «Fabricación de equipos eléctricos de iluminación».","La fabricación de equipo de iluminación para equipos de transporte (ej.: para vehículos a motor, aviones, botes), la fabricación de lámparas eléctricas mata insectos, y la fabricación de leña (tipo chimenea) eléctrica. Se incluyen en el código CIIU 2740, «Fabricación de equipos eléctricos de iluminación».","La fabricación de aparatos de tipo doméstico. Se incluye en el código 2750, «Fabricación de aparatos de uso doméstico».","La fabricación de máquinas de afeitar eléctricas. Se incluye en el código CIIU 2750, «Fabricación de aparatos de uso doméstico».","La fabricación de equipo no eléctrico de soldadura. Se incluye en el código 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de pistolas de aspersión accionadas eléctricamente de uso manual. Se incluye en el código CIIU 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de juntas de grafito y carbón. Se incluye en el código 2819 CIIU, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de cortadoras de césped eléctricas. Se incluye en el código 2821, «Fabricación de maquinaria agropecuaria y forestal».","La fabricación de juegos de cable de encendido para motores de vehículos automotores. Se incluye en el código 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores ».","La fabricación de equipos eléctricos para vehículos automotores, tales como generadores, alternadores, bujías, sistemas de energía de puertas y ventanas, y reguladores de voltaje. Se incluye en el código CIIU 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de eliminadores de escarcha y desempañadores eléctricos para vehículos automotores. Se incluye en el código 2930 CIIU, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de equipo mecánico y electromecánico de señalización, seguridad o control de tráfico para vías de ferrocarril o tranvía, carreteras, vías de navegación interior, playas de estacionamiento, instalaciones portuarias o aeropuertos. Se incluye en el código 3020, «Fabricación de locomotoras y de material rodante para ferrocarriles».","La fabricación de instrumentos médicos y dentales eléctricos de uso manual. Se incluye en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","El mantenimiento y reparación especializado de los equipos de esta clase cuando son realizados por establecimientos dedicados exclusivamente a dicha actividad. Se incluyen en el código 3314, «Mantenimiento y reparación especializado de equipo eléctrico»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["27","Fabricación de aparatos y equipo eléctrico"],"g":["279","Fabricación de otros tipos de equipo eléctrico n.c.p."],"o":""}},{"c":"2811","d":"Fabricación de motores, turbinas, y partes para motores de combustión interna","b":true,"m":"El Usuario Industrial con Código CIIU 2811 cuya Actividad Económica Principal es Fabricación de motores, turbinas, y partes para motores de combustión interna es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de motores de combustión interna con émbolos de movimiento rectilíneo o rotativo, y de encendido por chispa eléctrica o por compresión, para usos móviles o estacionarios distintos del de propulsión de vehículos automotores o aeronaves tales como: motores marinos, motores fuera de borda, motores para locomotoras, motores para tractores y motores para maquinaria agropecuaria, industrial y forestal.","La fabricación de partes para todo tipo de motores de combustión interna; por ejemplo, válvulas de admisión y de escape, pistones, anillos para pistones y carburadores, etc.","La fabricación de turbinas de vapor de agua y de otros tipos de vapor.","La fabricación de turbinas hidráulicas, ruedas hidráulicas y maquinaria para su regulación.","La fabricación de turbinas eólicas.","La fabricación de turbinas a gas, excepto los turbopropulsores de reacción o de hélice, para la propulsión de aeronaves. Las turbinas incluidas en esta clase se utilizan en la propulsión marina y como principal fuerza motriz de bombas y generadores eléctricos.","La fabricación de turbo-calderas y máquinas de vapor estáticas con caldera integral.","La fabricación de turboalternadores.","La reconstrucción de los motores y las turbinas contemplados en esta clase."],"n":["La fabricación de motores, generadores y transformadores eléctricos. Se incluye en el código 2711, «Fabricación de motores, generadores y transformadores eléctricos».","La fabricación de piezas y partes mecánicas de todo tipo de material para la transmisión, incluso para vehículos automotores: árboles de levas, cigüeñales, manivelas; árboles de transmisión, chumaceras, cajas de cojinetes, etc. Se incluye en el código 2814, «Fabricación de cojinetes, engranajes, trenes de engranajes y piezas de transmisión».","La fabricación de aparatos y dispositivos eléctricos de encendido o de arranque para motores de combustión interna, de encendido por chispa o por compresión. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de equipo y componentes eléctricos para motores de combustión interna. Se incluye en el código CIIU 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de motores para la propulsión de vehículos automotores. Se incluye en el código 2910, «Fabricación de vehículos automotores y sus motores».","La fabricación de motores para la propulsión, turbo-jets, turbohélices y turbopropulsores de aeronaves. Se incluye en el código 3030, «Fabricación de aeronaves, naves espaciales y de maquinaria conexa».","La fabricación de motores para motocicletas y la reconstrucción de estos motores. Se incluye en el código 3091, «Fabricación de motocicletas».","El mantenimiento y la reparación de motores para uso industrial, motores para buques o locomotoras, y turbinas para la generación de energía y calor. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de motores para uso industrial, motores para buques o locomotoras, y turbinas para la generación de energía y calor. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["281","Fabricación de maquinaria y equipo de uso general"],"o":""}},{"c":"2812","d":"Fabricación de equipos de potencia hidráulica y neumática","b":true,"m":"El Usuario Industrial con Código CIIU 2812 cuya Actividad Económica Principal es Fabricación de equipos de potencia hidráulica y neumática es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de componentes para equipos de potencia hidráulica y neumática (incluyendo bombas y motores hidráulicos, cilindros hidráulicos y neumáticos, válvulas, mangueras, empalmes y accesorios hidráulicos y neumáticos).","La fabricación de dispositivos de preparación de aire para uso en sistemas neumáticos; por ejemplo, los filtros des-unificadores para sistemas neumáticos e hidráulicos y dispositivos de limpieza de aire.","La fabricación de sistemas de propulsión hidráulica o neumática.","La fabricación de equipo de transmisión hidráulica."],"n":["La fabricación de compresores. Se incluye en el código 2813, «Fabricación de otras bombas, compresores, grifos y válvulas».","La fabricación de bombas y válvulas para aplicaciones diferentes a la de los sistemas hidráulicos y neumáticos. Se incluye en el código CIIU 2813, «Fabricación de otras bombas, compresores, grifos y válvulas».","La fabricación de equipo de transmisión mecánica. Se incluye en el código 2814, «Fabricación de cojinetes, engranajes, trenes de engranajes y piezas de transmisión».","El mantenimiento y la reparación de equipos de potencia hidráulica y neumática. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de equipos de potencia hidráulica y neumática. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["281","Fabricación de maquinaria y equipo de uso general"],"o":""}},{"c":"2813","d":"Fabricación de otras bombas, compresores, grifos y válvulas","b":true,"m":"El Usuario Industrial con Código CIIU 2813 cuya Actividad Económica Principal es Fabricación de otras bombas, compresores, grifos y válvulas es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de bombas de aire y vacío, compresores de aire u otros gases.","La fabricación de bombas para líquidos, diferentes de las bombas hidráulicas, que tengan o no dispositivos de medición, incluso bombas de mano y bombas para motores de combustión interna de émbolo (bombas de aceite, agua y combustible para vehículos automotores), bombas para impeler hormigón y otras bombas.","La fabricación de grifos, llaves de paso, válvulas y accesorios similares metálicos o de plástico para tubos, calderas, tanques, cubas y artefactos similares, incluso válvulas reductoras de presión y válvulas reguladas termostáticamente.","La fabricación de bombas manuales.","La fabricación de grifos y válvulas sanitarios, la fabricación de grifos y válvulas de calefacción."],"n":["La fabricación de grifos, llaves de paso, válvulas y artefactos similares de caucho vulcanizado no endurecido, de materiales de cerámica o de vidrio. Se incluye, según el material de que se trate, en el código 2219, «Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.», el código 2310, «Fabricación de vidrio y productos de vidrio», y el código 2393, «Fabricación de otros productos de cerámica y porcelana», respectivamente.","La fabricación de ventiladores para uso doméstico, incluso ventiladores de pie. Se incluye en el código 2750, «Fabricación de aparatos de uso doméstico».","La fabricación de válvulas de admisión y de escape de motores de combustión interna. Se incluye en el código 2811, «Fabricación de motores, turbinas y partes para motores de combustión interna».","La fabricación de equipo de transmisión hidráulica. Se incluye en el código 2812, «Fabricación de equipos de potencia hidráulica y neumática».","La fabricación de bombas hidráulicas. Se incluye en el código CIIU 2812, «Fabricación de equipos de potencia hidráulica y neumática».","La fabricación de compresores para refrigeradores. Se incluye en el código 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","El mantenimiento y la reparación de bombas, compresores, grifos y válvulas. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de bombas para máquinas de tipo industrial. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["281","Fabricación de maquinaria y equipo de uso general"],"o":""}},{"c":"2814","d":"Fabricación de cojinetes, engranajes, trenes de engranajes y piezas de transmisión","b":true,"m":"El Usuario Industrial con Código CIIU 2814 cuya Actividad Económica Principal es Fabricación de cojinetes, engranajes, trenes de engranajes y piezas de transmisión es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de cojinetes de bola y de rodillo, incluso bolas, agujas, rodillos, anillos de rodadura, anillos de sujeción y otras partes de cojinetes.","La fabricación de equipo mecánico de todo tipo de material para la transmisión: manivelas; árboles de transmisión, chumaceras, cajas de cojinetes y cojinetes simples para ejes, engranajes, trenes de engranajes, ruedas de fricción; cajas de engranajes y otros dispositivos para cambios de marchas; embragues, incluso embragues centrífugos automáticos y embragues de aire comprimido; volantes, acoplamientos de árboles, fabricación de poleas.","La fabricación de partes internas del motor, tales como árboles de levas, cigüeñales y volantes, empleados en todo tipo de motores de combustión interna, incluso para vehículos automotores, aeronaves y motocicletas.","La fabricación de cadenas de eslabones articulados y cadenas de transmisión de potencia mecánica."],"n":["La fabricación de cadenas diferentes a las usadas para transmisión mecánica de potencia. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de equipo de transmisión hidráulica. Se incluye en el código 2812, «Fabricación de equipos de potencia hidráulica y neumática».","La fabricación de embragues para vehículos automotores. Se incluye en el código 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de sub-ensambladoras para equipo de transmisión de fuerza motriz, que pueden identificarse como partes de vehículos automotores o de aeronaves. Se incluye en el código CIIU 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores», o el código 3030, «Fabricación de aeronaves, naves espaciales y de maquinaria conexa», respectivamente.","El mantenimiento y la reparación de cojinetes, engranajes, trenes de engranajes y piezas de transmisión. Se incluyen en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["281","Fabricación de maquinaria y equipo de uso general"],"o":""}},{"c":"2815","d":"Fabricación de hornos, hogares y quemadores industriales","b":true,"m":"El Usuario Industrial con Código CIIU 2815 cuya Actividad Económica Principal es Fabricación de hornos, hogares y quemadores industriales es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de hornos, hogares (cámaras de combustión) y quemadores industriales y de laboratorio (muflas).","La fabricación de equipo industrial y de laboratorio para calentamiento por inducción y dieléctrico.","La fabricación de quemadores e incineradores de combustible líquido, combustible sólido, pulverizado y gas.","La fabricación de cargadores mecánicos, parrillas mecánicas, descargadores mecánicos de cenizas y aparatos similares.","La fabricación de equipo de calefacción eléctrica, de montaje permanente, para ambientes y piscinas.","La fabricación de equipos de calefacción no eléctrica, de montaje permanente, para uso doméstico tales como calefacción solar, calefacción por vapor, calefacción por petróleo y equipo de hogares y de calefacción similares.","La fabricación de hogares eléctricos de tipo doméstico (hogares eléctricos de aire a presión o bombas de calor, etc.), hogares no eléctricos de aire a presión domésticos."],"n":["La fabricación de hornos de uso doméstico. Se incluye en el código 2750, «Fabricación de aparatos de uso doméstico».","La fabricación de secadores agrícolas. Se incluye en el código 2825, «Fabricación de maquinaria para la elaboración de alimentos, bebidas y tabaco».","La fabricación de hornos de panadería. Se incluye también en el código 2825 CIIU, «Fabricación de maquinaria para alimentos, bebidas y tabaco».","La fabricación de esterilizadores médicos, quirúrgicos o de laboratorio; y hornos de laboratorio (dental). Se incluye en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","La fabricación de secadores para madera, pasta de madera, papel o cartón. Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","El mantenimiento y la reparación de hornos, hogares y quemadores industriales. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de hornos, hogares y quemadores industriales. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["281","Fabricación de maquinaria y equipo de uso general"],"o":""}},{"c":"2816","d":"Fabricación de equipo de elevación y manipulación","b":true,"m":"El Usuario Industrial con Código CIIU 2816 cuya Actividad Económica Principal es Fabricación de equipo de elevación y manipulación es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de máquinas para mover físicamente materiales, mercancías y personas, distintas de los vehículos de circulación por carretera.","La fabricación de maquinaria sencilla o compleja, para acción continua o intermitente, estacionaria o móvil, y máquinas montadas permanentemente en bastidores con ruedas.","La fabricación de polipastos y elevadores, cabrias y cabrestantes; gatos.","La fabricación de grúas de brazo móvil; grúas corrientes, incluso grúas de cable; bastidores, elevadores móviles, camiones de pórtico alto, estén provistos o no de una grúa u otro equipo de elevación o manipulación, y sean autopropulsadas o no, como las que se utilizan en fábricas, almacenes, muelles, andenes de ferrocarril y otros lugares, incluso tractores para uso en los andenes de las estaciones ferroviarias.","La fabricación de carretillas de faena, estén provistas o no de equipo de elevación o manipulación, y sean autopropulsadas o no, como las que se utilizan en fábricas (incluidas carretillas y carros de mano).","La fabricación de otra maquinaria para elevación, manipulación, carga o descarga (por ejemplo, montacargas, ascensores, elevadores de líquidos, bandas transportadoras).","La fabricación de teleféricos, transportadores por cable y funiculares.","La fabricación de escaleras mecánicas y pasarelas móviles.","La fabricación de manipuladores mecánicos y robots industriales diseñados específicamente para elevación, manipulación, carga y descarga.","La fabricación de partes especiales de equipo de elevación y manipulación, incluso cangilones, cucharas y pinzas, excepto palas para topadoras, angulares o no."],"n":["La fabricación de motores de combustión interna para equipo de elevación y manipulación. Se incluye en el código 2811, «Fabricación de motores, turbinas, y partes para motores de combustión interna».","La fabricación de tractores utilizados en la agricultura. Se incluye en el código 2821, «Fabricación de maquinaria agropecuaria y forestal».","La fabricación de equipo de construcción. Se incluye en el código 2824, «Fabricación de maquinaria para la explotación de minas y canteras y para obras de construcción».","La fabricación de elevadores de acción continua y cintas transportadoras de funcionamiento subterráneo. Se incluye en el código CIIU 2824, «Fabricación de maquinaria para la explotación de minas y canteras y para obras de construcción».","La fabricación de palas mecánicas, excavadoras y cargadoras de cucharón. Se incluye en el código 2824, «Fabricación de maquinaria para la explotación de minas y canteras y para obras de construcción».","La fabricación de robots industriales de uso múltiple. Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","La fabricación de grúas flotantes, grúas ferroviarias y grúas de camión. Se incluye, según el caso, en el código 3011, «Construcción de barcos y de estructuras flotantes»; el código 3020, «Fabricación de locomotoras y de material rodante para ferrocarriles», y el código 2910, «Fabricación de vehículos automotores y sus motores».","El mantenimiento y la reparación de equipo de elevación y manipulación de uso industrial. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de equipo de elevación y manipulación de uso industrial. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial».","La instalación de ascensores y elevadores independientemente de su fabricación. Se incluye en el código 4329, «Otras instalaciones especializadas»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["281","Fabricación de maquinaria y equipo de uso general"],"o":""}},{"c":"2817","d":"Fabricación de maquinaria y equipo de oficina (excepto computadoras y equipo periférico)","b":true,"m":"El Usuario Industrial con Código CIIU 2817 cuya Actividad Económica Principal es Fabricación de maquinaria y equipo de oficina (excepto computadoras y equipo periférico) es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de máquinas de escribir, taquigrafía o dictado, manuales y eléctricas; máquinas de escribir automáticas, es decir, máquinas de escribir por las que se pasa una cinta previamente perforada para transcribir un mensaje determinado; dictáfonos, máquinas de memoria limitada que pueden corregir y re-transcribir textos automáticamente; y máquinas provistas de un dispositivo para transmitir las cifras escritas en ellas a máquinas calculadoras.","La fabricación de impresoras offset de carga manual para oficinas, hectógrafos o máquinas multicopistas de matriz estarcida y máquinas de imprimir direcciones.","La fabricación de máquinas fotocopiadoras por sistema óptico, o por contacto, y máquinas termo copiadoras.","La fabricación de cartuchos de tinta y tóner para fotocopiadoras e impresoras.","La fabricación de calculadoras electrónicas portátiles y de oficina; otras calculadoras; máquinas de contabilidad, cajas registradoras, máquinas de franquear correspondencia, máquinas para expedir boletos (tiquetes) y máquinas similares provistas de un dispositivo de cálculo.","La fabricación de otro tipo de maquinaria o equipo de oficina: máquinas que clasifican, empaquetan o cuentan monedas; escritura en cheques; expendedoras automáticas de billetes de banco, máquinas para poner bajo sobre o clasificar la correspondencia; máquinas de sufragio (voto); máquinas sacapuntas, dispensadores de cinta, perforadoras, equipo de encuadernado tipo oficina y engrapadoras, etc."],"n":["La fabricación de partes y piezas electrónicas componentes de computadoras. Se incluye en el código 2610, «Fabricación de componentes y tableros electrónicos».","La fabricación de computadores y equipo periférico. Se incluye en el código 2620, «Fabricación de computadoras y de equipo periférico».","El mantenimiento y la reparación de la maquinaria de oficina y contabilidad diferente de los computadores y equipo periférico. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de maquinaria de oficina y contabilidad diferente de los computadores y equipo periférico. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial »."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["281","Fabricación de maquinaria y equipo de uso general"],"o":""}},{"c":"2818","d":"Fabricación de herramientas manuales con motor","b":true,"m":"El Usuario Industrial con Código CIIU 2818 cuya Actividad Económica Principal es Fabricación de herramientas manuales con motor es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de herramienta manual, con motor eléctrico, por combustión o de funcionamiento con aire comprimido (neumático) como: taladros y martillos taladro, taladros percutores, remachadoras neumáticas, engrapadoras, limadoras, lijadoras, pulidoras, afiladoras, máquinas equipadas con escobillas, martillos mecánicos y neumáticos, etc.","La fabricación de sierras circulares y de percusión; cepilladoras, llaves de impacto, etc."],"n":["La fabricación de equipo manual de soldadura. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","El mantenimiento y la reparación de herramientas manuales con motor. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["281","Fabricación de maquinaria y equipo de uso general"],"o":""}},{"c":"2819","d":"Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.","b":true,"m":"El Usuario Industrial con Código CIIU 2819 cuya Actividad Económica Principal es Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p. es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de básculas y balanzas de uso doméstico y comercial, balanzas de plataforma portátiles o móviles, balanzas para el pesaje continuo de sólidos y de líquidos, balanzas para vehículos, etc. Balanzas equipadas con calculadoras o capaces de convertir unidades de peso en unidades de cuenta y de realizar otras operaciones basadas en unidades de peso, pesas, etc.","La fabricación de equipo de refrigeración o congelación de uso comercial tales como vitrinas refrigeradas. Equipo de refrigeración o congelación para otros usos distintos al doméstico. Ensambladuras de componentes principales de los refrigeradores y congeladores incluidos en esta clase, por ejemplo, compresores y condensadores montados en un bastidor común, aunque estén desprovistos de motor, evaporador o mueble. Muebles destinados a contener equipos de refrigeración.","La fabricación de maquinaria para licuar aire y gas.","La fabricación de aparatos autónomos de acondicionamiento de aire, incluyendo la fabricación de sistemas de aire acondicionado para vehículos automotores.","La fabricación de máquinas y aparatos de filtración y depuración para líquidos y de gases. Este equipo varía considerablemente en tamaño, funciones y características de funcionamiento y por consiguiente, los procesos utilizados en su fabricación también son extremadamente variados.","La fabricación de equipos para impeler, esparcir y asperjar líquidos y polvos accionados a mano o no; la fabricación de pistolas aspersores y aparatos similares, extinguidores de incendio, máquinas de limpieza mediante aspersión de arena a presión, de limpieza a vapor y otras máquinas similares de proyección a chorro.","La fabricación de maquinaria para empaquetar y envolver mercancías, incluidas las máquinas que realizan una o más funciones tales como las de llenar, cerrar, sellar, encapsular o etiquetar recipientes como botellas, latas, cajas o sacos; maquinaria para limpiar o secar las botellas y otros recipientes; y maquinaria para gasificar bebidas.","La fabricación de plantas destiladoras y rectificadoras para las refinerías de petróleo, la industria química, la industria de elaboración de bebidas, etc.","La fabricación de intercambiadores de calor.","La fabricación de gasógenos de gas pobre y gas de agua, y gasógenos de acetileno.","La fabricación de ventiladores de uso industrial, campanas de ventilación para uso comercial, industrial y en laboratorios; ventiladores de ático o de techo.","La fabricación de calandrias y otras máquinas de laminado, excepto las laminadoras de metal y de vidrio.","La fabricación de centrifugadoras distintas de las descremadoras y de las secadoras de ropa.","La fabricación de juntas (piezas de empalme) o similares, hechas de una combinación de materiales y de capas de estos materiales (ejemplo, las juntas de carbón o grafito).","La fabricación de tanques, cisternas y contenedores provistos de dispositivos mecánicos o térmicos utilizados para el almacenamiento o transporte de productos.","La fabricación de máquinas expendedoras.","La fabricación de equipo de soldadura no eléctrico (a gas) para soldadura autógena, oxicorte y oxiacetilénica.","La fabricación de niveles, cintas métricas y herramientas de mano similares, herramientas de precisión (excepto ópticas) para operarios.","La fabricación de otra maquinaria y equipo de uso general no clasificada en otra parte, incluso partes especiales de maquinaria y equipo de uso general."],"n":["La fabricación de barriles, tambores, bidones, baldes y cajas, y artículos plásticos similares utilizados para el envase y transporte de productos. Se incluyen en el código 2229, «Fabricación de artículos de plástico n.c.p.».","La fabricación de tanques, cisternas y contenedores sin dispositivos mecánicos o térmicos utilizados principalmente como equipo fijo para el almacenamiento de productos. Se incluye en el código 2512, «Fabricación de tanques, depósitos y recipientes de metal, excepto los utilizados para el envase o transporte de mercancías».","La fabricación de barriles, tambores, bidones, baldes, cajas y artículos metálicos similares utilizados para el envase o transporte de productos, incluso los de gran tamaño. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de balanzas de precisión. Se incluye en el código 2651, «Fabricación de equipo de medición, prueba, navegación y control».","La fabricación de equipo de refrigeración y congelación para uso doméstico. Se incluye en el código 2750, «Fabricación de aparatos de uso doméstico».","La fabricación de ventiladores utilizados principalmente en habitaciones u oficinas. Se incluye en el código CIIU 2750, «Fabricación de aparatos de uso doméstico».","La fabricación de máquinas secadoras de ropa para uso doméstico. Se incluye en el código 2750, «Fabricación de aparatos de uso doméstico».","La fabricación de equipo de soldadura eléctrica. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de máquinas de aspersión diseñadas especialmente para su uso en la agricultura. Se incluye en el código 2821, «Fabricación de maquinaria agropecuaria y forestal».","La fabricación del equipo y la maquinaria utilizados principalmente por una industria determinada o por varias industrias afines (por ejemplo, máquinas-herramienta utilizadas en unidades que trabajan los metales). Se incluye en la clase correspondiente del grupo 282, «Fabricación de maquinaria y equipo de uso especial».","La fabricación de laminadoras de metal. Se incluye en el código 2823, «Fabricación de maquinaria para la metalurgia».","La fabricación de laminadoras de vidrio. Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","La fabricación de máquinas descremadoras. Se incluye en el código 2825, «Fabricación de maquinaria para la elaboración de alimentos, bebidas y tabaco».","La fabricación de aparatos para filtrar y depurar alimentos. Se incluye en el código CIIU 2825, «Fabricación de maquinaria para la elaboración de alimentos, bebidas y tabaco»","La fabricación de secadores para productos agrícolas. Se incluye en el código 2825, «Fabricación de maquinaria para la elaboración de alimentos, bebidas y tabaco».","La fabricación de máquinas para la impresión sobre textiles. Se incluye en el código 2826, «Fabricación de maquinaria para la elaboración de productos textiles, prendas de vestir y cueros».","La fabricación de máquinas secadoras de ropa para uso industrial. Se incluye en el código CIIU 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","La fabricación de radiadores para vehículos automotores. Se incluye en el código 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de pesas para la práctica deportiva. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de centrífugas para laboratorio. Se incluye en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","El mantenimiento y la reparación de maquinaria de uso general. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de maquinaria de uso general. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["281","Fabricación de maquinaria y equipo de uso general"],"o":""}},{"c":"2821","d":"Fabricación de maquinaria agropecuaria y forestal","b":true,"m":"El Usuario Industrial con Código CIIU 2821 cuya Actividad Económica Principal es Fabricación de maquinaria agropecuaria y forestal es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de tractores utilizados en actividades agropecuarias y silvícolas, tractores de manejo a pie (dirigidos por una persona desde fuera), tractores equipados con cabrestantes y artefactos destinados a facilitar el remolque y manejo de herramientas, y de dispositivos de toma de fuerza para el movimiento de tierra y la manipulación de otros materiales.","La fabricación de remolques o semirremolques de carga o descarga automática para uso agrícola, y de partes y accesorios para los mismos.","La fabricación de máquinas utilizadas en la agricultura, la horticultura y la silvicultura, para preparar los suelos, plantar y abonar los cultivos, incluso arados, gradas, desbrozadoras, binadoras, sembradoras, esparcidoras de estiércol, aclaradoras, etc., autopropulsadas o no. Se incluye la maquinaria de tracción animal.","La fabricación de máquinas para la recolección, cosecha o trilla: recolectoras de papa, trilladoras de cereales, segadoras-trilladoras; cosechadoras de algodón, maíz, frutas, raíces y tubérculos, etc.","La fabricación de sierras de cadena o motosierras.","La fabricación de máquinas desmotadoras de algodón (de uso agrícola); segadoras (cortadoras de césped y de heno y otras segadoras equipadas con cuchillas); aspersores de uso agrícola; enfardadoras; máquinas para limpiar, seleccionar y clasificar huevos, frutas y otros productos agropecuarios. Dicha maquinaria puede ser autopropulsada, de arrastre por tractor o de tracción animal.","La fabricación de máquinas para ordeñar.","La fabricación de aspersores de uso agrícola; de otra maquinaria utilizada en la agricultura, la cría de animales, la horticultura o la silvicultura; de máquinas utilizadas en avicultura, de equipo para la preparación de alimentos para animales, de máquinas empleadas en la apicultura, etc."],"n":["La fabricación de herramientas de mano utilizadas en actividades agropecuarias, hortícolas y silvícolas. Se incluye en el código 2593, «Fabricación de artículos de cuchillería, herramientas de mano y artículos de ferretería».","La fabricación de cintas transportadoras para su uso en establecimientos agropecuarios. Se incluye en el código 2816, «Fabricación de equipo de elevación y manipulación».","La fabricación de carretillas de faena y de tractores de plataforma. Se incluye en el código CIIU 2816, «Fabricación de equipo de elevación y manipulación».","La fabricación de sierras circulares. Se incluye en el código 2818, «Fabricación de herramientas manuales con motor».","La fabricación de herramientas manuales con motor. Se incluye en el código 2822, «Fabricación de máquinas formadoras de metal y de máquinas herramienta».","La fabricación de tractores utilizados en obras de construcción o en la explotación de minas. Se incluye en el código 2824, «Fabricación de maquinaria para explotación de minas y canteras y para obras de construcción».","La fabricación de máquinas descremadoras. Se incluye en el código 2825, «Fabricación de maquinaria para la elaboración de alimentos, bebidas y tabaco».","La fabricación de maquinaria para limpiar, seleccionar o clasificar semillas, granos o leguminosas secas. Se incluye en el código CIIU 2825, «Fabricación de maquinaria para la elaboración de alimentos, bebidas y tabaco».","La fabricación de tractores para semirremolques de circulación por carretera. Se incluye en el código 2910, «Fabricación de vehículos automotores y sus motores».","El mantenimiento y la reparación de maquinaria agropecuaria y forestal. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de maquinaria agropecuaria y forestal. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["282","Fabricación de maquinaria y equipo de uso especial"],"o":""}},{"c":"2822","d":"Fabricación de máquinas formadoras de metal y de máquinas herramienta","b":true,"m":"El Usuario Industrial con Código CIIU 2822 cuya Actividad Económica Principal es Fabricación de máquinas formadoras de metal y de máquinas herramienta es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de máquinas herramienta para trabajar metales y otros materiales tales como madera, piedra, corcho, hueso, ebonita, caucho endurecido, plásticos duros, vidrio en frío; incluidas aquellas que usan como medio de trabajo rayo láser, ondas ultrasónicas, chorro de plasma, pulso magnético, etc.","La fabricación de máquinas herramienta para tornear, perforar, fresar, conformar, cepillar, taladrar, rectificar o realizar otras operaciones.","La fabricación de máquinas herramienta para estampar y prensar: punzonadoras, prensas hidráulicas, cizallas mecánicas, cortadoras, machacadoras, martinetes, máquinas de forjar, etc.","La fabricación de bancos de trefilar para barras, tubos, perfiles, alambres o productos similares; máquinas de aterrajar por laminado a presión y máquinas para trabajar alambre.","La fabricación de máquinas herramienta de diseño sencillo (por ejemplo, prensas a pedal), de diseño tradicional (por ejemplo, accionadas a mano o por motor) o de diseño moderno (por ejemplo, de mando numérico y para hacer pasar el producto por varias estaciones de trabajo).","La fabricación de máquinas para clavar, engrapar, encolar o montar de otra manera madera, corcho, hueso, ebonita, plásticos duros y otras materias duras similares.","La fabricación de taladradoras rotatorias y de percusión, limadoras, remachadoras, cortadoras de láminas de metal, etc.","La fabricación de prensas para la fabricación de tableros de partículas y fibras de contrachapados u otros materiales leñosos para la construcción, y otra maquinaria y equipo para trabajar la madera o el corcho.","La fabricación de máquinas para producir mallas o telas metálicas, excepto las que funcionan según principios iguales a los telares como es el caso de las máquinas para producir mallas de alambre tejido.","La fabricación de máquinas para la galvanoplastia.","La fabricación de partes y accesorios de las máquinas herramienta incluidas en esta clase, tales como dispositivos para sujetar los materiales que son objeto de trabajo (mandriles, platos de mandril), cabezales divisorios y otros accesorios especiales para máquinas herramienta."],"n":["La fabricación de accesorios intercambiables para herramientas de mano y para máquinas herramienta (brocas, punzones, matrices, machos de aterrajar, fresas, adminículos de movimiento radial, hojas de sierra, cuchillas y placas, barras, puntas y accesorios similares hechos de carburos metálicos sinterizados o de aleaciones metal o cerámicas [cermet]). Se incluye en el código 2593, «Fabricación de artículos de cuchillería, herramientas de mano y artículos de ferretería».","La fabricación de máquinas eléctricas para soldadura. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de herramientas manuales con motor. Se incluye en el código 2818, «Fabricación de herramientas manuales con motor».","La fabricación de máquinas no eléctricas para soldadura. Se incluye en el código 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de maquinaria utilizada en talleres de fundición. Se incluye en el código 2823, «Fabricación de maquinaria para la metalurgia».","La fabricación de maquinaria para la explotación de minas y canteras. Se incluye en el código 2824, «Fabricación de maquinaria para explotación de minas y canteras y para obras de construcción».","La fabricación de las perforadoras de roca no manuales. Se incluye en el código CIIU 2824, «Fabricación de maquinaria para explotación de minas y canteras y para obras de construcción».","La fabricación de máquinas para producir mallas o telas metálicas que funcionan según principios iguales que los telares. Se incluye en el código 2826, «Fabricación de maquinaria para la elaboración de productos textiles, prendas de vestir y cueros».","El mantenimiento y la reparación de máquinas formadoras de metal y de máquinas herramienta. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de máquinas formadoras de metal y de máquinas herramienta. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial»"],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["282","Fabricación de maquinaria y equipo de uso especial"],"o":""}},{"c":"2823","d":"Fabricación de maquinaria para la metalurgia","b":true,"m":"El Usuario Industrial con Código CIIU 2823 cuya Actividad Económica Principal es Fabricación de maquinaria para la metalurgia es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de máquinas y equipo para la manipulación de metales en caliente: convertidores, lingoteras, calderos de colada y máquinas de fundir del tipo utilizado en la metalurgia o en talleres de fundición de metales.","La fabricación de máquinas laminadoras de metal y sus rodillos."],"n":["Las actividades de las instituciones catalogadas como «Banca de segundo piso». Se incluyen en el código 6423, «Banca de segundo piso»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["282","Fabricación de maquinaria y equipo de uso especial"],"o":""}},{"c":"2824","d":"Fabricación de maquinaria para explotación de minas y canteras y para obras de construcción","b":true,"m":"El Usuario Industrial con Código CIIU 2824 cuya Actividad Económica Principal es Fabricación de maquinaria para explotación de minas y canteras y para obras de construcción es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de maquinaria de elevación y manipulación diseñada especialmente para uso en obras subterráneas como, por ejemplo, ascensores de acción continua o equipo de cintas o bandas transportadoras.","La fabricación de maquinaria y equipo para perforar e hincar, destinados o no, a usos subterráneos.","La fabricación de maquinaria para el tratamiento de minerales mediante: cribado, clasificación, separación, lavado, trituración, pulverización, mezcla, amasado y procesos similares, incluso mezcladoras de hormigón y mortero, máquinas de moldeamiento, extrusoras, etc.","La fabricación de tractores de oruga y tractores utilizados en la construcción o en la explotación de minas.","La fabricación de topadoras corrientes y de pala angular y otras máquinas para movimiento de tierra, autopropulsadas o no; explanadoras, niveladoras, traíllas, palas mecánicas, excavadoras, cargadoras de cucharón, apisonadoras y aplanadoras.","La fabricación de máquinas para hincar y arrancar pilotes, y máquinas compactadoras.","La fabricación de máquinas utilizadas en la construcción no clasificadas ni incluidas en otra parte: esparcidoras de hormigón, equipo de construcción de carreteras (por ejemplo, esparcidoras de asfalto), maquinaria y equipo para pavimentar con hormigón (estriadoras, alisadoras, escaqueadoras), etc.","La fabricación de palas para topadoras corrientes y de pala angular y otras partes especiales de las máquinas mencionadas anteriormente."],"n":["La fabricación de equipos de elevación y manipulación. Se incluye en el código 2816, «Fabricación de equipo de elevación y manipulación».","La fabricación de tractores de uso agrícola. Se incluye en el código 2821, «Fabricación de maquinaria agropecuaria y forestal».","La fabricación de máquinas herramienta para trabajar la piedra, incluso máquinas para hendir o exfoliar la piedra. Se incluye en el código 2822, «Fabricación de máquinas formadoras de metal y de máquinas herramienta».","La fabricación de martillos mecánicos y neumáticos. Se incluye en el código 2818, «Fabricación de herramientas manuales con motor».","La fabricación de otros tipos de tractores (por ejemplo, tractores o cabezotes para semirremolques). Se incluye en el código 2910, «Fabricación de vehículos automotores y sus motores».","La fabricación de camiones hormigonera para el transporte de concreto premezclado. Se incluye en el código CIIU 2910, «Fabricación de vehículos automotores y sus motores».","La fabricación de locomotoras para la minería y vagones para la minería. Se incluye en el código 3020, «Fabricación de locomotoras y de material rodante para ferrocarriles».","El mantenimiento y la reparación de maquinaria para la explotación de minas y canteras y para obras de construcción. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de maquinaria para la minería y la construcción. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["282","Fabricación de maquinaria y equipo de uso especial"],"o":""}},{"c":"2825","d":"Fabricación de maquinaria para la elaboración de alimentos, bebidas y tabaco","b":true,"m":"El Usuario Industrial con Código CIIU 2825 cuya Actividad Económica Principal es Fabricación de maquinaria para la elaboración de alimentos, bebidas y tabaco es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de maquinaria utilizada principalmente en la industria lechera: descremadoras, homogeneizadoras, maquinaria para transformación de la leche (mantequeras, malaxadoras y moldeadoras); maquinaria para hacer quesos (máquinas de homogeneizar, moldear y prensar).","La fabricación de maquinaria utilizada principalmente en la industria de la molienda de granos: máquinas para limpiar, seleccionar o clasificar semillas, granos o leguminosas secas (aventadoras, bandas o cintas, cribadoras, separadores ciclónicos, separadores aspiradores, acepilladoras y máquinas similares); máquinas para la trilla; maquinaria para producir harinas, sémolas u otros productos molidos (trituradoras, agramadoras, alimentadoras, cribadoras, depuradoras de afrecho, mezcladoras, descascarilladoras de arroz, partidoras de guisantes, etc.).","La fabricación de prensas, trituradoras y máquinas similares utilizadas en la elaboración de vino, sidra, jugos de frutas o bebidas similares.","La fabricación de maquinaria y equipo especial para uso en panadería, y para preparar macarrones, espaguetis y productos similares: mezcladoras, fraccionadoras y moldeadoras de masa, cortadoras, máquinas para depositar tortas, incluidos los hornos de panadería, entre otros.","La fabricación de maquinaria para la extracción y la preparación de grasas o aceites fijos de origen animal o vegetal.","La fabricación de maquinaria y equipo para la preparación de tabaco y la elaboración de cigarrillos o cigarros o de tabaco para pipa, tabaco de mascar y rapé.","La fabricación de máquinas y equipos para la elaboración y procesamiento de alimentos no clasificados en otra parte: maquinaria para el procesamiento de cacao, chocolate y productos de confitería; para la fabricación de azúcar; para cervecería; para procesar carne vacuna y aves de corral (máquinas para depilar y desplumar, cortar y aserrar, picar, cortar en cubitos, y machacar carne, etc.); para preparar frutas, nueces, hortalizas y legumbres; para preparar pescado, crustáceos y otros productos de mar comestibles. La fabricación de otra maquinaria para la preparación y la elaboración de alimentos y bebidas.","La fabricación de secadores para productos agrícolas y la fabricación de maquinaria para filtrar y depurar alimentos.","La fabricación de maquinaria para la preparación de comidas en hoteles y restaurantes (cocinas comerciales)."],"n":["La fabricación de cubas y tanques sin accesorios térmicos y mecánicos. Se incluye en el código 2512, «Fabricación de tanques, depósitos y recipientes de metal, excepto los utilizados para el envase o transporte de mercancías».","La fabricación de equipo de irradiación (la irradiación puede tomar la forma de rayos beta, rayos gama, rayos X u otra radiación ionizada) de alimentos y bebidas. Se incluye en el código 2660, «Fabricación de equipo de irradiación y equipo electrónico de uso médico y terapéutico».","La fabricación de máquinas de empacar y envolver, básculas y balanzas. Se incluye en el código 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de maquinaria para la limpieza, selección y clasificación de huevos, frutas y otros productos agrícolas. Se incluye en el código 2821, «Fabricación de maquinaria agropecuaria y forestal».","El mantenimiento y la reparación de maquinaria para la elaboración de alimentos, bebidas y tabaco. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de maquinaria y equipo para la elaboración de alimentos, bebidas y tabaco. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["282","Fabricación de maquinaria y equipo de uso especial"],"o":""}},{"c":"2826","d":"Fabricación de maquinaria para la elaboración de productos textiles, prendas de vestir y cueros","b":true,"m":"El Usuario Industrial con Código CIIU 2826 cuya Actividad Económica Principal es Fabricación de maquinaria para la elaboración de productos textiles, prendas de vestir y cueros es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de máquinas para extrudir, estirar o cortar fibras, hilados u otros materiales textiles de origen artificial o sintético.","La fabricación de máquinas de preparación de fibras textiles (fibras naturales y fibras cortas artificiales) para la hilatura y máquinas similares para la preparación de fibras que se utilizan como material de relleno o en la manufactura del fieltro o guata; desmotadoras de algodón (de uso textil), abridoras de balas, transformadoras de hilachas en fibras, batanes de algodón, des-engrasadoras y carbonizadoras de lana, peinadoras, cardadoras, mecheras, entre otros.","La fabricación de máquinas para transformar las mechas en hilos, incluso las manuales, de retorcer dos o más hilos para obtener hilos retorcidos y cableados.","La fabricación de máquinas de preparación de hilados textiles para su uso en telares corrientes y telares para tejidos de punto, devanadoras, urdidoras y máquinas conexas.","La fabricación de telares corrientes, incluso telares manuales. Telares para tejidos de punto (rectilíneos y circulares).","La fabricación de máquinas para hacer tejidos de mallas anudadas, tules, encajes, trencillas y otros tejidos especiales, incluso hilados entorchados.","La fabricación de otras máquinas y equipo auxiliar para las máquinas descritas anteriormente: bastidores con vástagos para urdidoras; lizos y mecanismos de Jacquard, mecanismos de parada automáticos, mecanismos de cambio de lanzaderas, mecanismos para el cambio automático de canillas, esponjadoras para el desengrase de lana; y partes de las máquinas antes mencionadas, tales como correderas, peines y barras correderas; mallas metálicas, agujas y lanzaderas para telares de tejidos de punto; enjulios; husos para trenzadoras, etc.","La fabricación de maquinaria para lavar, blanquear, teñir, aprestar, acabar, revestir e impregnar hilados textiles, telas y artículos confeccionados de materiales textiles; máquinas para aplicar la pasta al tejido u otro material de base utilizadas en la fabricación de linóleo u otros materiales similares para revestimiento de pisos; máquinas de enrollar, desenrollar, plegar, cortar y calar telas.","La fabricación de máquinas para la serigrafía y para el estampado de hilados textiles y prendas de vestir.","La fabricación de máquinas de planchar, incluso planchas de fusión.","La fabricación de máquinas de lavar y secar del tipo utilizado en lavandería; máquinas de limpiar en seco.","La fabricación de máquinas de coser y cabezales de máquinas de coser, incluidas aquellas para uso doméstico: máquinas para coser materias textiles, cuero, pieles, etc.; para confeccionar prendas de vestir, calzado, bordados, maletas, cubrecabezas, sacos, etc.","La fabricación de agujas para máquinas de coser.","La fabricación de máquinas para la manufactura y el acabado del fieltro y de textiles no tejidos, en piezas o en cortes con formas determinadas, incluso máquinas para la fabricación de sombreros de fieltro.","La fabricación de máquinas para preparar, curtir y trabajar cueros y pieles, incluso depiladoras, descarnadoras, batanes de mazo y de tambor, tundidoras y máquinas de acabar, tales como máquinas de cepillar, glasear o granear el cuero.","La fabricación de maquinaria para fabricar y reparar calzado y otros artículos de cuero o piel.","La fabricación de carretes y bobinas que forman parte de maquinaria textil."],"n":["La fabricación de tarjetas de papel y cartón perforadas, para los telares con mecanismo de Jacquard. Se incluye en el código 1709, «Fabricación de otros artículos de papel y cartón».","La fabricación de máquinas domésticas de lavado y secado. Se incluye en el código 2750, «Fabricación de aparatos de uso doméstico».","La fabricación de máquinas de planchar del tipo calandria. Se incluye en el código 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de calandrias para textiles. Se incluye en el código CIIU 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de máquinas para producir mallas o telas metálicas que funcionan según principios diferentes que los telares. Se incluye en el código 2822, «Fabricación de máquinas formadoras de metal y de máquinas herramienta».","La fabricación de las máquinas de coser utilizadas en la encuadernación. Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","El mantenimiento y la reparación de maquinaria para la elaboración de productos textiles, prendas de vestir y cueros. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de maquinaria y equipo para la elaboración de productos textiles, prendas de vestir y cueros. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["282","Fabricación de maquinaria y equipo de uso especial"],"o":""}},{"c":"2829","d":"Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.","b":true,"m":"El Usuario Industrial con Código CIIU 2829 cuya Actividad Económica Principal es Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p. es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de maquinaria y equipo de uso especial no clasificado en otra parte como:","La fabricación de máquinas y equipos para elaboración de caucho o de plásticos y para la fabricación de productos de esos materiales: extrusoras y moldeadoras, máquinas para la fabricación o el recauchutado de llantas y otras máquinas para la elaboración de determinados productos de caucho o de plásticos como por ejemplo, los discos gramo fónicos.","La fabricación de maquinaria y equipo para la industria de la pasta o pulpa de papel, el papel y el cartón: máquinas diseñadas especialmente para el trabajo en caliente de la pasta de papel, el papel y el cartón (por ejemplo, digestores); cortadoras, pulverizadoras o trituradoras destinadas especialmente a preparar la madera, el bambú, el esparto, la paja, los trapos, los desechos de papel, etc., para la fabricación de pasta de papel, papel o cartón; máquinas que transforman materias celulósicas en pasta de papel (batidoras, refinadoras, coladoras, etc.).","La fabricación de maquinaria y equipo para fabricar papel, cartón corriente o cartón ondulado. Maquinaria para el acabado del papel o el cartón (máquinas de revestir, rayar o estampar).","La fabricación de maquinaria y equipo para la producción de papel de tamaños o formas determinados o para la producción de artículos tales como sobres, bolsas de papel, cajas o cajones de cartón (por ejemplo, máquinas de cortar en tiras y de rayar, perforar, troquelar, plegar, alimentar, enrollar, fabricar vasos de papel, moldear pasta de papel, etc.).","La fabricación de maquinaria y equipo para la fundición de caracteres de imprenta (por ejemplo, fundidoras manuales o automáticas de caracteres).","La fabricación de maquinaria y equipo de composición tipográfica (por ejemplo, monotipia y otras máquinas de fundición y composición provistas de teclado). Caracteres de imprenta hechos de madera, metal o plástico.","La fabricación de máquinas para la elaboración de matrices y planchas de estereotipia, de elaboración de planchas y grabado al agua fuerte y de fototipia y composición tipográfica. Clichés, planchas, cilindros y otros medios de impresión debidamente tratados para poder grabar o imprimir en ellos o con ellos (por ejemplo, piedras litográficas, cilindros de metal pulido o graneado, clichés de metal o de plástico para impresoras en offset, planchas de fotograbado, etc.).","La fabricación de maquinaria y aparatos para imprimir (por ejemplo, prensas corrientes, de platina, de cilindros y rotativas, incluso impresoras especiales como máquinas para marcar corcho, u otros artículos no usuales), excepto la utilizada para impresión sobre textiles.","La fabricación de máquinas auxiliares de la impresión (por ejemplo, cargadoras, alimentadoras, plegadoras, encoladoras, engrapadoras, etc.).","La fabricación de máquinas para encuadernación, incluso cosedoras de libros, encuadernadoras para el montaje de lomos de espiral plástica o metálica y foliadoras.","La fabricación de maquinaria para producir baldosas, ladrillos, pastas de cerámica moldeadas, tubos, electrodos de grafito, tiza de pizarrón, moldes de fundición, etc.","La fabricación de secadoras centrífugas para ropa, de uso industrial.","La fabricación de máquinas para ensamblar lámparas, tubos (válvulas) o bombillas eléctricas o electrónicas en ampollas de vidrio; máquinas para la producción o el trabajo en caliente de vidrio o productos de cristalería, fibras o hilados de vidrio como, por ejemplo, laminadoras de vidrio; máquinas o aparatos para la separación de isótopos.","La fabricación de robots industriales de uso múltiple.","La fabricación de maquinaria y equipo para la proyección del diseño de circuitos sobre materiales semiconductores.","La fabricación de secadores para madera, pasta de madera, papel o cartón.","La fabricación de artefactos de lanzamiento de aeronaves, catapultas transportadoras de aeronaves y equipo relacionado.","La fabricación de equipo para balanceo y alineación de llantas, equipos de balanceo.","La fabricación de sistemas de engrasado central.","La fabricación de cámaras de bronceado.","La fabricación de máquinas para atracciones de ferias, tiovivos, columpios, barracas de tiro al blanco; equipo automático para juegos de bolos, instaladores de pinos, etc.","La fabricación de cajas de moldear para talleres de fundición de metal; fondos de moldes; patrones para moldear, moldes para metal (excepto lingoteras), carburos metálicos, vidrio, materias minerales, caucho o plástico.","La fabricación de otro equipo y maquinaria de uso especial no clasificados en otra parte."],"n":["La fabricación de aparatos de uso doméstico. Se incluye en el código 2750, «Fabricación de aparatos de uso doméstico».","La fabricación de máquinas de limpieza ultrasónica (excepto de laboratorio y dentales). Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de fotocopiadoras. Se incluye en el código 2817, «Fabricación de maquinaria y equipo de oficina (excepto computadoras y equipo periférico)».","La fabricación de calandrias (excepto rodillos laminadores de metal o de vidrio), incluso cuando están destinadas a elaborar un producto determinado. Se incluye en el código 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de maquinaria o equipo para trabajar el caucho endurecido, plásticos duros o el vidrio en frío (principalmente máquinas herramienta). Se incluye en el código 2822, «Fabricación de máquinas formadoras de metal y de máquinas herramienta».","La fabricación de lingoteras. Se incluye en el código 2823, «Fabricación de maquinaria para la metalurgia».","La fabricación de rodillos laminadores de metal. Se incluye en el código CIIU 2823, «Fabricación de maquinaria para la metalurgia».","La fabricación de convertidores, calderos de colada y máquinas de fundir del tipo utilizado en la metalurgia o en talleres de fundición de metales. Se incluye en el código 2823, «Fabricación de maquinaria para la metalurgia».","La fabricación de máquinas para imprimir sobre textiles. Se incluye en el código 2826, «Fabricación de maquinaria para la elaboración de productos textiles, prendas de vestir y cueros».","La fabricación de máquinas de limpieza ultrasónica de laboratorio y dentales. Se incluye en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario) ».","El mantenimiento y la reparación de otros tipos de maquinaria de uso especial. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","La instalación especializada de maquinaria de uso especial. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["28","Fabricación de maquinaria y equipo n.c.p."],"g":["282","Fabricación de maquinaria y equipo de uso especial"],"o":""}},{"c":"2910","d":"Fabricación de vehículos automotores y sus motores","b":true,"m":"El Usuario Industrial con Código CIIU 2910 cuya Actividad Económica Principal es Fabricación de vehículos automotores y sus motores es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de automóviles de turismo y otros vehículos automotores diseñados principalmente para el transporte de personas: automóviles particulares, vehículos automotores de transporte de pasajeros, diseñados para transitar por todo terreno (trineos motorizados, carritos autopropulsados para campos de golf, vehículos para todo terreno, vehículos deportivos, vehículos anfibios), y vehículos automotores para el transporte público de pasajeros, a saber, autobuses, buses articulados (Transmilenio), entre otros.","La fabricación de vehículos automotores para el transporte de mercancías: camiones y camionetas comunes (de platón descubierto, con capota, cerrados, entre otros), camiones con dispositivos de descarga automática, camiones cisterna, volquetes, camiones recolectores de basura, camiones y camionetas de uso especial (grúas para auxilio en carretera, carros blindados para el transporte de valores, camiones de bomberos, camiones barredores, unidades médicas y odontológicas móviles, bibliotecas móviles, entre otros).","La fabricación de camiones hormigonera para el transporte de concreto premezclado.","La fabricación de cabezotes (tractores) para semirremolques de circulación por carretera.","La fabricación de cuatrimotos, carts, vehículos de carreras y similares.","La fabricación de chasis con motor para los vehículos descritos anteriormente.","La fabricación de motores de combustión interna con émbolos de movimiento rectilíneo o rotativo y de encendido por chispa eléctrica o por compresión, del tipo utilizado principalmente en vehículos automotores; incluye igualmente la reconstrucción y/o rectificado.","La fabricación de vehículos automotores no incluidos en otra parte, y que tengan incorporado el sistema de propulsión con motores de cualquier tipo (motor de combustión interna por chispa eléctrica o por compresión, motor eléctrico, motor de nitrógeno líquido, etc.)."],"n":["La fabricación de motores eléctricos. Se incluye en el código 2711, «Fabricación de motores, generadores y transformadores eléctricos».","La fabricación de equipo eléctrico destinado a la iluminación para vehículos automotores. Se incluye en el código 2740, «Fabricación de equipos eléctricos de iluminación».","La fabricación y la reconstrucción de motores para tractores y maquinaria agropecuaria y forestal. Se incluyen en el código 2811, «Fabricación de motores, turbinas, y partes para motores de combustión interna».","La fabricación de pistones, carburadores, válvulas de admisión y de escape para motores de combustión interna. Se incluye en el código CIIU 2811, «Fabricación de motores, turbinas, y partes para motores de combustión interna».","La fabricación de tractores utilizados en actividades agropecuarias y silvícolas. Se incluye en el código 2821, «Fabricación de maquinaria agropecuaria y forestal».","La fabricación de hormigoneras de carácter fijo. Se incluye en el código 2824, «Fabricación de maquinaria para explotación de minas y canteras y para obras de construcción».","La fabricación de tractores utilizados en obras de construcción y en la explotación de minas y canteras. Se incluye en el código CIIU 2824, «Fabricación de maquinaria para explotación de minas y canteras y para obras de construcción».","La fabricación de carrocerías para vehículos automotores. Se incluye en el código 2920, «Fabricación de carrocerías para vehículos automotores; fabricación de remolques y semirremolques».","La fabricación, el ensamble y la instalación de carrocerías blindadas para vehículos automotores. Se incluye en el código CIIU 2920, «Fabricación de carrocerías para vehículos automotores; fabricación de remolques y semirremolques».","La fabricación de partes y accesorios para vehículos automotores. Se incluye en el código 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de tanques y otros vehículos militares de combate. Se incluye en el código 3040, «Fabricación de vehículos militares de combate».","El desmantelamiento y la chatarrización de vehículos automotores con el fin de recuperar materiales y revender sus partes y piezas reutilizables. Se incluyen
