s metálicas y de sus marcos, postigos, cortinas metálicas, escaleras de incendio, rejas y carpintería metálica similar a la utilizada en la construcción.","La fabricación de divisiones metálicas fijas al piso y estanterías de grandes dimensiones para montar y fijar permanentemente en tiendas, talleres, depósitos y otros lugares de almacenado de mercancías.","Los productos característicos de esta clase se elaboran generalmente con chapa, fleje, barras, tubos, perfiles diversos de hierro, de acero o aluminio, o de elementos de hierro forjado, o de fundición moldeada, taladrados, ajustados o acoplados con remaches, pernos o por soldadura; se trata de artículos transportables, listos para ser montados, instalados o erigidos, por ejemplo, por una empresa constructora.","La erección o montaje de estructuras metálicas y construcciones prefabricadas de metal a partir de piezas de fabricación propia."],"n":["La fabricación de edificaciones y componentes prefabricados de madera. Se incluye en el código 1630, «Fabricación de partes y piezas de madera, de carpintería y ebanistería para la construcción».","La fabricación de rieles sin ensamblar. Se incluye en el código 2410, «Industrias básicas de hierro y de acero».","La fabricación de piezas para calderas marinas y de potencia. Se incluye en el código 2513, «Fabricación de generadores de vapor, excepto calderas de agua caliente para calefacción central».","La fabricación de material fijo y de aparatos de señalización para vías férreas. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de piezas y accesorios ensamblados para vías férreas. Se incluye en el código CIIU 2599, «Fabricación de otros productos elaborados de metal n.c.p».","La fabricación de secciones para buques y barcos o estructuras flotantes. Se incluye en el código 3011, «Construcción de barcos y de estructuras flotantes».","La fabricación de estanterías amovibles, anaqueles y demás mobiliario metálico para el hogar, oficinas, establecimientos comerciales, teatros, centros de enseñanza y similares. Se incluye en el código 3110, «Fabricación de muebles».","El mantenimiento y reparación de productos metálicos para uso estructural cuando es realizado por establecimientos dedicados exclusivamente a dicha actividad. Se incluye en el código 3311, «Mantenimiento y reparación especializado de productos elaborados en metal».","La erección o instalación de estructuras metálicas a partir de piezas de fabricación no propia, tales como: la instalación especializada de cubiertas metálicas para edificios residenciales. Se incluye en el código 4390, «Otras actividades especializadas para la construcción de edificios y obras de ingeniería civil».","El montaje de cubiertas metálicas, puertas, ventanas y demás elementos metálicos realizado por el constructor como parte del desarrollo de la construcción de edificaciones. Se incluye en el código 4111, «Construcción de edificios residenciales», o el código 4112, «Construcción de edificios no residenciales», según el caso.","La construcción de vías férreas y la instalación de señales de tráfico. Se incluye en el código 4210, «Construcción de carreteras y vías de ferrocarril»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["25","Fabricación de productos elaborados de metal, excepto maquinaria y equipo"],"g":["251","Fabricación de productos metálicos para uso estructural, tanques, depósitos y generadores de vapor"],"o":""}},{"c":"2512","d":"Fabricación de tanques, depósitos y recipientes de metal, excepto los utilizados para el envase o transporte de mercancías","b":true,"m":"El Usuario Industrial con Código CIIU 2512 cuya Actividad Económica Principal es Fabricación de tanques, depósitos y recipientes de metal, excepto los utilizados para el envase o transporte de mercancías es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de recipientes de metal para gas comprimido o licuado, de cualquier capacidad. Algunos son de formas generalmente cilíndricas (tubos o botellas), resistentes, construidos para soportar presiones altas. Otros, constituidos por un depósito interior y una o varias capas envolventes entre las que se puede disponer un material aislante, hacer el vacío, tener reservado un espacio para un líquido criogénico (oxígeno líquido, nitrógeno líquido), para obtener un gran aislamiento térmico, están diseñados para ciertos gases licuados que se mantienen en general a presiones bajas.","La fabricación de calderas y radiadores para calefacción central proyectada para producir al mismo tiempo agua caliente y vapor a baja presión (por debajo de las cinco libras). Comprende las que se utilizan, por ejemplo, para calefacción de las viviendas, fábricas, invernaderos, entre otros.","La fabricación de tanques, cisternas o recipientes similares de metal utilizados habitualmente como equipo fijo para el almacenamiento o la producción de los establecimientos industriales. Pueden ser abiertos o cerrados, estar revestidos interiormente de ebonita, de plástico, o incluso, de un metal distinto del hierro, del acero o del aluminio.","La fabricación de cubas y tanques sin accesorios térmicos y mecánicos."],"n":["La fabricación de cajas, cajones, barriles, toneles, barricas, cubas, tinas y artículos similares en madera del tipo habitualmente utilizado para el transporte o envase de productos. Se incluye en el código 1640, «Fabricación de recipientes de madera».","La fabricación de barriles, tambores, bidones, baldes, cajas y artículos similares en metal del tipo habitualmente utilizado para el transporte o envase de productos, incluidos los de gran tamaño. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación para los usos descritos anteriormente, de tanques, cisternas y contenedores metálicos similares provistos de dispositivos mecánicos o térmicos. Se incluye en el código 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de contenedores diseñados y equipados especialmente para su acarreo por uno o más medios de transporte. Se incluye en el código 2920, «Fabricación de carrocerías para vehículos automotores; fabricación de remolques y semirremolques».","La fabricación de tanques y otros vehículos militares para combate y abastecimiento. Se incluye en el código 3040, «Fabricación de vehículos militares de combate».","El mantenimiento y reparación de tanques, depósitos y recipientes de metal, excepto los utilizados para el envase o transporte de mercancías. Se incluyen en el código 3311, «Mantenimiento y reparación especializado de productos elaborados en metal»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["25","Fabricación de productos elaborados de metal, excepto maquinaria y equipo"],"g":["251","Fabricación de productos metálicos para uso estructural, tanques, depósitos y generadores de vapor"],"o":""}},{"c":"2513","d":"Fabricación de generadores de vapor, excepto calderas de agua caliente para calefacción central","b":true,"m":"El Usuario Industrial con Código CIIU 2513 cuya Actividad Económica Principal es Fabricación de generadores de vapor, excepto calderas de agua caliente para calefacción central es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de reactores nucleares para todos los fines, menos para la separación de isótopos. La expresión reactor nuclear se aplica en general al conjunto de aparatos y dispositivos que se encuentran dentro del recinto protegido por el blindaje biológico con inclusión, si es preciso, del propio blindaje, así como los aparatos o dispositivos que se encuentran fuera de este recinto, pero que son parte integrante de aquellos contenidos en él.","La fabricación de calderas generadoras de vapor de agua y de otros vapores que no sean calderas de agua caliente para calefacción central aunque también produzcan vapor a baja presión. Las calderas generadoras de vapor de agua son calderas de una mediana y alta potencia que permiten aumento de las presiones del orden de 2000 libras. Esto implica que tanto el proceso de fabricación como los materiales de que están construidas garanticen su resistencia a las elevadas presiones y temperaturas de operación, así como a la corrosión.","La fabricación de equipos auxiliares para calderas, tales como condensadores, economizadores de agua para su calentamiento previo; recalentadores, cilindros recolectores que recogen el vapor de un grupo de calderas; acumuladores de vapor, es decir, grandes depósitos cilíndricos de acero en los que se acumula una reserva de vapor. Asimismo, se incluyen los deshollinadores, recuperadores de gases y dispositivos sacabarros; todos estos accesorios se fabrican con las mismas técnicas y materiales que los de la caldera.","La fabricación de piezas para calderas marinas y de potencia."],"n":["La fabricación de elementos combustibles para reactores nucleares. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de calderas y radiadores para calefacción central. Se incluye en el código 2512, «Fabricación de tanques, depósitos y recipientes de metal, excepto los utilizados para el envase o transporte de mercancías».","La fabricación de turbo calderas o de máquinas de vapor estáticas con caldera integral. Se incluye en el código 2811, «Fabricación de motores, turbinas, y partes para motores de combustión interna».","La fabricación de equipo de calefacción eléctrica para ambientes y equipo de calefacción no eléctrica de montaje permanente para uso doméstico. Se incluye en el código 2815, «Fabricación de hornos, hogares y quemadores industriales».","La fabricación de máquinas de limpieza al vapor. Se incluye en el código 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de separadores de isótopos. Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","La fabricación de locomotoras de vapor. Se incluye en el código 3020, «Fabricación de locomotoras y de material rodante para ferrocarriles».","El mantenimiento y reparación de generadores de vapor, excepto calderas de agua caliente para calefacción central. Se incluye en el código 3311, «Mantenimiento y reparación especializado de productos elaborados en metal».","La instalación de tuberías para sistemas de calefacción y refrigeración. Se incluye en el código 4322, «Instalaciones de fontanería, calefacción y aire acondicionado»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["25","Fabricación de productos elaborados de metal, excepto maquinaria y equipo"],"g":["251","Fabricación de productos metálicos para uso estructural, tanques, depósitos y generadores de vapor"],"o":""}},{"c":"2520","d":"Fabricación de armas y municiones","b":true,"m":"El Usuario Industrial con Código CIIU 2520 cuya Actividad Económica Principal es Fabricación de armas y municiones es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de reactores nucleares para todos los fines, menos para la separación de isótopos. La expresión reactor nuclear se aplica en general al conjunto de aparatos y dispositivos que se encuentran dentro del recinto protegido por el blindaje biológico con inclusión, si es preciso, del propio blindaje, así como los aparatos o dispositivos que se encuentran fuera de este recinto, pero que son parte integrante de aquellos contenidos en él.","La fabricación de calderas generadoras de vapor de agua y de otros vapores que no sean calderas de agua caliente para calefacción central aunque también produzcan vapor a baja presión. Las calderas generadoras de vapor de agua son calderas de una mediana y alta potencia que permiten aumento de las presiones del orden de 2000 libras. Esto implica que tanto el proceso de fabricación como los materiales de que están construidas garanticen su resistencia a las elevadas presiones y temperaturas de operación, así como a la corrosión.","La fabricación de equipos auxiliares para calderas, tales como condensadores, economizadores de agua para su calentamiento previo; recalentadores, cilindros recolectores que recogen el vapor de un grupo de calderas; acumuladores de vapor, es decir, grandes depósitos cilíndricos de acero en los que se acumula una reserva de vapor. Asimismo, se incluyen los deshollinadores, recuperadores de gases y dispositivos sacabarros; todos estos accesorios se fabrican con las mismas técnicas y materiales que los de la caldera.","La fabricación de piezas para calderas marinas y de potencia."],"n":["La fabricación de elementos combustibles para reactores nucleares. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de calderas y radiadores para calefacción central. Se incluye en el código 2512, «Fabricación de tanques, depósitos y recipientes de metal, excepto los utilizados para el envase o transporte de mercancías».","La fabricación de turbo calderas o de máquinas de vapor estáticas con caldera integral. Se incluye en el código 2811, «Fabricación de motores, turbinas, y partes para motores de combustión interna».","La fabricación de equipo de calefacción eléctrica para ambientes y equipo de calefacción no eléctrica de montaje permanente para uso doméstico. Se incluye en el código 2815, «Fabricación de hornos, hogares y quemadores industriales».","La fabricación de máquinas de limpieza al vapor. Se incluye en el código 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La fabricación de separadores de isótopos. Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","La fabricación de locomotoras de vapor. Se incluye en el código 3020, «Fabricación de locomotoras y de material rodante para ferrocarriles».","El mantenimiento y reparación de generadores de vapor, excepto calderas de agua caliente para calefacción central. Se incluye en el código 3311, «Mantenimiento y reparación especializado de productos elaborados en metal».","La instalación de tuberías para sistemas de calefacción y refrigeración. Se incluye en el código 4322, «Instalaciones de fontanería, calefacción y aire acondicionado»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["25","Fabricación de productos elaborados de metal, excepto maquinaria y equipo"],"g":["252","Fabricación de armas y municiones"],"o":""}},{"c":"2591","d":"Forja, prensado, estampado y laminado de metal; pulvimetalurgia","b":true,"m":"El Usuario Industrial con Código CIIU 2591 cuya Actividad Económica Principal es Forja, prensado, estampado y laminado de metal; pulvimetalurgia es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de artículos metálicos, acabados o semiacabados, mediante forja, prensado, estampado o laminado, por medio de procesos en que se utilizan rodillos de compresión o procesos de pulvimetalurgia, utilizando polvos de metal que se someten a tratamiento calorífico (sinterización) o a compresión; en general, se trata de la fabricación de una amplia gama de productos que habitualmente se realiza por contrata o a cambio de una retribución, y de ser tomados por separado, serían característicos de otras actividades manufactureras."],"n":["La fabricación de polvos de metal. Se incluye, según se trate, en el código 2410, «Industrias básicas de hierro y de acero», o en el grupo 242, «Industrias básicas de metales preciosos y de metales no ferrosos»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["25","Fabricación de productos elaborados de metal, excepto maquinaria y equipo"],"g":["259","Fabricación de otros productos elaborados de metal y actividades de servicios relacionadas con el trabajo de metales"],"o":""}},{"c":"2592","d":"Tratamiento y revestimiento de metales; mecanizado","b":true,"m":"El Usuario Industrial con Código CIIU 2592 cuya Actividad Económica Principal es Tratamiento y revestimiento de metales; mecanizado es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["Las actividades de enchapado, pulimento, anodizado, coloración, cromado, cincado, galvanizado (electro-plateado), bicromatizado, sulfatado, pavonado, entre otros, son procesos en los que se deposita otro metal sobre una superficie metálica y mediante la aplicación de corriente eléctrica se le confieren propiedades específicas de acabado.","El revestimiento no metálico de metales: pintura, plastificado, esmaltado, lacado (laqueado), entre otros.","Se incluyen procedimientos tales como el bruñido, desbarbado, limpieza con chorro de arena, pulimento en tambor giratorio, limpieza, soldadura, afilado, esmerilado, lapidado, brochado y otros tratamientos especiales del metal y de artículos de metal que se realizan por contrata o a cambio de una retribución.","Los tratamientos térmicos de metales (temple, recocido, revenido, entre otros), excepto cuando hacen parte de las actividades desarrolladas para la obtención de productos metálicos de fundición.","Los procesos de reducción de masa de metales como taladrado, torneado, limado, cepillado, fresado, erosión, triturado, aserrado, entre otros procesos de arranque de viruta o de abrasión.","El corte y grabado de metales mediante el uso de rayos láser."],"n":["Las actividades de herradores (marcar el ganado y clavar las herraduras a los caballos, burros, bueyes y otros animales de trabajo). Se incluyen en el código 0162, «Actividades de apoyo a la ganadería».","La impresión directa sobre metales. Se incluye en el código 1811, «Actividades de impresión».","El enchapado de metales comunes u otros metales en metales preciosos. Se incluye en el código 2421, «Industrias básicas de metales preciosos».","Las actividades de talleres de fundición de metales ferrosos y metales no ferrosos, y la fabricación de piezas fundidas en estos materiales o aleaciones de estos metales que no estén incluidas en las categorías descritas en las divisiones 25 a 32. Se incluyen en el código 2431, «Fundición de hierro y de acero», o en el código 2432, «Fundición de metales no ferrosos», según sea el caso.","La fabricación de artículos manuales para actividades agropecuarias. Se incluye en el código 2593, «Fabricación de artículos de cuchillería, herramientas de mano y artículos de ferretería»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["25","Fabricación de productos elaborados de metal, excepto maquinaria y equipo"],"g":["259","Fabricación de otros productos elaborados de metal y actividades de servicios relacionadas con el trabajo de metales"],"o":""}},{"c":"2593","d":"Fabricación de artículos de cuchillería, herramientas de mano y artículos de ferretería","b":true,"m":"El Usuario Industrial con Código CIIU 2593 cuya Actividad Económica Principal es Fabricación de artículos de cuchillería, herramientas de mano y artículos de ferretería es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de artículos de metal para uso doméstico: cuchillos y navajas; otros artículos de cuchillería, incluso destrales (hachas de mano) y cuchillas; navajas, máquinas de afeitar y hojas de afeitar; tijeras comunes de podar, de peluquería y para las uñas; cucharas, tenedores, cucharones, espumaderas, cuchillos de pescado, pinzas para servir y demás utensilios de mesa o de cocina.","La fabricación de herramientas de mano, sin motor, del tipo utilizado en la agricultura (por ejemplo, machetes), la horticultura, la ganadería y la silvicultura; en la carpintería, la ebanistería u otros trabajos de la madera; en el ensamblaje mecánico, en la chapistería y en la industria en general. Ejemplos: alicates, destornilladores, entre otros.","La fabricación de sierras manuales, serruchos y seguetas; hojas para sierras, incluso sierras circulares y de cadena, cuchillas y cizallas para máquinas o para aparatos mecánicos.","La fabricación de accesorios intercambiables para herramientas de mano, motorizadas o no y para máquinas herramienta: brocas, punzones, matrices, fresas, puntas, placas y barras sin montar, de carburos metálicos sinterizados o de aleaciones metal o cerámicas (cermet), entre otros.","La fabricación de herramientas de herrería, incluso machos de forja y yunques; tornos de banco, abrazaderas, lámparas de soldar y herramientas similares.","La fabricación de cerraduras, candados, pasadores, llaves y otros accesorios para edificios, muebles, vehículos y otros usos.","La fabricación de espadas, bayonetas y armas similares.","La fabricación de herramientas de presión.","La fabricación de abrazaderas metálicas para sujetar elementos (ej.: secciones de tubería)."],"n":["La fabricación de vajillas de mesa y cocina de metales comunes, incluidas las enchapadas con metales preciosos. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.»; pero si se trata de vajillas elaboradas en metales preciosos, se incluye en el código 3210, «Fabricación de joyas, bisutería y artículos conexos».","La fabricación de herramientas de mano con motor o impulsadas con alguna otra fuente de energía. Se incluye en el código 2818, «Fabricación de herramientas manuales con motor».","La fabricación de cajas de fundición; placas de fondo para moldes; modelos para moldes; moldes para metal (excepto las lingoteras). Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","La fabricación de cajas de moldeo y moldes cuando hacen parte del proceso integrado para la fabricación de productos metálicos de fundición. Se incluye en el código 2431, «Fundición de hierro y de acero», o en el código 2432, «Fundición de metales no ferrosos», según sea el caso.","La fabricación de cuchillería y demás utensilios de mesa de metales preciosos. Se incluye en el código 3210, «Fabricación de joyas, bisutería y artículos conexos»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["25","Fabricación de productos elaborados de metal, excepto maquinaria y equipo"],"g":["259","Fabricación de otros productos elaborados de metal y actividades de servicios relacionadas con el trabajo de metales"],"o":""}},{"c":"2599","d":"Fabricación de otros productos elaborados de metal n.c.p.","b":true,"m":"El Usuario Industrial con Código CIIU 2599 cuya Actividad Económica Principal es Fabricación de otros productos elaborados de metal n.c.p. es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de sujetadores hechos de metal: clavos, remaches, tachuelas, alfileres, grapas, arandelas y productos similares sin rosca.","La fabricación de productos de tornillería: tuercas, pernos, tornillos y productos roscados y no roscados.","La fabricación de cables de metal, trenzas y artículos similares de hierro, acero, aluminio o cobre, aislados o no, pero no aptos para conducir electricidad.","La fabricación de productos metálicos hechos con alta precisión en tornos revólver o automáticos.","La fabricación de artículos hechos de alambre; alambre de púas, cercas de alambre, rejillas, redes y telas metálicas, entre otros.","La fabricación de recipientes utilizados para el envase o transporte de mercancías: latas para productos alimenticios, barriles, tambores, bidones, tarros, cajas, entre otros, incluidos los de capacidad superior a 300 L.","La fabricación de muelles, incluso muelles semiacabados de uso general, excepto muelles para relojes (muelles de ballesta, muelles helicoidales, barras de torsión, hojas para muelles, entre otros).","La fabricación de vajillas de mesa de metales comunes, incluidas las enchapadas con metales preciosos, sartenes, cacerolas y otros utensilios de cocina.","La fabricación de pequeños aparatos de cocina accionados a mano para preparar, aderezar, acondicionar o servir alimentos.","La fabricación de utensilios de mesa y cocina no eléctricos, por ejemplo: sartenes y cacerolas.","La fabricación de baterías de cocina (ej.: recipientes para hervir el agua).","La fabricación de esponjillas metálicas.","La fabricación de artículos sanitarios de metal como por ejemplo, bañeras, pilas, platones, lavabos y otros artículos sanitarios y de aseo, esmaltados o no.","La fabricación de pequeños artículos de metal para oficina, excepto los muebles metálicos.","La fabricación de cajas de caudales, cajas fuertes, pórticos y puertas de cámaras blindadas, acorazadas o reforzadas, entre otros.","La fabricación de piezas y accesorios para vías de ferrocarril y de tranvía ensambladas y fijadas (por ejemplo, carriles ensamblados, plataformas giratorias, potros de contención, entre otros).","La fabricación de otros artículos de metal no clasificados en otra parte, como por ejemplo, cadenas (excepto cadenas de transmisión de potencia), hélices para barcos y palas para hélices, anclas, campanas, marcos para fotos o cuadros, tubos y cajas colapsables, cierres, hebillas, corchetes, almohadillas metálicas para fregar, señales de tránsito y artículos similares, cualquiera que sea el metal utilizado, excepto metales preciosos.","La fabricación de vallas, avisos y similares de metal, excepto las iluminadas.","La fabricación de material fijo, piezas ensambladas y de aparatos de señalización de vías férreas.","La fabricación de imanes metálicos permanentes.","La fabricación de bolsas o envoltorios metálicos.","La fabricación de termos de metal.","La fabricación de chapas de metal e insignias militares de metal.","La fabricación de peines y rulos de metal.","La fabricación de mangos y estructuras de metal para paraguas.","La fabricación de jarros y botellas de metal.","La fabricación herramientas mecánicas simples de medición elaboradas en metal.","La fabricación de trofeos y estatuillas utilizadas en metales comunes para decoración interior.","La fabricación de artículos de metal para órganos y pianos.","La fabricación de pesas de metal usadas para el levantamiento de pesas."],"n":["La fabricación de recipientes para el almacenamiento y/o la elaboración de materiales. Se incluye en el código 2512, «Fabricación de tanques, depósitos y recipientes de metal, excepto los utilizados para el envase o transporte de mercancías».","La fabricación de espadas, bayonetas y armas similares. Se incluye en el código 2593, «Fabricación de artículos de cuchillería, herramientas de mano y artículos de ferretería».","La fabricación de muelles para relojes. Se incluye en el código 2652, «Fabricación de relojes».","La fabricación de cables de metal aislados, pero aptos para conducir electricidad. Se incluye en el código 2731, «Fabricación de hilos y cables eléctricos y de fibra óptica».","La fabricación de avisos y carteles iluminados. Se incluye en el código 2740, «Fabricación de equipos eléctricos de iluminación».","La fabricación de cadenas de transmisión de potencia. Se incluye en el código 2814, «Fabricación de cojinetes, engranajes, trenes de engranajes y piezas de transmisión».","La fabricación de carritos de supermercado. Se incluye en el código 3099, «Fabricación de otros tipos de equipo de transporte n.c.p.».","La fabricación de muebles de metal. Se incluye en el grupo 311, «Fabricación de muebles».","La fabricación de artículos de metales preciosos, incluidas las vajillas y utensilios de mesa. Se incluye en el código 3210, «Fabricación de joyas, bisutería y artículos conexos».","La fabricación de artículos para deporte. Se incluye en el código 3230, «Fabricación de artículos y equipo para la práctica del deporte».","La fabricación de juegos y juguetes. Se incluye en el código 3240, «Fabricación de juegos, juguetes y rompecabezas ».","La fabricación tre otros).","La fabricación de conectores electrónicos.","La fabricación de circuitos integrados (analógicos, digitales o híbridos) y micro-ensambles electrónicos.","La fabricación de diodos, transistores y componentes electrónicos similares.","La fabricación de inductores (estárteles, bobinas, transformadores) tipo componente electrónico.","La fabricación de cristales electrónicos y montajes de cristal.","La fabricación de solenoides, interruptores y transductores para aplicaciones electrónicas.","La fabricación de dados u obleas, semiconductores, terminados o semiterminados.","La fabricación de tarjetas interfaz (sonido, controles, red, módem), módems externos, y tarjetas inteligentes (tarjetas con circuito integrado) tales como tarjetas de crédito con chip incorporado, tarjetas SIM y GSM utilizadas en teléfonos celulares, tarjetas para transporte masivo, entre otras.","La fabricación de partes componentes de pantallas (plasma, polímero, LCD).","La fabricación de diodos emisores de luz (LED).","La fabricación de cables de impresora, cables de monitor, cables USB, conectores y cables similares.","La fabricación de cabezales (de grabación, lectura/escritura, entre otros)."],"n":["La extracción de los minerales columbita y tantalita valorados principalmente por su contenido de columbio, niobio y tantalio (cuya mezcla de estos elementos es conocida como «Coltán»). Se incluye en el código 0729, «Extracción de otros minerales metalíferos no ferrosos n.c.p.».","La impresión de tarjetas inteligentes. Se incluye en el código 1811, «Actividades de impresión».","La fabricación de lectores de tarjetas inteligentes. Se incluye en el código 2620, «Fabricación de computadoras y de equipo periférico».","La fabricación de módems diferentes a los utilizados en computadores. Se incluye en el código 2630, «Fabricación de equipos de comunicación».","La fabricación de pantallas para computador. Se incluye en el código CIIU 2620, «Fabricación de computadoras y de equipo periférico».","  periférico","b":true,"m":"El Usuario Industrial con Código CIIU 2620 cuya Actividad Económica Principal es Fabricación de computadoras y de equipo periférico es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["Almacenar uno o varios programas de procesamiento y los datos necesarios para su ejecución 2) pueden ser programados libremente en función de las necesidades del usuario;","Efectuar cálculos matemáticos especificados por el usuario; y","Ejecutar, sin intervención humana, programas de procesamiento que requiera la computadora para modificar su ejecución por decisión lógica durante un proceso en marcha. Los computadores analógicos permiten la simulación de modelos matemáticos y la comprensión de elementos de control y de programación analógicos.","La fabricación de computadoras de escritorio.","La fabricación de computadoras portátiles y tabletas electrónicas (tablets).","La fabricación de computadoras centrales.","La fabricación de computadoras de mano, por ejemplo, los PDA o Palm.","La fabricación de unidades de discos magnéticos, memorias flash como tarjetas SD (Secure Digital) y memorias USB, y otros dispositivos de almacenamiento permanente de datos a base de semiconductores.","La fabricación de unidades de discos ópticos (CD-RW, CD-ROM, DVD-ROM, DVD-RW, Blu-ray Disc y similares).","La fabricación de impresoras; monitores; teclados; ratones (mouse), palancas (joystick) y accesorios de esfera móvil.","La fabricación de terminales para computadores de uso específico.","La fabricación de servidores.","La fabricación de escáner, incluidos escáner de código de barras.","La fabricación de lectores de tarjetas inteligentes.","La fabricación de cascos de realidad virtual.","La fabricación de proyectores multimedia (video beam)","La fabricación de máquinas analógicas de procesamiento de datos, provistas de elementos analógicos de control y de programación. Elementos adicionales para computadoras analógicas con función de difusión o televisión que incorporen o no aparatos receptores o aparatos para la grabación o reproducción del sonido.","La fabricación de equipos y elementos para televisión por cable.","La fabricación de buscadores de personas, teléfonos celulares y otros equipos de comunicación móviles.","La fabricación de equipos de emisión de radio y televisión.","La fabricación de módems, diferentes a los utilizados en computadores.","La fabricación de sistemas de alarma contra incendio y robo, que envían señales a una estación de control.","La fabricación de aparatos infrarrojos (ej.: control remoto).","La fabricación de equipo de telecomunicación para satélites."],"n":["La fabricación de componentes electrónicos y sub-ensambles usados en equipos de comunicación. Se incluye en el código 2610, «Fabricación de componentes y tableros electrónicos».","La fabricación de módems internos/externos de computadoras (tipo PC). Se incluye en el código CIIU 2610, «Fabricación de componentes y tableros electrónicos».","La fabricación de computadoras y equipo periférico de computadoras. Se incluye en el código 2620, «Fabricación de computadoras y de equipo periférico».","La fabricación de equipos de audio y video de uso doméstico o personal. Se incluye en el código 2640, «Fabricación de aparatos electrónicos de consumo».","La fabricación de materiales en blanco de reproducción para grabaciones sonoras y de otros tipos. Se incluye en el código 2680, «Fabricación de medios magnéticos y ópticos para el almacenamiento de datos».","La fabricación de tableros electrónicos del tipo de los usados en los estadios. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de semáforos. Se incluye en el código CIIU 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","El mantenimiento y reparación de equipos de comunicación. Se incluyen en el código 9512, «Mantenimiento y reparación de equipos de comunicación»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["26","Fabricación de productos informáticos, electrónicos y ópticos"],"g":["263","Fabricación de equipos de comunicación"],"o":""}},{"c":"2640","d":"Fabricación de aparatos electrónicos de consumo","b":true,"m":"El Usuario Industrial con Código CIIU 2640 cuya Actividad Económica Principal es Fabricación de aparatos electrónicos de consumo es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de videograbadoras y equipos de grabación similares.","La fabricación de monitores y pantallas de televisión.","La fabricación de aparatos para la grabación de sonido y sistemas de grabación.","La fabricación de aparatos para la reproducción de casetes y otros aparatos para la reproducción de sonido.","La fabricación de equipos de sonido.","La fabricación de receptores de radio, incluso aparatos con dispositivos de grabación y de reproducción de sonido o con un dispositivo de relojería.","La fabricación de cámaras de video del tipo casera.","La fabricación de tocadiscos (rocolas).","La fabricación de sistemas de altavoces (altoparlantes).","La fabricación de amplificadores para instrumentos musicales y sistemas de amplificación electrónica.","La fabricación de micrófonos.","La fabricación de reproductores de CD, DVD, Blu-ray Disc y similares.","La fabricación de máquinas karaoke.","La fabricación de audífonos (radio, computadores), excepto los audífonos utilizados por personas con pérdida auditiva.","La fabricación de consolas de videojuegos."],"n":["La producción de copias sobre grabaciones originales (programas de informática, sonido, video, entre otros). Se incluye en el código 1820, «Producción de copias a partir de grabaciones originales».","La fabricación de computadoras, equipos periféricos (incluso unidades de discos ópticos) y monitores de computadora. Se incluye en el código 2620, «Fabricación de computadoras y de equipo periférico».","La fabricación de máquinas contestadoras. Se incluye en el código 2630, «Fabricación de equipos de comunicación ».","La fabricación de equipos buscadores de personas. Se incluye en el código CIIU 2630, «Fabricación de equipos de comunicación».","La fabricación de equipos de control remoto (radio e infrarrojos). Se incluye en el código 2630, «Fabricación de equipos de comunicación».","La fabricación de equipos de estudios de emisoras tales como equipo de reproducción, antenas de recepción y transmisión, y cámaras de video comerciales. Se incluye en el código 2630, «Fabricación de equipos de comunicación».","La fabricación de audífonos utilizados por personas con pérdida auditiva. Se incluye en el código 2660, «Fabricación de equipo de irradiación y equipo electrónico de uso médico y terapéutico».","La fabricación de materiales en blanco de reproducción para grabaciones sonoras y de otros tipos. Se incluye en el código 2680, «Fabricación de medios magnéticos y ópticos para el almacenamiento de datos».","La fabricación de juegos electrónicos con software incluido (no reemplazable). Se incluye en el código 3240, «Fabricación de juegos, juguetes y rompecabezas».","El mantenimiento y reparación de aparatos electrónicos de consumo. Se incluye en el código 9521, «Mantenimiento y reparación de aparatos electrónicos de consumo»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["26","Fabricación de productos informáticos, electrónicos y ópticos"],"g":["264","Fabricación de aparatos electrónicos de consumo"],"o":""}},{"c":"2651","d":"Fabricación de equipo de medición, prueba, navegación y control","b":true,"m":"El Usuario Industrial con Código CIIU 2651 cuya Actividad Económica Principal es Fabricación de equipo de medición, prueba, navegación y control es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de instrumentos para el monitoreo del funcionamiento de los motores de avión. Por ejemplo: tacómetros (miden el número de revoluciones del motor por minuto), horómetros (miden el número de horas de recorrido de la máquina), entre otros instrumentos.","La fabricación de equipo de prueba de emisiones automotrices.","La fabricación de aparatos para ensayar y regular los motores de vehículos mediante el control de todos los órganos de encendido (bobinas, bujías, condensadores, baterías, entre otros), el reglaje de la carburación mediante un analizador de los gases de escape y la medida de la compresión en cada uno de los cilindros.","La fabricación de instrumentos y aparatos de navegación marítima o fluvial tales como compases de navegación (ejemplo: compases magnéticos, compases giroscópicos, y similares), instrumentos para determinar la situación (ejemplo: sextantes), los demás instrumentos para la navegación (ejemplo: timones automáticos, registradores de rumbo, entre otros) y sondas ultrasónicas.","La fabricación de instrumentos de navegación aérea tales como altímetros, varió-metros, máchmetros, acelerómetros, y pilotos automáticos.","La fabricación de equipos de búsqueda, detección, navegación, aeronáutica y náutica, incluyendo sonares.","La fabricación de radares.","La fabricación de máquinas y aparatos de ensayo para determinar las propiedades físicas de los materiales; máquinas y aparatos para establecer la dureza y otras propiedades de los metales o la resistencia al desgaste y otras propiedades de los textiles. Comprende un conjunto de máquinas o aparatos diseñados para efectuar ensayos de dureza, elasticidad, resistencia a la tracción, a la compresión, a la flexión, o de otras propiedades mecánicas de materiales diversos: madera, manufacturas de cemento o de hormigón, textiles (hilados, tejidos), papel y cartón, caucho, plástico, cueros, entre otros materiales.","La fabricación de máquinas detectoras de mentiras (polígrafos).","La fabricación de aparatos para medir y verificar magnitudes eléctricas, por ejemplo, osciloscopios y oscilógrafos que registran movimientos oscilatorios; y los instrumentos para verificar la corriente, el voltaje o la resistencia, estén provistos o no, de un dispositivo registrador, como por ejemplo, galvanómetros, amperímetros o voltímetros.","La fabricación de instrumentos para medir y verificar señales eléctricas.","La fabricación de aparatos para medir o verificar magnitudes no eléctricas; por ejemplo, detectores y contadores de radiaciones.","La fabricación de instrumentos y aparatos diseñados especialmente para las telecomunicaciones, tales como diafonómetros, hipsómetros, neperímetros y aparatos para ensayar.","La fabricación de instrumentos de agrimensura, geodesia y topografía tales como teodolito, para establecer planos y medir ángulos; niveles ópticos; alidada.","La fabricación de controles de fuego y flama.","La fabricación de espectrómetros (aparatos que identifican las diferentes componentes del espectro de frecuencias de una señal eléctrica).","La fabricación de calibradores diseñados para altos niveles de precisión.","La fabricación de contadores de consumo de electricidad, agua o gas, gasolina, entre otros.","La fabricación de instrumentos y aparatos para medir y verificar el flujo, el nivel, la presión u otras variables de líquidos o gases (por ejemplo, medidores de flujo, indicadores de nivel, manómetros, calorímetros de hielo, o de calentamiento, entre otros).","La fabricación de detectores de minas, generadores de pulso (señal); detectores de metales.","La fabricación de equipos de posicionamiento global (GPS).","La fabricación de dispositivos y aparatos de control ambiental y controles automáticos (ej.: termostatos, para regular la temperatura; reguladores de presión llamados también manóstatos o presostatos, de nivel de humedad [humidostatos] y de tiro de estufas; y reguladores automáticos de distintas magnitudes eléctricas).","La fabricación de equipos de medida y grabación (caja negra).","La fabricación de detectores de movimiento.","La fabricación de instrumentos de análisis de laboratorio (equipos de análisis de sangre).","La fabricación de balanzas de precisión, sensibles a pesos iguales o inferiores a 5 cg.; estas balanzas están diseñadas para efectuar mediciones de precisión, son de metal inoxidable o de aleaciones ligeras, con cuchillas, cojinetes y planos de ágata.","La fabricación de escalas de laboratorio, incubadoras y aparatos diversos de laboratorio para medición y prueba: la fabricación de instrumentos y aparatos para efectuar análisis físicos o químicos tales como polarímetros, para medir el ángulo de rotación del plano de polarización de un rayo luminoso que atraviesa sustancias ópticamente activas, es decir, dotadas de poder rotatorio; refractómetros, para determinar el índice de refracción de los líquidos o de los sólidos; colorímetros, para determinar el color de una sustancia (líquida o sólida); analizadores de gases o de humos (aparatos de Orsat), para el análisis de gases combustibles o de productos de la combustión (gases quemados) en los hornos de coque, gasógenos, altos hornos, etc., y que permiten dosificar principalmente el ácido carbónico, el óxido de carbono, el oxígeno y el hidrógeno; viscosímetros, que permiten determinar la viscosidad, es decir, el frotamiento interno que caracteriza a un líquido; instrumentos para medir la tensión superficial o interfacial de los líquidos (peso, volumen, altura); y los pehachímetros (medidores de pH) para medir la magnitud por la que se valora el carácter ácido o básico de un medio.","La fabricación de microscopios (excepto los microscopios ópticos) y los aparatos de difracción, es decir, los microscopios electrónicos.","La fabricación de instrumentos y aparatos de meteorología tales como veletas; anemómetros, para medir la velocidad del viento; evaporímetros, para medir la capacidad de la evaporación de la atmósfera; pluviómetros, para medir la cantidad de agua lluvia.","La fabricación de instrumentos y aparatos de geofísica tales como sismómetros y sismógrafos, para registrar la hora, la duración y la amplitud de los movimientos de un punto de la corteza terrestre durante los terremotos, o para la detección del petróleo.","La fabricación de telémetros para determinar la distancia que separa al observador de un punto alejado determinado.","La fabricación de instrumentos de oceanografía y de hidrología; de aparatos de radar y de control remoto.","La fabricación de otros instrumentos, aparatos o máquinas de medición, verificación o ensayo: termómetros de líquido, de metal y de cristales líquidos (excepto los de uso médico); barómetros (de mercurio o aneroide) para medir la presión atmosférica; hidrómetros, para apreciar el grado de humedad del aire (estado higrométrico), de otros gases o de materias sólidas","La fabricación de aparatos de contar: cuentarrevoluciones, que contabilizan las vueltas de cualquier órgano (por ejemplo, el árbol de una máquina); taxímetros, que se utilizan en los vehículos de transporte para indicar la distancia recorrida y el precio de esta distancia; podómetros (llamados también odómetros, cuenta-pasos), que sirven para medir, aproximadamente, las distancias recorridas; tacómetros; bancos de prueba, comparadores (incluidos los comparadores ópticos y otros aparatos e instrumentos de óptica para medir y verificar); e instrumentos para verificar relojes o piezas de relojes.","La fabricación de instrumentos y aparatos utilizados para la medición y la regulación constante y automática de variables tales como la temperatura, la presión, la viscosidad de materiales y productos durante su fabricación u otro tipo de elaboración. Estos instrumentos y aparatos poseen características específicas para su aplicación en procesos industriales tales como: mayor exactitud y precisión en la medición y la regulación de cada una de las variables."],"n":["La fabricación de instrumentos para el monitoreo del funcionamiento de los motores de avión. Por ejemplo: tacómetros (miden el número de revoluciones del motor por minuto), horómetros (miden el taje o la resistencia, estén provistos o no, de un dispositivo registrador, como por ejemplo, galvanómetros, amperímetros o voltímetros.","La fabricación de instrumentos para medir y verificar señales eléctricas.","La fabricación de aparatos para medir o verificar magnitudes no eléctricas; por ejemplo, detectores y contadores de radiaciones.","La fabricación de instrumentos y aparatos diseñados especialmente para las telecomunicaciones, tales como diafonómetros, hipsómetros, neperímetros y aparatos para ensayar.","La fabricación de instrumentos de agrimensura, geodesia y topografía tales como teodolito, para establecer planos y medir ángulos; niveles ópticos; alidada.","La fabricación de controles de fuego y flama.","La fabricación de espectrómetros (aparatos que identifican las diferentes componentes del espectro de frecuencias de una señal eléctrica).","La fabricación de calibradores diseñados para altos niveles de precisión.","La fabricación de contadores de consumo de electricidad, agua o gas, gasolina, entre otros.","La fabricación de instrumentos y aparatos para medir y verificar el flujo, el nivel, la presión u otras variables de líquidos o gases (por ejemplo, medidores de flujo, indicadores de nivel, manómetros, calorímetros de hielo, o de calentamiento, entre otros).","La fabricación de detectores de minas, generadores de pulso (señal); detectores de metales.","La fabricación de equipos de posicionamiento global (GPS).","La fabricación de dispositivos y aparatos de control ambiental y controles automáticos (ej.: termostatos, para regular la temperatura; reguladores de presión llamados también manóstatos o presostatos, de nivel de humedad [humidostatos] y de tiro de estufas; y reguladores automáticos de distintas magnitudes eléctricas).","La fabricación de equipos de medida y grabación (caja negra).","La fabricación de detectores de movimiento.","La fabricación de instrumentos de análisis de laboratorio (equipos de análisis de sangre).","La fabricación de balanzas de precisión, sensibles a pesos iguales o inferiores a 5 cg.; estas balanzas están diseñadas para efectuar mediciones de precisión, son de metal inoxidable o de aleaciones ligeras, con cuchillas, cojinetes y planos de ágata.","La fabricación de escalas de laboratorio, incubadoras y aparatos diversos de laboratorio para medición y prueba: la fabricación de instrumentos y aparatos para efectuar análisis físicos o químicos tales como polarímetros, para medir el ángulo de rotación del plano de polarización de un rayo luminoso que atraviesa sustancias ópticamente activas, es decir, dotadas de poder rotatorio; refractómetros, para determinar el índice de refracción de los líquidos o de los sólidos; colorímetros, para determinar el color de una sustancia (líquida o sólida); analizadores de gases o de humos (aparatos de Orsat), para el análisis de gases combustibles o de productos de la combustión (gases quemados) en los hornos de coque, gasógenos, altos hornos, etc., y que permiten dosificar principalmente el ácido carbónico, el óxido de carbono, el oxígeno y el hidrógeno; viscosímetros, que permiten determinar la viscosidad, es decir, el frotamiento interno que caracteriza a un líquido; instrumentos para medir la tensión superficial o interfacial de los líquidos (peso, volumen, altura); y los pehachímetros (medidores de pH) para medir la magnitud por la que se valora el carácter ácido o básico de un medio.","La fabricación de microscopios (excepto los microscopios ópticos) y los aparatos de difracción, es decir, los microscopios electrónicos.","La fabricación de instrumentos y aparatos de meteorología tales como veletas; anemómetros, para medir la velocidad del viento; evaporímetros, para medir la capacidad de la evaporación de la atmósfera; pluviómetros, para medir la cantidad de agua lluvia.","La fabricación de instrumentos y aparatos de geofísica tales como sismómetros y sismógrafos, para registrar la hora, la duración y la amplitud de los movimientos de un punto de la corteza terrestre durante los terremotos, o para la detección del petróleo.","La fabricación de telémetros para determinar la distancia que separa al observador de un punto alejado determinado.","La fabricación de instrumentos de oceanografía y de hidrología; de aparatos de radar y de control remoto.","La fabricación de otros instrumentos, aparatos o máquinas de medición, verificación o ensayo: termómetros de líquido, de metal y de cristales líquidos (excepto los de uso médico); barómetros (de mercurio o aneroide) para medir la presión atmosférica; hidrómetros, para apreciar el grado de humedad del aire (estado higrométrico), de otros gases o de materias sólidas","La fabricación de aparatos de contar: cuentarrevoluciones, que contabilizan las vueltas de cualquier órgano (por ejemplo, el árbol de una máquina); taxímetros, que se utilizan en los vehículos de transporte para indicar la distancia recorrida y el precio de esta distancia; podómetros (llamados también odómetros, cuenta-pasos), que sirven para medir, aproximadamente, las distancias recorridas; tacómetros; bancos de prueba, comparadores (incluidos los comparadores ópticos y otros aparatos e instrumentos de óptica para medir y verificar); e instrumentos para verificar relojes o piezas de relojes.","La fabricación de instrumentos y aparatos utilizados para la medición y la regulación constante y automática de variables tales como la temperatura, la presión, la viscosidad de materiales y productos durante su fabricación u otro tipo de elaboración. Estos instrumentos y aparatos poseen características específicas para su aplicación en procesos industriales tales como: mayor exactitud y precisión en la medición y la regulación de cada una de las variables."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["26","Fabricación de productos informáticos, electrónicos y ópticos"],"g":["265","Fabricación de equipo de medición, prueba, navegación y control; fabricación de relojes"],"o":""}},{"c":"2652","d":"Fabricación de relojes","b":true,"m":"El Usuario Industrial con Código CIIU 2652 cuya Actividad Económica Principal es Fabricación de relojes es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de relojes de toda clase (de pulsera, de pared, de mueble, y similares), incluso relojes para paneles de instrumentos; cajas para relojes de pulsera, incluidas las cajas de metales preciosos; piezas de relojes, incluidos los mecanismos de relojería.","La fabricación de aparatos de control del tiempo y equipos de medición, registro y otras formas de visualización de intervalos de tiempo mediante un mecanismo de relojería o un motor sincrónico (por ejemplo: parquímetros, relojes de control de asistencia, sellos con fecha y hora, temporizador de procesos); conmutadores horarios y otros aparatos que se activan con movimiento de relojería o con un motor sincrónico, como las cerraduras con temporizador.","La fabricación de piezas para relojes de todo tipo como muelles, rubíes, esferas, chapas, manecillas, puentes y otras piezas."],"n":["La fabricación de correas de reloj no metálicas en cuero natural o cuero regenerado. Se incluye en el código 1512, «Fabricación de artículos de viaje, bolsos de mano y artículos similares elaborados en cuero, y fabricación de artículos de talabartería y guarnicionería».","La fabricación de correas para reloj no metálicas en materiales textiles, plástico, sintéticos, entre otros. Se incluye en el código 1513, «Fabricación de artículos de viaje, bolsos de mano y artículos similares; artículos de talabartería y guarnicionería elaborados en otros materiales»","La fabricación de correas y pulseras para reloj en metales preciosos y metales comunes. Se incluye en el código 3210, «Fabricación de joyas, bisutería y artículos conexos».","El mantenimiento y reparación de aparatos de control del tiempo y contadores de tiempo. Se incluyen en el código 3313, «Mantenimiento y reparación especializado de equipo electrónico y óptico».","El mantenimiento y reparación de relojes de pared, de mesa y de uso personal. Se incluyen en el código 9529, «Mantenimiento y reparación de otros efectos personales y enseres domésticos»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["26","Fabricación de productos informáticos, electrónicos y ópticos"],"g":["265","Fabricación de equipo de medición, prueba, navegación y control; fabricación de relojes"],"o":""}},{"c":"2660","d":"Fabricación de equipo de irradiación y equipo electrónico de uso médico y terapéutico","b":true,"m":"El Usuario Industrial con Código CIIU 2660 cuya Actividad Económica Principal es Fabricación de equipo de irradiación y equipo electrónico de uso médico y terapéutico es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de aparatos electro-médicos y electro-terapéuticos, tales como equipos de imágenes de resonancias magnéticas, equipos médicos de ultrasonidos; marcapasos; aparatos para pérdida auditiva (audífonos); electrocardiogramas y equipo electro-médico de endoscopia. Los equipos de radiación pueden generar rayos beta, rayos gama, rayos X u otra radiación ionizada.","La fabricación de aparatos de irradiación y tubos para diversas aplicaciones: médicas (diagnósticos y terapias médicas), industriales, científicas y de investigación.","La fabricación de generadores de alta tensión, cuando presenten características radiológicas; paneles; mesas y pantallas radiológicas de control y artefactos similares.","La fabricación de escáner CT (Tomografía Computarizada).","La fabricación de escáner PET (Tomografía por Emisión de Positrones).","La fabricación de equipos MRI (Imagen por Resonancia Magnética).","La fabricación de equipos médicos láser.","La fabricación de equipos de irradiación de leche y alimentos para eliminación de microorganismos o alargar la vida útil del producto."],"n":["La fabricación de instrumentos para análisis de laboratorio (por ejemplo, equipo de análisis de sangre). Se incluye en el código 2651, «Fabricación de equipo de medición, prueba, navegación y control».","La fabricación de generadores de tensión eléctrica que no presentan características radiológicas. Se incluye en el código 2711, «Fabricación de motores, generadores y transformadores eléctricos».","La fabricación de cámaras bronceadoras. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de aparatos ortopédicos y protésicos; dentaduras postizas y dispositivos de ortodoncia; fabricación de placas de huesos y tornillos; fabricación de muebles médicos, quirúrgicos, dentales o veterinarios, tales como: mesas de operación, mesas de examinación, camas de hospital con dispositivos mecánicos y sillas de odontología; y la fabricación de termómetros de uso médico, esterilizadores usados en laboratorios, máquinas de limpieza ultrasónica, entre otros. Se incluyen en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","El mantenimiento y la reparación de equipos radiológicos, electro-médicos y electro-terapéuticos. Se incluye en el código 3313, «Mantenimiento y reparación especializado de equipo electrónico y óptico»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["26","Fabricación de productos informáticos, electrónicos y ópticos"],"g":["266","Fabricación de equipo de irradiación y equipo electrónico de uso médico y terapéutico"],"o":""}},{"c":"2670","d":"Fabricación de instrumentos ópticos y equipo fotográfico","b":true,"m":"El Usuario Industrial con Código CIIU 2670 cuya Actividad Económica Principal es Fabricación de instrumentos ópticos y equipo fotográfico es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de equipo de miras telescópicas para armas.","La fabricación de equipo de posicionamiento óptico.","La fabricación de instrumentos de aumento óptico.","La fabricación de herramientas ópticas de precisión para operarios de máquinas.","La fabricación de comparadores ópticos.","La fabricación de lentes ópticos, telescopios y binoculares.","La fabricación de elementos ópticos de vidrio o de cualquier otro material, por ejemplo, de cuarzo, excepto el fundido, de espato flúor, de plástico, de metal, de cristales cultivados, de óxido de magnesio o de halogenuros de los metales alcalinos o alcalinotérreos.","La fabricación de prismas y lentes, espejos con configuración de elementos ópticos, filtros selectivos de colores para aparatos fotográficos principalmente, elementos polarizadores, entre otros.","La fabricación de fibras ópticas las cuales están formadas por capas concéntricas (figuras geométricas) de vidrio o de plástico con diversos índices de refracción.","La fabricación de microscopios ópticos compuestos, incluidos los microscopios para microfotografía y micro-proyección, que se caracterizan por permitir, además de la observación visual, la toma de imágenes aumentadas de los objetos.","La fabricación de cámaras fotográficas (de rollo y digitales) o cinematográficas, esencialmente compuestas por una cámara oscura, un objetivo, un obturador, un diafragma, un soporte para la placa o la bobina y un visor; incluidas las cámaras utilizadas para preparar planchas de fotograbado, las cuales pueden alcanzar grandes dimensiones y son generalmente de estructura bastante diferente a la de los demás aparatos fotográficos; para fotografía subacuática (aparatos de caja estanca), fotografía aérea, diseñados para registrar imágenes sucesivas a intervalos determinados, de modo que cubran cierta extensión de territorio por medio de fotografías solapadas; aparatos para producir microfilmes o microfichas; y cámaras de filmación con banda sonora.","La fabricación de proyectores de imagen fija que proyectan la imagen de un objeto transparente (diapositiva); ampliadores y reductores de imagen, incluidas las máquinas de microfilmes y de microfichas y otros aparatos lectores de micro-formatos.","La fabricación de proyectores cinematográficos, aparatos fijos o portátiles para la proyección diascópica de una serie de imágenes en movimiento con o sin banda sonora en la misma película.","La fabricación de aparatos con lámparas de descarga (flashes electrónicos) y otros aparatos para la producción de luz de destello, excepto las lámparas de destello; aparatos para montajes láser.","La fabricación de aparatos y equipo para laboratorios fotográficos o cinematográficos: cubas especiales para revelado de filmes, para lavado de las pruebas; secadoras, abrillantadoras, máquinas y aparatos para cortar los filmes o las películas, entre otros."],"n":["La fabricación de productos fotoquímicos. Se incluye en el código 2029, «Fabricación de otros productos químicos n.c.p.».","La fabricación de elementos ópticos de vidrio sin trabajar ópticamente. Se incluye en el código 2310, «Fabricación de vidrio y productos de vidrio».","La fabricación de diodos de láser. Se incluye en el código 2610, «Fabricación de componentes y tableros electrónicos».","La fabricación de proyectores multimedia (video beam). Se incluye en el código 2620, «Fabricación de computadoras y de equipo periférico».","La fabricación de cámaras comerciales de televisión y cámaras de video. Se incluye en el código 2630, Fabricación de equipos de comunicación».","La fabricación de cámaras de video del tipo casero. Se incluye en el código 2640, «Fabricación de aparatos electrónicos de consumo».","La fabricación de aparatos de medición o verificación provistos de elementos ópticos que estén destinados a otros usos; por ejemplo, teodolitos. Se incluye en el código 2651, «Fabricación de equipo de medición, prueba, navegación y control».","La fabricación de cables de fibra óptica (compuestos de fibras recubiertas individualmente) para la transmisión de datos codificados. Se incluye en el código 2731, «Fabricación de hilos y cables eléctricos y de fibra óptica».","La fabricación de máquinas fotocopiadoras. Se incluye en el código 2817, «Fabricación de maquinaria y equipo de oficina (excepto computadoras y equipo periférico)».","La fabricación de artículos oftalmológicos provistos de elementos ópticos. Se incluye en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","El mantenimiento y la reparación de instrumentos ópticos y equipo fotográfico. Se incluye en el código 3313, «Mantenimiento y reparación especializado de equipo electrónico y óptico».","La reparación de cables de fibra óptica para la transmisión de imágenes en directo. Se incluye en el código 3314, «Mantenimiento y reparación especializado de equipo eléctrico»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["26","Fabricación de productos informáticos, electrónicos y ópticos"],"g":["267","Fabricación de instrumentos ópticos y equipo fotográfico"],"o":""}},{"c":"2680","d":"Fabricación de medios magnéticos y ópticos para almacenamiento de datos","b":true,"m":"El Usuario Industrial con Código CIIU 2680 cuya Actividad Económica Principal es Fabricación de medios magnéticos y ópticos para almacenamiento de datos es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de medios magnéticos y ópticos para el almacenamiento de datos tales como cintas magnéticas de audio y video en blanco (casetes), disquetes en blanco, discos ópticos en blanco, discos duros, tarjetas con banda magnética incorporada, entre otros soportes."],"n":["La producción de copias a partir de grabaciones originales (medios informáticos, sonido, video, entre otros). Se incluye en el código 1820, «Producción de copias a partir de grabaciones originales»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["26","Fabricación de productos informáticos, electrónicos y ópticos"],"g":["268","Fabricación de medios magnéticos y ópticos para almacenamiento de datos"],"o":""}},{"c":"2711","d":"Fabricación de motores, generadores y transformadores eléctricos","b":true,"m":"El Usuario Industrial con Código CIIU 2711 cuya Actividad Económica Principal es Fabricación de motores, generadores y transformadores eléctricos es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de transformadores para equipos de soldadura de arco eléctrico.","La fabricación de reactancias (balastos), es decir, transformadores para lámparas fluorescentes.","La fabricación de transformadores de subestación para la distribución de energía eléctrica.","La fabricación de transformadores de estaciones de interconexión de redes.","La fabricación de motores eléctricos (excepto los motores de arranque para motores de combustión interna).","La fabricación de bobinas de inducción.","La fabricación de generadores de energía (excepto los utilizados con los motores de encendido por chispa o por compresión).","La fabricación de generadores de fuerza (excepto los alternadores cargados por baterías para motores de combustión interna).","La fabricación de conjuntos generador-máquina motriz (excepto motores turbogeneradores movidos por una turbina de gas, vapor o hidráulica).","El rebobinado de armaduras.","Las bobinas de reactancias, generadores de alta tensión."],"n":["La fabricación de transformadores para aplicaciones electrónicas. Se incluye en el código 2610, «Fabricación de componentes y tableros electrónicos».","La fabricación de diodos. Se incluye en el código CIIU 2610, «Fabricación de componentes y tableros electrónicos ».","La fabricación dispositivos de control ambiental e instrumentos de control de procesos industriales y no industriales. Se incluye en el código 2651, «Fabricación de equipo de medición, prueba, navegación y control».","La fabricación de rectificadores de metal o de cristal y cargadores de baterías. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de invertidores, convertidores de estado sólido, células energéticas, y unidades de suministro de potencia regulada y no regulada en estado sólido. Se incluye en el código CIIU 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de equipo eléctrico para soldadura autógena y soldadura blanda. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de conjuntos turbina-generador. Se incluye en el código 2811, «Fabricación de motores, turbinas y partes para motores de combustión interna».","La fabricación de motores de combustión interna. Se incluye en el código CIIU 2811, «Fabricación de motores, turbina y partes para motores de combustión interna»; el código 2910, «Fabricación de vehículos automotores y sus motores»; el código 3030, «Fabricación de aeronaves, naves espaciales y de maquinaria conexa», y el código 3091, «Fabricación de motocicletas», según sea el caso.","La fabricación de motores de arranque y generadores para motores de encendido por chispa o compresión. Se incluye en el código 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de motores eléctricos fuera de borda. Se incluye en el código 2811, «Fabricación de motores, turbinas y partes para motores de combustión interna».","El mantenimiento y reparación especializado de equipo eléctrico cuando es realizado por establecimientos dedicados exclusivamente a dicha actividad. Se incluyen en el código 3314, «Mantenimiento y reparación especializado de equipo eléctrico»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["27","Fabricación de aparatos y equipo eléctrico"],"g":["271","Fabricación de motores, generadores y transformadores eléctricos y de aparatos de distribución y control de la energía eléctrica"],"o":""}},{"c":"2712","d":"Fabricación de aparatos de distribución y control de la energía eléctrica","b":true,"m":"El Usuario Industrial con Código CIIU 2712 cuya Actividad Económica Principal es Fabricación de aparatos de distribución y control de la energía eléctrica es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de disyuntores de circuitos de energía (aparatos destinados a interrumpir automáticamente el paso de la corriente cuando la intensidad o la tensión de esta excede un valor límite).","La fabricación de relés (aparatos destinados a producir en un circuito una modificación dada, cuando se cumplen determinadas condiciones en el mismo circuito en otro distinto).","La fabricación de tableros (ensamblados de un cierto número de aparatos utilizados en la distribución de la energía eléctrica, o para el control de la misma), paneles (incluso paneles de control numérico), consolas, mesas, cajas y otras bases, equipados con dos o más de los aparatos anteriormente descritos, para el control o la distribución de energía eléctrica, incluso los provistos de instrumentos de medición y control.","La fabricación de conductos para cuadros de distribución.","La fabricación de fusibles eléctricos (tienen la propiedad de fundirse cuando la corriente excede el valor permitido, cortando de esta forma el circuito en el que están intercalados).","La fabricación de aparatos de conmutación (utilizados para unir a voluntad un circuito con otro u otros circuitos).","La fabricación de interruptores de energía eléctrica (para tensiones superiores a los 1000 voltios).","La fabricación de reguladores de voltaje de transmisión y distribución.","La fabricación de limitadores de sobretensión (para voltajes de distribución)."],"n":["La fabricación de alambre o placa para fusibles. Se incluye en el código 2429, «Industrias básicas de otros metales no ferrosos».","La fabricación de conectores e interruptores para aplicaciones electrónicas y para circuitos eléctricos. Se incluye en el código 2610, «Fabricación de componentes y tableros electrónicos» y en el código 2732, «Fabricación de dispositivos de cableado», respectivamente.","La fabricación de conmutadores para circuitos eléctricos (como los de pulsador, solenoide, oscilantes, entre otros). Se incluye en el código 2732, «Fabricación de dispositivos de cableado».","La fabricación de tableros, paneles, consolas, etc., para telefonía y telegrafía. Se incluye en el código 2630, «Fabricación de equipos de comunicación».","La fabricación de instrumentos de control ambiental (dispositivos automáticos de control y regulación para aparatos de uso doméstico [ejemplo: de calefacción, de aire acondicionado, entre otros]) y de procesos industriales que muestran, indican, registran, transmiten y controlan variables como temperatura, humedad, presión, combustión, flujo de nivel, etc. Se incluyen en el código 2651, «Fabricación de equipo de medición, prueba, navegación y control».","La fabricación de equipos de soldadura eléctrica, incluyendo equipos operados manualmente. Se incluyen en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de electrodos de carbón y de grafito. Se incluye en el código CIIU 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","El mantenimiento y reparación especializado de aparatos de distribución y control de la energía eléctrica cuando son realizados por establecimientos dedicados exclusivamente a dicha actividad. Se incluyen en el código 3314, «Mantenimiento y reparación especializado de equipo eléctrico»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["27","Fabricación de aparatos y equipo eléctrico"],"g":["271","Fabricación de motores, generadores y transformadores eléctricos y de aparatos de distribución y control de la energía eléctrica"],"o":""}},{"c":"2720","d":"Fabricación de pilas, baterías y acumuladores eléctricos","b":true,"m":"El Usuario Industrial con Código CIIU 2720 cuya Actividad Económica Principal es Fabricación de pilas, baterías y acumuladores eléctricos es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de pilas recargables (acumuladores) y no recargables (pila eléctrica). La fabricación de pilas y baterías de pilas eléctricas: pilas de dióxido de manganeso, óxido de mercurio, óxido de plata u otro material.","La fabricación de acumuladores eléctricos, incluso partes de esos acumuladores tales como separadores, contenedores, tapas, placas y rejillas de plomo; acumuladores de plomo-ácido, níquel-hierro, níquel-cadmio o de otro tipo como, por ejemplo, baterías para automotores.","La fabricación de baterías de ácido de plomo.","La fabricación de baterías de níquel-cadmio.","La fabricación de baterías de níquel e hidruro metálico. (Este es el tipo de batería recargable que utiliza un ánodo de oxi-hidróxido de níquel [NiOOH], como la batería de níquel-cadmio, pero su cátodo es de una aleación de hidruro metálico).","La fabricación de baterías de litio.","La fabricación de baterías de pilas secas. (Aquellas en las que el electrolito inmovilizado con sustancias absorbentes o geles forma una pasta. El electrolito usado puede ser líquido, pero está inmovilizado para evitar su vertido; por ejemplo, las utilizadas en aparatos portátiles).","La fabricación de baterías de pilas húmedas. (Aquellas en las que el electrolito es un líquido que no está inmovilizado; las pilas de este tipo son sensibles a la posición en la que se coloquen).","La reconstrucción de baterías para automotores."],"n":["El mantenimiento y reparación especializado de pilas, baterías y acumuladores eléctricos cuando son realizados por establecimientos dedicados exclusivamente a dicha actividad. Se incluyen en el código 3314, «Mantenimiento y reparación especializado de equipo eléctrico»"],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["27","Fabricación de aparatos y equipo eléctrico"],"g":["272","Fabricación de pilas, baterías y acumuladores eléctricos"],"o":""}},{"c":"2731","d":"Fabricación de hilos y cables eléctricos y de fibra óptica","b":true,"m":"El Usuario Industrial con Código CIIU 2731 cuya Actividad Económica Principal es Fabricación de hilos y cables eléctricos y de fibra óptica es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de hilos y cables (incluidos los cables coaxiales) recubiertos con material aislante (incluidos los laqueados o anodinados), y otros conductores de electricidad aislados, estén provistos o no de conectores, hechos de acero, cobre y aluminio.","La fabricación de cables de fibra óptica recubiertos individualmente de material aislado, para la transmisión de datos codificados (telecomunicaciones, video control de datos, entre otros) o la transmisión de imágenes en directo."],"n":["La fabricación de cables de metales no ferrosos sin material aislante. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de cables de metal no aislados o de cables aislados pero no aptos para conducir electricidad. Se incluye en el código CIIU 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de hilos (por proceso de estirado de hilo). Se incluye en el código 2410, «Industrias básicas de hierro y de acero» o en el código 2429, «Industrias básicas de otros metales no ferrosos».","La fabricación de cables de computadora, de impresora, cables USB y juegos de cables similares o ensambles. Se incluye en el código 2610, «Fabricación de componentes y tableros electrónicos».","La fabricación de cables de extensión o alargadores de alambre aislado. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de juegos de cable, cable preformado y juegos de cables similares o ensambles para aplicaciones automotrices. Se incluye en el código 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de fibra o hilo de vidrio. Se incluye en el código 2310, «Fabricación de vidrio y productos de vidrio».","La fabricación de juegos de cables de fibra óptica o cables de fibra óptica ensamblados con conectores u otros accesorios. Se clasifica según su aplicación, por ejemplo: la fabricación de cables de impresora, cables de monitor, cables de USB, entre otros, se incluye en el código 2610, «Fabricación de componentes y tableros electrónicos»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["27","Fabricación de aparatos y equipo eléctrico"],"g":["273","Fabricación de hilos y cables aislados y sus dispositivos"],"o":""}},{"c":"2732","d":"Fabricación de dispositivos de cableado","b":true,"m":"El Usuario Industrial con Código CIIU 2732 cuya Actividad Económica Principal es Fabricación de dispositivos de cableado es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de dispositivos de cableado transportadores de corriente y no transportadores de corriente para circuitos eléctricos, independientemente del material utilizado en su fabricación.","Las principales actividades manufactureras características de esta clase son:","La fabricación de barras colectoras y otros conductores eléctricos (excepto del tipo de los utilizados en conmutadores)","La fabricación de interruptores de circuito con pérdida a tierra (GFCI).","La fabricación de portalámparas.","La fabricación de conmutadores como interruptores a presión, de botón, de resorte entre otros.","La fabricación de enchufes y tomas de corriente.","La fabricación de cajas para cableado eléctrico (conexiones, salidas, cajas de interruptores).","La fabricación de dispositivos para postes de transmisión y herrajes para líneas eléctricas.","La fabricación de dispositivos plásticos de cableado no conductores de corriente incluido cajas plásticas de conexiones, tapas para tomas e interruptores y accesorios plásticos para tendidos aéreos.","La fabricación de conductos y juntas de metal aisladas para la conducción de electricidad (ejemplo: las usadas en máquinas de gran potencia y en equipos de control)","La fabricación de pararrayos."],"n":["La fabricación de aisladores eléctricos de vidrio. Se incluye en el código 2310, «Fabricación de vidrio y productos de vidrio».","La fabricación de aisladores cerámicos. Se incluye en el código 2393, «Fabricación de otros productos de cerámica y porcelana». La fabricación de conectores electrónicos, tomas e interruptores para aplicaciones electrónicas. Se incluye en el código 2610, «Fabricación de componentes y tableros electrónicos»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["27","Fabricación de aparatos y equipo eléctrico"],"g":["273","Fabricación de hilos y cables aislados y sus dispositivos"],"o":""}},{"c":"2740","d":"Fabricación de equipos eléctricos de iluminación","b":true,"m":"El Usuario Industrial con Código CIIU 2740 cuya Actividad Económica Principal es Fabricación de equipos eléctricos de iluminación es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de lámparas de descarga, incandescentes, fluorescentes, ultravioletas, infrarrojas, de destellos, etc., accesorios y bombillas.","La fabricación de proyectores de teatro.","La fabricación de accesorios de iluminación para techos.","La fabricación de candelabros eléctricos.","La fabricación de lámparas de mesa con accesorios de iluminación.","La fabricación de juegos de luces para árboles de navidad.","La fabricación de leña (tipo chimenea) eléctrica.","La fabricación de linternas (por ejemplo de carburo, eléctricas, de gas, de gasolina, de queroseno entre otras).","La fabricación de lámparas eléctricas mata insectos.","La fabricación de faroles.","La fabricación de reflectores para la iluminación de edificios, mon
