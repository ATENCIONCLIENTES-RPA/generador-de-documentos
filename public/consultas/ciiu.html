ción de bicicletas o de sillas de ruedas motorizadas para personas con discapacidad. Se incluye en el código 3092 «Fabricación de bicicletas y de sillas de ruedas para personas con discapacidad».","El desmantelamiento y la chatarrización de motocicletas, velomotores y sidecares. Se incluye en el código 3830 «Recuperación de materiales».","El mantenimiento y la reparación de motocicletas. Se incluye en el código 4542 «Comercio, mantenimiento y reparación de motocicletas y de sus partes, piezas y accesorios»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["30","Fabricación de otros tipos de equipo de transporte"],"g":["309","Fabricación de otros tipos de equipo de transporte n.c.p."],"o":""}},{"c":"3092","d":"Fabricación de bicicletas y de sillas de ruedas para personas con discapacidad","b":true,"m":"El Usuario Industrial con Código CIIU 3092 cuya Actividad Económica Principal es Fabricación de bicicletas y de sillas de ruedas para personas con discapacidad es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de bicicletas no motorizadas, tales como: velocípedos equipados con una o más ruedas, triciclos de reparto, bicicletas con sidecar, bicicletas biplaza (tándems), bicicletas de carrera o deportivas, y bicicletas para niños, excepto las bicicletas y triciclos en plástico y otros tipos de vehículos de rueda para niños.","La fabricación de sillas de ruedas para personas con discapacidad, estén o no motorizadas y sean o no propulsadas por algún medio mecánico.","La fabricación de coches en los diferentes materiales para bebés.","La fabricación de partes y piezas de bicicletas (incluso sillines) y de sillas de ruedas para personas con discapacidad."],"n":["La fabricación de velocípedos con motor auxiliar y de sidecares para bicicletas. Se incluye en el código 3091 «Fabricación de motocicletas».","La fabricación de bicicletas de pedaleo asistido y patinetas eléctricas. Se incluye en el código CIIU 3091 «Fabricación de motocicletas».","La fabricación de vehículos de ruedas para niños, incluyendo bicicletas y triciclos de plástico. Se incluye en el código 3240 «Fabricación de juegos, juguetes y rompecabezas».","El mantenimiento y la reparación de bicicletas y de sillones de ruedas para personas con discapacidad. Se incluye en el código 9529 «Mantenimiento y reparación de otros efectos personales y enseres domésticos»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["30","Fabricación de otros tipos de equipo de transporte"],"g":["309","Fabricación de otros tipos de equipo de transporte n.c.p."],"o":""}},{"c":"3099","d":"Fabricación de otros tipos de equipo de transporte n.c.p.","b":true,"m":"El Usuario Industrial con Código CIIU 3099 cuya Actividad Económica Principal es Fabricación de otros tipos de equipo de transporte n.c.p. es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de vehículos no clasificados en otra parte, a saber: vehículos de propulsión manual: carritos para equipaje, trineos, carritos para supermercados, carretoncillos; carros para rociar y espolvorear y similares.","La fabricación de vehículos de tracción animal: calesas, calesines, carrozas fúnebres y similares."],"n":["La fabricación de las partes y piezas de los vehículos clasificados en el código 3099, «Fabricación de otros tipos de equipo de transporte n.c.p.». Se clasifica según el material empleado, en la división 16 «Transformación de la madera y fabricación de productos de madera y de corcho, excepto muebles; fabricación de artículos de cestería y espartería», división 22, «Fabricación de productos de caucho y de plástico», división 25, «Fabricación de productos elaborados de metal, excepto maquinaria y equipo».","La fabricación de aparatos eléctricos y sus partes. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de montacargas o cargadores que estén o no acondicionados con equipo de elevación o manipulación, sean o no autopropulsados, del tipo usado en fábricas (incluyendo carretillas de elevación o simplemente carretillas). Se incluye en el código 2816, «Fabricación de equipo de elevación y manipulación».","La fabricación de carros cable o teleféricos y funiculares. Se incluye en el código 2816, «Fabricación de equipo de elevación y manipulación».","La fabricación de carritos decorativos de restaurantes tales como carritos de postres, carritos de comida y similares. Se incluye en el código 3110, «Fabricación de muebles»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["30","Fabricación de otros tipos de equipo de transporte"],"g":["309","Fabricación de otros tipos de equipo de transporte n.c.p."],"o":""}},{"c":"3110","d":"Fabricación de muebles","b":true,"m":"El Usuario Industrial con Código CIIU 3110 cuya Actividad Económica Principal es Fabricación de muebles es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de muebles de todo tipo utilizados en el hogar, oficinas, restaurantes, locales comerciales, teatros, colegios y centros de enseñanza, iglesias, hoteles, entre otros destinos diferentes a los medios de transporte y mobiliario especializado para equipos médicos, odontológicos y de laboratorio; además, que estén elaborados en cualquier material (madera, mimbre, bambú, metal, plástico, cuero, vidrio, etc., o combinación de estos, excepto piedra, hormigón y cerámica).","La fabricación de sofás, sofá-camas y sillones.","La fabricación de sillas y asientos para jardín.","La fabricación de muebles de cocina.","La fabricación de muebles para dormitorios, salas, comedores y similares.","La fabricación de muebles y gabinetes para máquinas de coser, televisores, entre otros.","La fabricación de divisiones de carácter removible, tipo biombo.","La fabricación de escritorios, sillas y asientos (tapizados o no), mesas, archivadores y otros muebles de oficina utilizados para almacenar, trabajar, decorar, soportar, etc.","La fabricación de sillas, sillones, butacas, pupitres, tableros, pizarras, estanterías amovibles, anaqueles, exhibidores, vitrinas, etc., y otros muebles diseñados especialmente para ser utilizados en autoservicios, bares, restaurantes, hoteles, teatros, colegios, iglesias, y sitios similares.","La fabricación de carritos decorativos para restaurantes tales como los carritos de postres, los vagones de comida, entre otros.","La fabricación de bancas, taburetes y otros asientos y muebles para laboratorio (armarios y mesas).","Los acabados para muebles como la tapicería, el rociado, la pintura y el barnizado."],"n":["La fabricación de tableros de madera celular, armarios y similares empotrados. Se incluye en el código 1630, «Fabricación de partes y piezas de madera, de carpintería y ebanistería para la construcción».","La fabricación de divisiones de madera de carácter fijo. Se incluye en el código CIIU 1630, «Fabricación de partes y piezas de madera, de carpintería y ebanistería para la construcción».","La fabricación de mobiliario tipo aplique, como percheros para ropa y sombreros, no considerados muebles en pie. Se incluye en el código 1690, «Fabricación de otros productos de madera; fabricación de artículos de corcho, cestería y espartería».","La fabricación de puertas, ventanas, postigos, marcos, alacenas, estanterías de grandes dimensiones para montar y fijar permanentemente en tiendas, talleres, depósitos y otros lugares de almacenado de mercancías, y en general la carpintería arquitectónica, cuando son elaborados en madera. Se incluye en el código 1630, «Fabricación de partes y piezas de madera, de carpintería y ebanistería para la construcción »; cuando son elaborados en plástico, en el código 2229, «Fabricación de artículos de plástico n.c.p.»; y cuando son elaborados en metal, en el código 2511, «Fabricación de productos metálicos para uso estructural».","La fabricación de lámparas o accesorios para iluminación. Se incluyen en el código 2740, «Fabricación de equipos eléctricos de iluminación».","La fabricación de sillas y asientos utilizados en vehículos automotores; embarcaciones y estructuras flotantes; vagones de ferrocarriles; y aeronaves. Se incluye en el código 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores»; el código 3011, «Construcción de barcos y de estructuras flotantes»; el código 3020, «Fabricación de locomotoras y de material rodante para ferrocarriles»; el código 3030, «Fabricación de aeronaves, naves espaciales y de maquinaria conexa»; respectivamente.","La fabricación de sillones de ruedas para discapacitados, estén o no motorizados. Se incluye en el código 3092, «Fabricación de bicicletas y de sillas de ruedas para personas con discapacidad».","La fabricación de muebles para cirugía, odontología, veterinaria y laboratorio, tales como mesas de operaciones, camillas con mecanismos para el transporte de los enfermos, sillones de odontología con movimientos de inclinación, etc. Se incluye en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","La instalación y acoplamiento de muebles modulares, mamparas de cristal, muebles para cocina y mobiliario para establecimientos comerciales y de laboratorio. Se incluye en el código 4330, «Terminación y acabado de edificios y obras de ingeniería civil».","El re-tapizado, acabado, reparación, restauración de muebles y accesorios domésticos incluidos muebles de oficina y de cuero. Se incluye en el código 9524, «Reparación de muebles y accesorios para el hogar»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["31","Fabricación de muebles, colchones y somieres"],"g":["311","Fabricación de muebles"],"o":""}},{"c":"3120","d":"Fabricación de colchones y somieres","b":true,"m":"El Usuario Industrial con Código CIIU 3120 cuya Actividad Económica Principal es Fabricación de colchones y somieres es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de diferentes tipos de colchones: colchones con muelles, rellenos o guarnecidos interiormente con algún material de soporte, colchones de caucho o plástico celular no recubierto.","La fabricación de somieres.","La fabricación de bases para colchones."],"n":["La fabricación de tendidos, acolchados, edredones, pufs, almohadas, cojines, forros para colchones y similares. Se incluye en el código 1392, «Confección de artículos con materiales textiles, excepto prendas de vestir».","La fabricación de colchones inflables de caucho y colchones para camas de agua en caucho. Se incluye en el código 2219, «Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.».","La fabricación de colchones de material plástico para camas de agua. Se incluye en el código 2229, «Fabricación de artículos de plástico n.c.p.»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["31","Fabricación de muebles, colchones y somieres"],"g":["312","Fabricación de colchones y somieres"],"o":""}},{"c":"3211","d":"Fabricación de joyas y articulos conexos","b":true,"m":"El Usuario Industrial con Código CIIU 3211 cuya Actividad Económica Principal es Fabricación de joyas y articulos conexos es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":[],"n":[],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["32","Otras industrias manufactureras"],"g":["321","Fabricación de joyas y articulos conexos"],"o":""}},{"c":"3212","d":"Fabricación de bisuteria y articulos conexos","b":true,"m":"El Usuario Industrial con Código CIIU 3212 cuya Actividad Económica Principal es Fabricación de bisuteria y articulos conexos es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":[],"n":[],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["32","Otras industrias manufactureras"],"g":["321","Fabricación de joyas y articulos conexos"],"o":""}},{"c":"3220","d":"Fabricación de instrumentos musicales","b":true,"m":"El Usuario Industrial con Código CIIU 3220 cuya Actividad Económica Principal es Fabricación de instrumentos musicales es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de instrumentos de cuerda, incluso los eléctricos y electrónicos.","La fabricación de instrumentos de cuerda provistos o no de teclado, incluso pianos automáticos (pianolas).","La fabricación de órganos de tubo (mecánicos, de cañones, de lengüeta, manuales, callejeros y organillos electrónicos) y de teclado, incluso armonios e instrumentos de teclado similares con lengüetas metálicas libres y otros accesorios de instrumentos musicales como lo son las boquillas, atriles, palillos para tocar batería, entre otros. • La fabricación de acordeones e instrumentos similares, incluso armónicas.","La fabricación de instrumentos de viento, elaborados en metal, madera, caña, entre otros.","La fabricación de instrumentos musicales de percusión tales como tambores, xilófonos, castañuelas, entre otros.","La fabricación de instrumentos musicales cuyo sonido se produce, se amplifica y/o sintetiza electrónicamente.","La fabricación de cajas de música, organillos, órganos de vapor, campanas, pájaros cantores mecánicos, sierras musicales y otros instrumentos no clasificados en otra parte.","La fabricación de silbatos, cornetas y otros instrumentos sonoros de boca para llamado o señalización.","La fabricación de partes, piezas y accesorios de instrumentos, incluidos los metrónomos, los diapasones de percusión y de boca, las tarjetas, los discos y los rollos para instrumentos mecánicos automáticos, entre otros.","La fabricación de estuches, bolsas o cajas para guardar instrumentos musicales."],"n":["La fabricación de artículos de metal para órganos y pianos. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de micrófonos, amplificadores, altavoces, auriculares y artículos similares. Se incluye en el código 2640, «Fabricación de aparatos electrónicos de consumo».","La fabricación de tocadiscos, grabadoras y artículos de la misma índole. Se incluye en el código CIIU 2640, «Fabricación de aparatos electrónicos de consumo».","La fabricación de instrumentos musicales de juguete. Se incluye en el código 3240, «Fabricación de juegos, juguetes y rompecabezas».","La restauración de órganos y otros instrumentos musicales históricos. Se incluye en el código 3319, «Mantenimiento y reparación de otros tipos de equipos y sus componentes n.c.p.».","La producción de grabaciones originales (sonido), tales como cintas, y discos compactos. Se incluye en el código 5920, «Actividades de grabación de sonido y edición de música».","La afinación de pianos. Se incluye en el código 9529, «Mantenimiento y reparación de otros efectos personales y enseres domésticos»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["32","Otras industrias manufactureras"],"g":["322","Fabricación de instrumentos musicales"],"o":""}},{"c":"3230","d":"Fabricación de artículos y equipo para la práctica del deporte","b":true,"m":"El Usuario Industrial con Código CIIU 3230 cuya Actividad Económica Principal es Fabricación de artículos y equipo para la práctica del deporte es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de artículos deportivos y de atletismo (excepto prendas de vestir y calzado), artículos y equipo de cualquier material para la práctica de deportes y juegos al aire libre y bajo techo:","Pelotas de caucho, bolas y balones duros, blandos e inflables (para la práctica de deportes como béisbol, basquetbol, fútbol, golf, tenis, polo y bolos).","Raquetas, bates, mazos, palos de golf, entre otros. – Esquís para la nieve, fijaciones y/o botas, bastones y demás artículos para la práctica del esquí en nieve.","Esquís náuticos, tablas de vela, tablas de surf y demás artículos para la práctica de deportes náuticos.","La fabricación de artículos para la práctica de deportes acuáticos (buceo, natación, entre otros).","La fabricación de artículos para la pesca deportiva: anzuelos, aparejos y arpones, incluso redes de mano (salabres) y sus partes.","La fabricación de artículos para la caza, el alpinismo y otras actividades deportivas.","La fabricación de guantes y gorros de cuero, cascos, cinturones y demás accesorios especiales, incluso artículos de protección (rodilleras, musieras, etcétera), para la práctica de deportes.","La fabricación de patines para hielo y patines de ruedas, incluido el calzado con patines fijos y patinetas.","La fabricación de blancos de arquería y tiro, arcos, ballestas, flechas, incluso blancos para rifles.","La fabricación de equipo para gimnasio (bicicletas estáticas, trotadoras, escaladoras y demás máquinas de ejercicio físico y de atletismo).","La fabricación de artículos para la práctica de pilates, ballet y yoga.","La fabricación de artículos para la práctica de deportes extremos.","La fabricación de artículos para la práctica de deportes nacionales como: tejo, bolo criollo y rana.","La fabricación de los equipos o sets completos para la práctica de los deportes, que incluyan estuches, cestas, bolsas, soportes, bases, redes, carnadas, entre otros."],"n":["La fabricación de velas de barcos. Se incluye en el código 1392, «Confección de artículos con materiales textiles, excepto prendas de vestir».","La fabricación de prendas deportivas como trajes de esquiar, vestidos de baño, entre otros. Se incluye en el código 1410, «Confección de prendas de vestir, excepto prendas de piel».","La fabricación de monturas y arneses. Se incluye en el código 1512, «Fabricación de artículos de viaje, bolsos de mano y artículos similares elaborados en cuero, y fabricación de artículos de talabartería y guarnicionería».","La fabricación de látigos y fustas. Se incluye en el código CIIU 1512, «Fabricación de artículos de viaje, bolsos de mano y artículos similares elaborados en cuero, y fabricación de artículos de talabartería y guarnicionería ».","La fabricación de calzado deportivo o casual y el calzado especializado para la práctica del deporte. Se incluye en el código 1521, «Fabricación de calzado de cuero y piel, con cualquier tipo de suela», y en el código 1522, «Fabricación de otros tipos de calzado de materiales, excepto calzado de cuero y piel», según corresponda.","La fabricación de trajes de buceo de caucho. Se incluye en el código 2219, «Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.».","La fabricación de armas y municiones deportivas. Se incluye en el código 2520, «Fabricación de armas y municiones».","La fabricación de pesas de metal usadas para el levantamiento de pesas. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de equipo automático para juego de bolos (por ejemplo colocadores de bolos). Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","La fabricación de vehículos deportivos que no sean toboganes y similares. Se incluye en las divisiones 29, «Fabricación de vehículos automotores, remolques y semirremolques», y 30, «Fabricación de otros tipos de equipo de transporte».","La fabricación de embarcaciones de deporte. Se incluye en el código 3012, «Construcción de embarcaciones de recreo y deporte».","La fabricación de bicicletas. Se incluye en el código 3092, «Fabricación de bicicletas y de sillas de ruedas para personas con discapacidad».","La fabricación de mesas de billar. Se incluye en el código 3240, «Fabricación de juegos, juguetes y rompecabezas ».","La fabricación de tanques para buceo. Se incluye en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","La fabricación de tapones para los oídos y la nariz (por ejemplo para natación y protección contra ruidos). Se incluye en el código 3290, «Otras industrias manufactureras n.c.p.»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["32","Otras industrias manufactureras"],"g":["323","Fabricación de artículos y equipo para la práctica del deporte"],"o":""}},{"c":"3240","d":"Fabricación de juegos, juguetes y rompecabezas","b":true,"m":"El Usuario Industrial con Código CIIU 3240 cuya Actividad Económica Principal es Fabricación de juegos, juguetes y rompecabezas es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de todo tipo de juguetes, incluso sus partes y accesorios, de cualquier material como madera, cerámica, plástico, caucho, etc.","La fabricación de muñecas, sus partes, piezas y accesorios, y ropa de muñecas.","La fabricación de muñecos, que representan personajes, por ejemplo, animales u otras criaturas provenientes del cine, videojuegos o programas de televisión (figuras de acción), incluso figuras con movimiento (eléctricos o electrónicos).","La fabricación de animales de juguete, incluso muñecos de peluche y de trapo (marionetas).","La fabricación de instrumentos musicales de juguete.","La fabricación de naipes.","La fabricación de juegos de tablero y similares.","La fabricación de juegos electrónicos como ajedrez, y otros.","La fabricación de modelos a escala reducida y modelos recreativos similares, sean o no susceptibles de accionamiento, tales como trenes eléctricos, aeroplanos, buques, sets de construcción, entre otros.","La fabricación de juegos accionados por monedas, mesas de billar, mesas especiales para juegos de casino, entre otros.","La fabricación de artículos para ferias de atracciones, juegos de mesa o de salón.","La fabricación de muebles y equipo doméstico de juguete.","La fabricación de juguetes con ruedas diseñados para ser utilizados como vehículos (automóviles infantiles de pedales, trenes, entre otros), incluso bicicletas y triciclos de plástico.","La fabricación de rompecabezas, pasatiempos, muñecos miniatura de colección y artículos similares.","La fabricación de juguetes tales como canicas, cometas, manualidades, incluso juegos de imitación científicos (microscopios, juegos de química y de ciencias naturales) y similares.","La fabricación de calzado para muñecos.","La fabricación de juegos electrónicos con software incluido (no reemplazable)"],"n":["La fabricación de consolas de videojuego. Se incluye en el código 2640, «Fabricación de aparatos electrónicos de consumo».","La fabricación de tiovivos, columpios y otras atracciones. Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","La fabricación de bicicletas y triciclos para niños que no tengan características de juguete y no estén elaborados de plástico. Se incluye en el código 3092, «Fabricación de bicicletas y de sillas de ruedas para personas con discapacidad».","La fabricación de juegos de chasco o broma, de baratijas u otros artículos de entretenimiento similares. Se incluye en el código 3290, «Otras industrias manufactureras n.c.p.»","La fabricación de artículos de fiesta, carnavales y otros artículos recreativos. Se incluye en el código CIIU 3290, «Otras industrias manufactureras n.c.p.».","La edición en formato electrónico de juegos de computador para cualquier plataforma. Se incluye en el código 5820, «Edición de programas de informática (software)».","La fabricación de equipo automático para juego de bolos (por ejemplo colocadores de bolos). Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","La escritura, modificación, pruebas y suministro de asistencia en relación con programas informáticos. Se incluye en el código 6201, «Actividades de desarrollo de sistemas informáticos (planificación, análisis, diseño, programación, pruebas)»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["32","Otras industrias manufactureras"],"g":["324","Fabricación de juegos, juguetes y rompecabezas"],"o":""}},{"c":"3250","d":"Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)","b":true,"m":"El Usuario Industrial con Código CIIU 3250 cuya Actividad Económica Principal es Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario) es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de aparatos de laboratorio, instrumentos quirúrgicos y médicos, aparatos y suministros quirúrgicos, equipo, material e instrumental odontológico, instrumentos médicos y dentales eléctricos de uso manual, dentaduras postizas y aparatos de ortodoncia, artículos y aparatos ortésicos y protésicos. Se incluye la fabricación de muebles de uso médico y odontológico caracterizados por funciones específicas adicionales.","La fabricación de mantas, almohadillas con esponjas y paños de algodón quirúrgicos, sabanillas e hilos y gasas estériles de uso quirúrgico.","La fabricación de empastes y cementos dentales (excepto pegamento para dentaduras postizas), ceras dentales y otras preparaciones de uso odontológico.","La fabricación de cementos para la reconstrucción de huesos y la fabricación de dientes postizos, puentes, entre otros, hechos por encargo en laboratorios dentales, incluso las amalgamas y las resinas de uso dental; también las articulaciones artificiales y otras partes artificiales del cuerpo humano. Se incluyen las actividades de laboratorios de mecánica dental.","La fabricación de instrumentos de odontología.","La fabricación de hornos para laboratorio dental.","La fabricación de maquinaria de limpieza por ultrasonidos para laboratorio y de esterilizadores medico-quirúrgicos y de laboratorio; también la fabricación de aparatos de destilación y centrifugadoras para laboratorio.","La fabricación de muebles para medicina, cirugía, odontología y veterinaria, caracterizados por funciones específicas adicionales las cuales determinan el propósito del producto, tales como, mesas de operaciones (mesas de reconocimiento para usos clínicos), camillas para examen médico y con mecanismos para el transporte de los enfermos, camas de hospital con dispositivos mecánicos y sillas de odontología con funciones hidráulicas incorporadas.","La fabricación de placas y tornillos para fijar huesos, jeringas, agujas, catéteres, cánulas, entre otros.","La fabricación de aparatos ortésicos y protésicos, incluso bastones y muletas, fajas y bragueros quirúrgicos (para hernias inguinales, y umbilicales), corsés y fajas medico-quirúrgicas, cuyo diseño responde a una función ortésicos determinada; zapatos ortopédicos; férulas y otros artículos y materiales para fracturas.","La fabricación de ojos de cristal o vidrio.","La fabricación de termómetros de uso médico.","La fabricación de productos oftalmológicos, anteojos, lentes de sol, lentes graduados a prescripción, lentes de contacto, y gafas de seguridad o protección.","La fabricación de aparatos para masajes que trabajan generalmente por fricción, vibración, entre otros, incluyendo aquellos de uso doméstico o personal, aparatos de mecanoterapia para el tratamiento de enfermedades de las articulaciones o de los músculos, excepto los que se usan principalmente en gimnasios.","La fabricación de aparatos para pruebas psicotécnicas utilizados por profesionales para determinar, por medio de pruebas, el tiempo de reacción de la inteligencia práctica, la coordinación de los movimientos, y las modalidades de comportamiento psíquico o psicológico de individuos (aviadores, conductores de vehículos, entre otros).","La fabricación de aparatos de ozonoterapia, utilizados para el tratamiento de afecciones de las vías respiratorias.","La fabricación de aparatos de oxigenoterapia y respiración artificial: aparatos mecánicos que actúan por compresión torácica; por inhalación de oxígeno o de una mezcla de oxígeno y anhídrido carbónico mediante máscaras; los aparatos llamados pulmón de acero.","La fabricación de aparatos respiratorios que son utilizados principalmente por los aviadores, los buceadores, los alpinistas o los bomberos. Pueden ser autónomos, es decir, estar alimentados por una botella de oxígeno o de aire comprimido portátil, o estar alimentados por un tubo unido a una fuente de aire comprimido exterior, compresor, depósito, etc., o incluso simplemente unidos a la atmósfera, en determinados aparatos diseñados para alimentarlos a corta distancia."],"n":["La fabricación de pegamento o cemento de dentaduras postizas. Se incluye en el código 2023, «Fabricación de jabones y detergentes, preparados para limpiar y pulir; perfumes y preparados de tocador».","La fabricación de marcapasos y audífonos para personas con pérdida auditiva. Se incluye en el código 2660, «Fabricación de equipo de irradiación y equipo electrónico de uso médico y terapéutico».","La fabricación de guatas, gasas, vendas, apósitos médicos impregnados, entre otros. Se incluye en el código 2100, «Fabricación de productos farmacéuticos, sustancias químicas medicinales y productos botánicos de uso farmacéutico».","La fabricación de instrumentos de análisis de laboratorio y termómetros de otros usos, diferentes al uso médico. Se incluye en el código 2651, «Fabricación de equipo de medición, prueba, navegación y control».","La fabricación de audífonos para radio y computadores. Se incluye en el código 2640, «Fabricación de aparatos electrónicos de consumo».","La fabricación de equipo electrónico de uso médico y terapéutico (radiológico, resonancia magnética, ultrasonido, endoscopia, entre otros). Se incluye en el código 2660, «Fabricación de equipo de irradiación y equipo electrónico de uso médico y terapéutico».","La fabricación de instrumentos ópticos, tales como binoculares, microscopios, telescopios, prismas y lentes no oftalmológicos. Se incluye en el código 2670, «Fabricación de instrumentos ópticos y equipo fotográfico».","La fabricación de sillas de ruedas. Se incluye en el código 3092, «Fabricación de bicicletas y de sillas de ruedas para personas con discapacidad».","La fabricación de bastones comunes y bastones con asiento. Se incluye en el código 3290, «Otras industrias manufactureras n.c.p.».","La fabricación de máscaras antigás que permiten respirar en medios viciados por el polvo, emanaciones tóxicas, humo y vapores. Se incluye en el código CIIU 3290, «Otras industrias manufactureras n.c.p.»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["32","Otras industrias manufactureras"],"g":["325","Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)"],"o":""}},{"c":"3290","d":"Otras industrias manufactureras n.c.p.","b":true,"m":"El Usuario Industrial con Código CIIU 3290 cuya Actividad Económica Principal es Otras industrias manufactureras n.c.p. es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de equipo de protección y de seguridad:","La fabricación de ropa resistente al fuego (ignífuga) y otras prendas de protección que no sean de asbesto.","La fabricación de cinturones de seguridad para instaladores y reparadores de líneas telefónicas y de electricidad y otros cinturones para uso industrial.","La fabricación de flotadores (salvavidas) de corcho.","La fabricación de cascos de plástico endurecido y otro equipo de seguridad personal de plástico.","La fabricación de trajes protectores para bomberos.","La fabricación de cascos de metal y otro equipo de seguridad personal de metal.","La fabricación de tapones para los oídos y la nariz (por ejemplo, para natación y para protección del ruido).","La fabricación de máscaras antigás que permiten respirar en medios viciados por el polvo, emanaciones tóxicas, humo y vapores. Se incluyen las de uso profesional, como aquellas diseñadas para protección en caso de guerra, siempre y cuando el aire respirable proceda directamente del exterior y pase por un órgano filtrante que absorbe los gases nocivos y retiene el polvo.","La fabricación de escobas y cepillos (aspiradoras y otras máquinas con dispositivos rotatorios), incluidos cepillos que forman parte de máquinas, escobillas, barredoras, limpiones, traperos, plumeros mecánicos y manuales, brochas, almohadillas, rodillos para pintar, escurridores, mopas, escobillas de goma, entre otros.","La fabricación de cepillos de dientes, cepillos para calzado y ropa, incluso kits de costura y arreglo de calcetería.","La fabricación de plumines (puntas de bolígrafos), estilógrafos, rapidógrafos, bolígrafos, lápices, portaminas, minas para lápices, colores, crayones, tiza, marcadores con punta de fieltro y punta suave, sus partes y sus estuches, entre otros, sean o no mecánicos; incluso la fabricación de pinceles, rodillos y artículos similares.","La fabricación de sellos para fechar (sellos de caucho, metálicos y de otros materiales), cerrar o numerar, aparatos manuales para imprimir y estampar membretes en relieve, y aparatos de impresión manual.","La fabricación de cintas con tinta para máquinas de escribir, impresoras de computadora, cajas registradoras, entre otras, y almohadillas de tinta para sellos.","La fabricación de globos terráqueos.","La fabricación de paraguas, sombrillas de jardín o de playa y sus partes, bastones comunes y bastones con asiento (excepto los ortopédicos).","La fabricación de botones (incluso sus moldes), broches de presión, botones de presión y cierres de cremallera que no sean de metales preciosos ni de piedras preciosas y semipreciosas.","La fabricación de encendedores y mecheros mecánicos o no, eléctricos y/o químicos.","La fabricación de artículos de uso personal como pipas, vaporizadores de perfumes, termos y otros recipientes herméticos para uso personal o doméstico. Artículos confeccionados con cabello (pelucas, extensiones, barbas, cejas postizas, entre otros).","La fabricación de velas, cirios y artículos similares; artículos de plumas o plumones.","La fabricación de arreglos con flores artificiales como: ramos, coronas y canastas, y la fabricación de flores, frutas y plantas artificiales.","La fabricación de artículos de broma y de fantasía; cedazos y cribas manuales; maniquíes de sastre, ataúdes metálicos o de madera y otros artículos no clasificados en otra parte.","Las actividades de taxidermia (disecado de animales).","La fabricación de caminadores y cunas portátiles o portabebés.","La fabricación de árboles de navidad artificiales y sus adornos (excepto adornos de vidrio y eléctricos).","La fabricación de distintivos de la Cruz Roja, bomberos, sindicatos e insignias militares metálicas, que no sean de metales preciosos ni de metales comunes revestidos con metales preciosos.","La fabricación de artículos de fiestas y de carnavales como disfraces y accesorios, y otros artículos recreativos."],"n":["La fabricación de emblemas o insignias militares de metales preciosos o de metales comunes revestidos con metales preciosos. Se incluye en el código 3210 «Fabricación de joyas, bisutería y artículos conexos».","La fabricación de mechas para encendedores. Se incluye en el código 1399 «Fabricación de otros artículos textiles n.c.p.».","La fabricación de ropa de trabajo y servicio (por ejemplo batas de laboratorio, overoles de trabajo, uniformes). Se incluye en el código 1410 «Confección de prendas de vestir, excepto prendas de piel».","La fabricación de látigos y fustas. Se incluye en el código 1512 «Fabricación de artículos de viaje, bolsos de mano y artículos similares elaborados en cuero, y fabricación de artículos de talabartería y guarnicionería».","La fabricación de artículos de papel. Se incluye en el código 1709 «Fabricación de otros artículos de papel y cartón».","La fabricación de fósforos. Se incluye en el código 2029 «Fabricación de otros productos químicos n.c.p.».","La fabricación de linóleo y otros materiales duros para revestir pisos. Se incluye en el código 2229 «Fabricación de artículos de plástico n.c.p.».","La fabricación de artículos de plástico. Se incluye en el código CIIU 2229 «Fabricación de artículos de plástico n.c.p.».","La fabricación de carruseles (tiovivos), columpios, barracas de tiro al blanco y otros juegos de feria. Se incluye en el código 2829 «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","La fabricación de coches en cualquier material para bebés. Se incluye en el código 3092 «Fabricación de bicicletas y de sillas de ruedas para personas con discapacidad».","La fabricación de bastones ortopédicos. Se incluye en el código 3250 «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["32","Otras industrias manufactureras"],"g":["329","Otras industrias manufactureras n.c.p."],"o":""}},{"c":"3311","d":"Mantenimiento y reparación especializado de productos elaborados en metal","b":true,"m":"El Usuario Industrial con Código CIIU 3311 cuya Actividad Económica Principal es Mantenimiento y reparación especializado de productos elaborados en metal es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["El mantenimiento y reparación especializado (incluso soldadura), realizado a cambio de una retribución o por contrata, de: tanques, tambores de acero, depósitos y envases metálicos; recipientes de metal para gases comprimidos; tubos y tuberías; recipientes especiales para transporte de líquidos y gases; contenedores para transporte multimodal; calderas de agua caliente y de otros generadores de vapor; partes de calderas de potencia de embarcaciones; equipos auxiliares que funcionan con conjuntos de aparatos para generar vapor (generadores de vapor); condensadores, ahorradores, recalentadores, colectores y acumuladores de vapor; reactores nucleares, excepto separadores de isótopo; reparación y mantenimiento de placas (platework) de calderas de calefacción central y radiadores; herramientas mecánicas simples de medición elaboradas en metal, reparación y mantenimiento de armas de fuego (incluso reparación de armas deportivas y recreacionales)."],"n":["La reparación y mantenimiento no especializado de sistemas de calefacción central. Se incluye en el código 4322, «Instalaciones de fontanería, calefacción y aire acondicionado».","El servicio de cerrajería o sistemas mecánicos de cierre. Se incluye en el código 8020, «Actividades de servicios de sistemas de seguridad».","Las actividades de mantenimiento y reparación especializado de productos elaborados en metal, efectuados como un servicio conexo, por una unidad económica que se dedica principalmente a la fabricación o al comercio al por mayor o al por menor de los mismos. Se incluyen dentro de la actividad económica principal desarrollada por dicha unidad."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["33","Instalación, mantenimiento y reparación especializado de maquinaria y equipo"],"g":["331","Mantenimiento y reparación especializado de productos elaborados en metal y de maquinaria y equipo"],"o":""}},{"c":"3312","d":"Mantenimiento y reparación especializado de maquinaria y equipo","b":true,"m":"El Usuario Industrial con Código CIIU 3312 cuya Actividad Económica Principal es Mantenimiento y reparación especializado de maquinaria y equipo es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["Maquinaria y equipo de uso industrial o comercial; maquinaria con cuchillas y sierras (incluido el afilado e instalación de las cuchillas y sierras)","Motores (excepto los de los vehículos automotores, ejemplo: motores de buques o locomotoras)","Turbinas para la generación de energía y calor, bombas y equipo hidráulico o conexo de propulsión de fluidos","Reparación y mantenimiento de válvulas, compresores y grifos","Cojinetes, engranajes, trenes de engranajes y elementos de transmisión","Equipo de elevación y manipulación de uso industrial","Hornos de procesamiento industrial","Equipo de refrigeración y de purificación de aire","Maquinaria de uso general; herramientas de mano con motor incorporado","Máquinas herramienta y accesorios para cortar y formar metales; otras máquinas herramienta; hornos, hogares y quemadores industriales; tractores agrícolas; maquinaria agrícola, silvícola y para la explotación y tratamiento de la madera","Maquinaria para la metalurgia; maquinaria para la minería, la construcción y para los campos petrolíferos y de gas","Maquinaria procesadora de alimentos, bebidas y tabaco; maquinaria para la producción de textiles, cuero y confecciones","Maquinaria para la elaboración de papel y cartón","Maquinaria para otros usos especiales (por ejemplo máquinas para procesamiento de caucho o de plástico); equipo de básculas; máquinas expendedoras, (por ejemplo: de mercancías, de alimentos, etc.); cajas registradoras","Máquinas fotocopiadoras; calculadoras, electrónicas o no; máquinas de escribir","Máquinas no eléctricas para soldadura, equipo de calefacción eléctrica, de montaje permanente, para ambientes y piscinas (no portátil), entre otros.","El mantenimiento y reparación de equipo de elevación y manipulación de materiales, entre otros."],"n":["La instalación especializada de maquinaria y equipo industrial. Se incluye en el código 3320, «Instalación especializada de maquinaria y equipo industrial».","El mantenimiento y reparación de máquinas eléctricas para soldadura. Se incluye en el código 3314, «Mantenimiento y reparación especializado de equipo eléctrico».","El mantenimiento y reparación de máquinas de limpieza ultrasónica (excepto de laboratorio y dentales). Se incluye en el código CIIU 3314, «Mantenimiento y reparación especializado de equipo eléctrico».","La instalación de calderas y otros sistemas de calefacción y de aire acondicionado. Se incluye en el código 4322, «Instalaciones de fontanería, calefacción y aire acondicionado».","La instalación, mantenimiento y reparación de escaleras y ascensores. Se incluye en el código 4329, «Otras instalaciones especializadas».","Las actividades de reparación y mantenimiento especializado de maquinaria y equipo efectuados, como un servicio conexo, por una unidad económica que se dedica principalmente a la fabricación o al comercio al por mayor o al por menor de los mismos. Se incluyen dentro de la actividad económica principal desarrollada por dicha unidad.","La reconstrucción o re-fabricación de maquinaria y equipo. Se incluye en la clase correspondiente a la fabricación de la maquinaria y el equipo objeto de reconstrucción o re-fabricación."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["33","Instalación, mantenimiento y reparación especializado de maquinaria y equipo"],"g":["331","Mantenimiento y reparación especializado de productos elaborados en metal y de maquinaria y equipo"],"o":""}},{"c":"3313","d":"Mantenimiento y reparación especializado de equipo electrónico y óptico","b":true,"m":"El Usuario Industrial con Código CIIU 3313 cuya Actividad Económica Principal es Mantenimiento y reparación especializado de equipo electrónico y óptico es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["El mantenimiento, reparación y calibración especializado, realizado a cambio de una retribución o por contrata, de: equipos de medición, ensayo y control; aparatos de control del tiempo y contadores de tiempo, instrumentos de aeronaves; equipo de prueba de emisiones de automotores; instrumentos meteorológicos; equipos de inspección y ensayo de propiedades físicas, eléctricas y químicas; equipos de investigación; instrumentos de monitoreo y detección de radiación; instrumentos de prospección.","Esta clase también incluye el mantenimiento y reparación especializado, realizado a cambio de una retribución o por contrata, de: equipos de irradiación, electro médico y electro terapéutico; equipo de resonancia magnética de imágenes; equipo médico de ultrasonido; marcapasos y equipos de electrocardiografía; audífonos para personas con alteración auditiva; equipos electro médicos de endoscopia; aparatos de irradiación; instrumentos y equipos ópticos, tales como: binoculares, microscopios (excepto de electrones o protones), telescopios, prismas y lentes (excepto oftalmológicos) y equipo fotográfico."],"n":["La reparación de máquinas fotocopiadoras. Se incluye en el código 3312, «Mantenimiento y reparación especializado de maquinaria y equipo».","El mantenimiento y reparación de computadores, equipos periféricos y proyectores para computador. Se incluye en el código 9511, «Mantenimiento y reparación de computadores y de equipo periférico».","El mantenimiento y reparación de equipos de comunicación, cámaras de televisión y video de uso comercial. Se incluye en el código 9512, «Mantenimiento y reparación de equipos de comunicación».","La reparación de cámaras de video y cámaras digitales de uso doméstico. Se incluye en el código 9521, «Mantenimiento y reparación de aparatos electrónicos de consumo».","La reparación de relojes. Se incluye en el código 9529, «Mantenimiento y reparación de otros efectos personales y enseres domésticos»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["33","Instalación, mantenimiento y reparación especializado de maquinaria y equipo"],"g":["331","Mantenimiento y reparación especializado de productos elaborados en metal y de maquinaria y equipo"],"o":""}},{"c":"3314","d":"Mantenimiento y reparación especializado de equipo eléctrico","b":true,"m":"El Usuario Industrial con Código CIIU 3314 cuya Actividad Económica Principal es Mantenimiento y reparación especializado de equipo eléctrico es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["El mantenimiento y reparación de productos de la división 27, «Fabricación de aparatos y equipo eléctrico », excepto la reparación y mantenimiento de aquellos clasificados en la clase 2750, «Fabricación de aparatos de uso doméstico».","El mantenimiento y reparación especializado, realizado a cambio de una retribución o por contrata, de transformadores eléctricos de energía, equipos de distribución, transmisión y control de energía; motores y generadores eléctricos (incluso para motores); interruptores, aparatos y paneles de control de encendido; relés y controles industriales; baterías no recargables (primarias) y de almacenamiento eléctrico; equipos eléctricos de iluminación; dispositivos transportadores y no transportadores de corriente para circuitos eléctricos cableados, máquinas eléctricas para soldadura, de máquinas de limpieza ultrasónica (excepto de laboratorio y dentales), cables de fibra óptica para la transmisión de imágenes en directo, dispositivos y aparatos de conmutación."],"n":["El mantenimiento y reparación de equipo de computadores y equipo periférico. Se incluye en el código 9511, «Mantenimiento y reparación de computadores y de equipo periférico».","El mantenimiento y reparación de equipo de telecomunicaciones, cámaras de televisión y video. Se incluye en el código 9512, «Mantenimiento y reparación de equipos de comunicación».","El mantenimiento y reparación de productos electrónicos de consumo. Se incluye en el código 9521, «Mantenimiento y reparación de aparatos electrónicos de consumo».","La reparación de relojes. Se incluye en el código 9529, «Mantenimiento y reparación de otros efectos personales y enseres domésticos».","Las actividades de mantenimiento y reparación especializado de equipo eléctrico (excepto los electrodomésticos) efectuados, como un servicio conexo, por una unidad económica que se dedica principalmente a la fabricación o al comercio al por mayor o al por menor de los mismos. Se incluyen dentro de la actividad económica principal desarrollada por dicha unidad."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["33","Instalación, mantenimiento y reparación especializado de maquinaria y equipo"],"g":["331","Mantenimiento y reparación especializado de productos elaborados en metal y de maquinaria y equipo"],"o":""}},{"c":"3315","d":"Mantenimiento y reparación especializado de equipo de transporte, excepto los vehículos automotores, motocicletas y bicicletas","b":true,"m":"El Usuario Industrial con Código CIIU 3315 cuya Actividad Económica Principal es Mantenimiento y reparación especializado de equipo de transporte, excepto los vehículos automotores, motocicletas y bicicletas es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["El mantenimiento y reparación de equipo de transporte del incluido en la división 30, «Fabricación de otros tipos de equipo de transporte», exceptuando motocicletas y bicicletas. Sin embargo la reconstrucción o re-manufactura realizada en fábrica de barcos, locomotoras, vagones de ferrocarril y aeronaves se clasifica en la división 30, «Fabricación de otros tipos de equipo de transporte».","El mantenimiento y reparación especializado, realizado a cambio de una retribución o por contrato, de: buques, embarcaciones de recreo, aeronaves, locomotoras y vagones ferroviarios (excepto la reconstrucción o conversión realizada en fábrica). El mantenimiento y reparación especializado de motores de naves y aeronaves y de coches de vehículos de tracción animal.","Las actividades de mantenimiento y reparación especializado de equipo de transporte (excepto vehículos automotores, motocicletas y bicicletas) efectuados, como un servicio conexo, por una unidad económica que se dedica principalmente a la fabricación o al comercio al por mayor o al por menor de los mismos. Se incluyen dentro de la actividad económica principal desarrollada por dicha unidad."],"n":["La reconstrucción en fábrica de buques. Se incluye en el código 3011, «Construcción de barcos y de estructuras flotantes».","La reconstrucción en fábrica de embarcaciones de recreo y deportes. Se incluye en el código 3012, «Construcción de embarcaciones de recreo y de deporte».","La reconstrucción en fábrica de locomotoras y vagones de ferrocarril. Se incluye en el código 3020, «Fabricación de locomotoras y de material rodante para ferrocarriles».","La reconstrucción en fábrica de aeronaves. Se incluye en el código 3030, «Fabricación de aeronaves, naves espaciales y de maquinaria conexa».","Las actividades de desmantelamiento o desguace de naves, locomotoras, automóviles, computadoras, televisores y demás equipo. Se incluye en el código 3830, «Recuperación de materiales».","El mantenimiento y reparación de vehículos automotores. Se incluye en el código 4520, «Mantenimiento y reparación de vehículos automotores».","El mantenimiento y reparación de motocicletas. Se incluye en el código 4542, «Mantenimiento y reparación de motocicletas y de sus partes y piezas».","La reparación de bicicletas. Se incluye en el código 9529, «Mantenimiento y reparación de otros efectos personales y enseres domésticos»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["33","Instalación, mantenimiento y reparación especializado de maquinaria y equipo"],"g":["331","Mantenimiento y reparación especializado de productos elaborados en metal y de maquinaria y equipo"],"o":""}},{"c":"3319","d":"Mantenimiento y reparación de otros tipos de equipos y sus componentes n.c.p.","b":true,"m":"El Usuario Industrial con Código CIIU 3319 cuya Actividad Económica Principal es Mantenimiento y reparación de otros tipos de equipos y sus componentes n.c.p. es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["El mantenimiento y reparación especializado, realizado a cambio de una retribución o por contrato, de maquinaria y equipo no cubierto en los otros grupos que conforman la división 33, tales como: reparación de mallas de pescar; cuerdas, aparejos náuticos, eslingas, tiendas, carpas y lonas; bolsas de almacenamiento de fertilizantes y químicos (bolsas de polietileno plegado de tres capas que cuentan con estabilización ultravioleta, tienen un diámetro de 5 a 6 pies y una longitud de 60 a 75 metros); reparación o reacondicionamiento de estibas de madera, barriles de transporte y artículos similares; reparación de máquinas operadas con monedas (dispensadores, juegos electrónicos, tragamonedas y similares), restauración de instrumentos musicales antiguos (órganos, clavicordios, etc.), reparación de esterilizadores y de equipos de destilación del tipo usado en laboratorios, entre otros."],"n":["La reparación y restauración de muebles domésticos y de oficina. Se incluye en el código 9524, «Reparación de muebles y accesorios para el hogar».","La reparación de bicicletas. Se incluye en el código 9529, «Mantenimiento y reparación de otros efectos personales y enseres domésticos».","La reparación y modificación de ropa. Se incluye en el código 9529, «Mantenimiento y reparación de otros efectos personales y enseres domésticos»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["33","Instalación, mantenimiento y reparación especializado de maquinaria y equipo"],"g":["331","Mantenimiento y reparación especializado de productos elaborados en metal y de maquinaria y equipo"],"o":""}},{"c":"3320","d":"Instalación especializada de maquinaria y equipo industrial","b":true,"m":"El Usuario Industrial con Código CIIU 3320 cuya Actividad Económica Principal es Instalación especializada de maquinaria y equipo industrial es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La instalación especializada, realizada a cambio de una retribución o por contrata de: maquinaria y equipo industrial, maquinaria agropecuaria y forestal; maquinaria para la minería y la construcción, maquinaria de uso general; máquinas formadoras de metal y de máquinas herramienta; maquinaria y equipo para la elaboración de alimentos, bebidas y tabaco; maquinaria y equipo para la elaboración de productos textiles, prendas de vestir y cueros; bombas para máquinas de tipo industrial, equipo de control de procesos industriales, equipo de comunicaciones, mainframes (computadoras centrales) y similares, equipo de irradiación y electro médico, máquinas de aparejos, instalación de equipo de bolos, motores para uso industrial, motores para buques o locomotoras, y turbinas para la generación de energía y calor, equipos de potencia hidráulica y neumática, hornos, hogares y quemadores industriales, equipo de elevación y manipulación de uso industrial; maquinaria de oficina y contabilidad (diferente de los computadores y equipo periférico). Se incluye igualmente aquí, el desmantelado o desguace a gran escala de maquinaria y equipo industrial, las actividades de mecánicos instaladores y el montaje de máquinas."],"n":["La fabricación de armas y municiones. Se incluye en el código 2520, «Fabricación de armas y municiones ».","La fabricación de buques de guerra. Se incluye en el código 3011, «Construcción de barcos y de estructuras flotantes».","La fabricación de aviones de combate. Se incluye en el código 3030, «Fabricación de aeronaves, naves espaciales y de maquinaria conexa»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["33","Instalación, mantenimiento y reparación especializado de maquinaria y equipo"],"g":["332","Instalación especializada de maquinaria y equipo industrial"],"o":""}},{"c":"3511","d":"Generación de energía eléctrica","b":true,"m":"El Usuario Industrial con Código CIIU 3511 cuya Actividad Económica Principal es Generación de energía eléctrica es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La actividad de personas naturales o jurídicas que producen energía eléctrica y tienen por lo menos una planta y/o unidad de generación conectada al Sistema Interconectado Nacional, bien sea que desarrollen esa actividad en forma exclusiva o en forma combinada con otra u otras actividades del sector eléctrico, cualquiera de ellas sea la actividad principal.","La gestión de las instalaciones de generación de energía eléctrica, ya sean térmicas, hidroeléctricas, de turbina de gas, de Diesel y de energías renovables (obtenidas de fuentes naturales virtualmente inagotables, unas por la inmensa cantidad de energía que contienen, y otras porque son capaces de regenerarse por medios naturales, ejemplo: la energía eólica, solar, etc.).","La cogeneración que consiste en el proceso de producción combinada de energía eléctrica y energía térmica, que hace parte integrante de una actividad productiva, destinadas ambas al consumo propio o de terceros y destinadas a procesos industriales o comerciales."],"n":["La generación de electricidad mediante la incineración de desechos. Se incluye en el código 3821, «Tratamiento y disposición de desechos no peligrosos»."],"r":"NO","h":"SI","k":{"s":["Sección D","SUMINISTRO DE ELECTRICIDAD, GAS, VAPOR Y AIRE ACONDICIONADO"],"v":["35","Suministro de electricidad, gas, vapor y aire acondicionado"],"g":["351","Generación, transmisión, distribución y comercialización de energía eléctrica"],"o":""}},{"c":"3512","d":"Transmisión de energía eléctrica","b":true,"m":"El Usuario Industrial con Código CIIU 3512 cuya Actividad Económica Principal es Transmisión de energía eléctrica es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La actividad que consisten en el transporte de energía por sistemas de transmisión y la operación, mantenimiento y expansión de sistemas de transmisión, ya sean nacionales o regionales.","La gestión de los sistemas de transmisión que conducen la energía desde las instalaciones de generación hasta el sistema de distribución. La transmisión se realiza mediante cables soportados por torres metálicas o postes que transportan electricidad a tensiones mayores o iguales a 220 KV."],"n":["N/A"],"r":"NO","h":"SI","k":{"s":["Sección D","SUMINISTRO DE ELECTRICIDAD, GAS, VAPOR Y AIRE ACONDICIONADO"],"v":["35","Suministro de electricidad, gas, vapor y aire acondicionado"],"g":["351","Generación, transmisión, distribución y comercialización de energía eléctrica"],"o":""}},{"c":"3513","d":"Distribución de energía eléctrica","b":true,"m":"El Usuario Industrial con Código CIIU 3513 cuya Actividad Económica Principal es Distribución de energía eléctrica es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La actividad de transportar energía eléctrica a través de una red a voltajes inferiores a 220 kv, bien sea que esa actividad se desarrolle en forma exclusiva o combinada con otras actividades del sector eléctrico, cualquiera de ellas sea la actividad principal.","La gestión de los sistemas de distribución (integrados por líneas, postes, contadores, transformadores, cables e instalaciones eléctricas) que transportan la energía eléctrica recibida de la central eléctrica o del sistema de transmisión hasta el consumidor."],"n":["N/A"],"r":"NO","h":"SI","k":{"s":["Sección D","SUMINISTRO DE ELECTRICIDAD, GAS, VAPOR Y AIRE ACONDICIONADO"],"v":["35","Suministro de electricidad, gas, vapor y aire acondicionado"],"g":["351","Generación, transmisión, distribución y comercialización de energía eléctrica"],"o":""}},{"c":"3514","d":"Comercialización de energía eléctrica","b":true,"m":"El Usuario Industrial con Código CIIU 3514 cuya Actividad Económica Principal es Comercialización de energía eléctrica es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La actividad que consiste en la compra de energía eléctrica en el mercado mayorista y su venta a los usuarios finales, regulados o no regulados. Quien desarrolla esta actividad se denomina comercializador de energía eléctrica.","La comercialización de la energía eléctrica comprende actividades como: realizar el contrato de conexión a la red de distribución, efectuar la lectura de los medidores, facturación del servicio; recaudación del pago del servicio; atención al cliente (reclamos por calidad del servicio y por la atención comercial)."],"n":["N/A"],"r":"NO","h":"SI","k":{"s":["Sección D","SUMINISTRO DE ELECTRICIDAD, GAS, VAPOR Y AIRE ACONDICIONADO"],"v":["35","Suministro de electricidad, gas, vapor y aire acondicionado"],"g":["351","Generación, transmisión, distribución y comercialización de energía eléctrica"],"o":""}},{"c":"3520","d":"Producción de gas; distribución de combustibles gaseosos por tuberías","b":true,"m":"El Usuario Industrial con Código CIIU 3520 cuya Actividad Económica Principal es Producción de gas; distribución de combustibles gaseosos por tuberías es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La producción de gas y la distribución de gas natural o sintético a los consumidores por un sistema de tuberías. Se incluyen las actividades de los agentes o corredores de gas que venden gas natural a través de sistemas de distribución explotados por otros.","La producción de gases no convencionales como las mezclas de gas de composición análoga a la del gas de hulla, utilizadas indistintamente en calefacción o alumbrado y para síntesis de productos químicos, tales como el metanol y el amoníaco. En este último caso se suele denominar «gas de síntesis».","La distribución de combustibles gaseosos por sistemas de tuberías desde la estación de salida hasta usuarios residenciales, industriales y comerciales.","Las actividades de agentes que venden gas a través de sistemas de distribución que operan terceros.","La producción de gas para su suministro mediante la destilación del carbón a partir de subproductos de la agricultura o a partir de desechos.","Las actividades de bolsas de productos básicos y mercados de capacidad de transporte para combustibles gaseosos."],"n":["La operación por separado de tuberías de gas, típicamente efectuada sobre largas distancias, conectando productores con distribuidores de gas, o entre centros urbanos. Se incluye en el código 4930, «Transporte por tuberías».","La producción de GLP o gas propano y otros gases de la refinación del petróleo. Se incluye en el código 1921, «Fabricación de productos de la refinación del petróleo».","La fabricación de gases industriales (los hidrocarburos gaseosos en bruto, por ejemplo: gases procedentes del tratamiento de aceites crudos del petróleo, el metano y el propano incluso puros, entre otros). Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La distribución de combustibles gaseosos por tanques y bombonas (pipetas), cuando se efectúa al por mayor. Se incluye en el código 4661, «Comercio al por mayor de combustibles sólidos, líquidos, gaseosos y productos conexos».","La distribución de gas en bombonas o pipetas para uso doméstico, cuando se efectúa al por menor. Se incluye en el código 4759, «Comercio al por menor de otros artículos domésticos en establecimientos especializados».","El transporte, el cual consiste en la operación del sistema troncal de transporte de gas combustible por tuberías, su administración, mantenimiento y expansión. Incluye actividades relacionadas como el almacenamiento, la compresión y la medición, las cuales pueden ser desarrolladas por el transportador o realizadas de manera independiente por una persona natural o jurídica; los sistemas de transporte de gas natural y de GLP son independientes. Se incluyen en el código 4930, «Transporte por tuberías».","El comercio al por mayor de combustibles gaseosos realizado a cambio de una retribución o por contrata. Se incluye en el código 4610 «Comercio al por mayor a cambio de una retribución o por contrata»."],"r":"NO","h":"SI","k":{"s":["Sección D","SUMINISTRO DE ELECTRICIDAD, GAS, VAPOR Y AIRE ACONDICIONADO"],"v":["35","Suministro de electricidad, gas, vapor y aire acondicionado"],"g":["352","Producción de gas; distribución de combustibles gaseosos por tuberías"],"o":""}},{"c":"3530","d":"Suministro de vapor y aire acondicionado","b":true,"m":"El Usuario Industrial con Código CIIU 3530 cuya Actividad Económica Principal es Suministro de vapor y aire acondicionado es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La producción, la captación y la distribución de vapor y agua caliente para calefacción, producción de energía y otros usos.","La producción y distribución de aire frío.","La generación y distribución de agua fría para enfriamiento."],"n":["La producción de hielo. Se incluye en el código 1104 «Elaboración de bebidas no alcohólicas, producción de aguas minerales y otras aguas embotelladas».","La producción de hielo seco (gas carbónico). Se incluye en el código 2011 «Fabricación de sustancias y productos químicos básicos»."],"r":"SI","h":"SI","k":{"s":["Sección D","SUMINISTRO DE ELECTRICIDAD, GAS, VAPOR Y AIRE ACONDICIONADO"],"v":["35","Suministro de electricidad, gas, vapor y aire acondicionado"],"g":["353","Suministro de vapor y aire acondicionado"],"o":""}},{"c":"3600","d":"Captación, tratamiento y distribución de agua","b":true,"m":"El Usuario Industrial con Código CIIU 3600 cuya Actividad Económica Principal es Captación, tratamiento y distribución de agua es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La operación de canales de irrigación; sin embargo, no están incluidos los servicios de riesgo a través de aspersores ni servicios similares de apoyo para la agricultura.","La captación, el tratamiento y la distribución de agua para uso doméstico e industrial. La captación de agua de varias fuentes, así como también su distribución por diversos medios.","La captación de agua de ríos, lagos, pozos, etc.","La captación de agua lluvia.","La potabilización   if (Math.abs(a.length - b.length) > 1) return false;

function search(qraw) {

  }

  if (/^\d+$/.test(digits)) {
    let list = DATA.filter(r => r.c.startsWith(digits) || (digits.length <= 4 && r.c === digits.padStart(4, '0')))

    if (inD) src.push('Descripción'); if (inP) src.push('Aplica para'); if (inN) src.push('No aplica para');
