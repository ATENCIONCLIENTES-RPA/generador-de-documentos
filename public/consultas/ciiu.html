incluye en el código CIIU 2100, «Fabricación de productos farmacéuticos, sustancias químicas medicinales y productos botánicos de uso farmacéutico ».","La producción de alúmina (óxido de aluminio o alúmina calcinada). Se incluye en el código 2429, «Industrias básicas de otros metales no ferrosos»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["20","Fabricación de sustancias y productos químicos"],"g":["201","Fabricación de sustancias químicas básicas, abonos y compuestos inorgánicos nitrogenados, plásticos y caucho sintético en formas primarias"],"o":""}},{"c":"2012","d":"Fabricación de abonos y compuestos inorgánicos nitrogenados","b":true,"m":"El Usuario Industrial con Código CIIU 2012 cuya Actividad Económica Principal es Fabricación de abonos y compuestos inorgánicos nitrogenados es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La producción de abonos puros mezclados o compuestos: nitrogenados, fosfáticos y potásicos, elaborados mediante mezcla de minerales, sales y productos químicos inorgánicos como los fosfatos (triamónico, de hierro, de magnesio).","La producción de compuestos inorgánicos nitrogenados como el amoníaco y derivados como cloruro de amonio, sulfatos y carbonatos de amonio; ácido nítrico y sulfonítrico y sus sales como los nitratos y nitritos de potasio.","La urea, fosfatos naturales crudos y sales de potasio naturales crudas.","La fabricación de otros productos utilizados como fertilizantes; por ejemplo, los superfosfatos.","La fabricación de sustratos hechos principalmente de turba.","La fabricación de sustratos hechos de mezclas de tierra natural, arena, arcilla y minerales."],"n":["La recolección de guano. Se incluye en el código 0891, «Extracción de minerales para la fabricación de abonos y productos químicos».","La fabricación de sustancias químicas orgánicas nitrogenadas como aminas, amidas y nitrilos. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de pesticidas, herbicidas y otras sustancias agroquímicas. Se incluye en el código 2021, «Fabricación de plaguicidas y otros productos químicos de uso agropecuario».","La operación de vertederos de compost. Se incluye en el código 3821, «Tratamiento y disposición de desechos no peligrosos»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["20","Fabricación de sustancias y productos químicos"],"g":["201","Fabricación de sustancias químicas básicas, abonos y compuestos inorgánicos nitrogenados, plásticos y caucho sintético en formas primarias"],"o":""}},{"c":"2013","d":"Fabricación de plásticos en formas primarias","b":true,"m":"El Usuario Industrial con Código CIIU 2013 cuya Actividad Económica Principal es Fabricación de plásticos en formas primarias es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de polímeros de etileno, propileno, estireno; policloruro de vinilo (PVC), el teflón (politetrafluoruro de etileno); poliacetatos de vinilo, resinas acrílicas obtenidas del ácido acrílico y sus derivados como el acrilato de metilo.","La fabricación de poliacetales, resinas alquídicas, resina de poliésteres y poliéteres, resinas epóxicas, policarbonatos, poliamidas, amino-resinas, resinas fenólicas (baquelita), resinas urea-formol, poliuretanos, politerpenos sintéticos y siliconas.","La fabricación de resinas de intercambio iónico a base de polímeros.","La fabricación de celulosa y sus derivados químicos como nitrocelulosa, acetato de celulosa, carboximetilcelulosa, etc."],"n":["La fabricación de monómeros tales como etileno, propileno, estireno, butadieno, isopreno, etc. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de fibras, filamentos e hilos artificiales o sintéticos. Se incluye en el código 2030, «Fabricación de fibras sintéticas y artificiales».","La producción de formas básicas de plástico. Se incluye en el código 2221, «Fabricación de formas básicas de plástico».","La manufactura de productos de plástico. Se incluye en el código 2229, «Fabricación de artículos de plástico n.c.p.».","La trituración de productos plásticos. Se incluye en el código 3830, «Recuperación de materiales»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["20","Fabricación de sustancias y productos químicos"],"g":["201","Fabricación de sustancias químicas básicas, abonos y compuestos inorgánicos nitrogenados, plásticos y caucho sintético en formas primarias"],"o":""}},{"c":"2014","d":"Fabricación de caucho sintético en formas primarias","b":true,"m":"El Usuario Industrial con Código CIIU 2014 cuya Actividad Económica Principal es Fabricación de caucho sintético en formas primarias es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de cauchos sintéticos en formas primarias como neopreno, SBR (butadieno-estireno), polibutadieno, EPDM (etileno-propileno-dieno).","La producción de caucho sintético o gomas sintéticas a partir de aceite vegetal, en formas primarias como el facticio.","La obtención de productos por mezclado de caucho sintético y caucho natural en formas primarias (por ejemplo, balata)."],"n":["La fabricación de monómeros puros o mezclados utilizados en la obtención de cauchos sintéticos como estireno, caprolactama, acrilonitrilo, butadieno, isopreno, etc. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de las fibras artificiales, filamentos e hilos artificiales y sintéticos. Se incluye en el código 2030, «Fabricación de fibras sintéticas y artificiales».","La fabricación de llantas, neumáticos y bandas de rodamiento en caucho. Se incluye en el código 2211, «Fabricación de llantas y neumáticos de caucho».","La manufactura de productos de caucho. Se incluye en el código 2219, «Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.».","La trituración de productos de caucho. Se incluye en el Código 3830, «Recuperación de materiales»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["20","Fabricación de sustancias y productos químicos"],"g":["201","Fabricación de sustancias químicas básicas, abonos y compuestos inorgánicos nitrogenados, plásticos y caucho sintético en formas primarias"],"o":""}},{"c":"2021","d":"Fabricación de plaguicidas y otros productos químicos de uso agropecuario","b":true,"m":"El Usuario Industrial con Código CIIU 2021 cuya Actividad Económica Principal es Fabricación de plaguicidas y otros productos químicos de uso agropecuario es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La preparación de insecticidas, raticidas, fungicidas, herbicidas, productos anti-germinación de plantas y reguladores del crecimiento y demás productos agroquímicos n.c.p..","La fabricación de desinfectantes para uso agropecuario.","La fabricación de desinfectantes para el hogar, la industria y otros usos.","La producción de insecticidas biológicos o bio-insecticidas, cultivos artificiales de microorganismos para mejoramiento de cultivos agrícolas."],"n":["La fabricación de sustancias básicas químicamente definidas, utilizadas en la preparación de los productos característicos de plaguicidas y otros productos químicos de uso agropecuario. Se incluye en el código 2011 «Fabricación de sustancias y productos químicos básicos».","La fabricación de fertilizantes y abonos. Se incluye en el código 2012 «Fabricación de abonos y compuestos inorgánicos nitrogenados»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["20","Fabricación de sustancias y productos químicos"],"g":["202","Fabricación de otros productos químicos"],"o":""}},{"c":"2022","d":"Fabricación de pinturas, barnices y revestimientos similares, tintas para impresión y masillas","b":true,"m":"El Usuario Industrial con Código CIIU 2022 cuya Actividad Económica Principal es Fabricación de pinturas, barnices y revestimientos similares, tintas para impresión y masillas es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de pigmentos y tintes, opacificantes y colores preparados.","La fabricación de pinturas, barnices, esmaltes o lacas.","La fabricación de esmaltes vitrificables, barnices para vidriar, enlucidos cerámicos o preparados similares utilizados en la industria de la cerámica, los esmaltes y el vidrio. Los esmaltes y barnices se refieren a mezclas utilizadas para vitrificación de elementos cerámicos ya preparados, sin ningún tipo de pigmento.","La fabricación de masillas, compuestos para calafatear (rellenar o sellar), o preparados similares no refractarios para relleno como las masillas para pegar vidrios, para obturar grietas o fisuras diversas (excepto los pegantes y adhesivos generalmente a base de oxicloruros de zinc y magnesio, a base de azufre, de yeso o de materiales plásticos y de caucho).","La fabricación de disolventes y diluyentes orgánicos n.c.p., que se utilizan para mejorar la viscosidad y facilitar la homogeneización de las pinturas.","La fabricación de removedores de pintura o barniz preparados.","La fabricación de tintas para impresión: tintas litográficas, flexográficas, web offset, para fotograbado, tixotrópicas, tipográficas y demás tintas de imprenta a base de agua u otros solventes orgánicos como acetatos."],"n":["La fabricación de pigmentos y colorantes. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de disolventes o diluyentes sin mezclar de constitución químicamente definida. Se incluye en el código CIIU 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de removedores utilizados en manicure y pedicura. Se incluye en el código 2023, «Fabricación de jabones y detergentes, preparados para limpiar y pulir; perfumes y preparados de tocador».","La fabricación de tintas para escribir o dibujar. Se incluye en el código 2029, «Fabricación de otros productos químicos n.c.p.»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["20","Fabricación de sustancias y productos químicos"],"g":["202","Fabricación de otros productos químicos"],"o":""}},{"c":"2023","d":"Fabricación de jabones y detergentes, preparados para limpiar y pulir; perfumes y preparados de tocador","b":true,"m":"El Usuario Industrial con Código CIIU 2023 cuya Actividad Económica Principal es Fabricación de jabones y detergentes, preparados para limpiar y pulir; perfumes y preparados de tocador es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de jabones en barra, pastillas, piezas moldeadas, líquidos, pastas o en otras formas. Estos jabones se elaboran mediante procesamiento de grasas y aceites, de origen vegetal o animal con algún álcali (soda o potasa cáustica, etc.).","La fabricación de productos orgánicos tensoactivos en formas similares, por ejemplo, derivados de ácidos sulfónicos como sulfonatos. Jabones metálicos de magnesio, cobre, etc., obtenidos a partir de grasas, aceites y mezclas de ácidos grasos.","La fabricación de preparaciones y agentes tensoactivos utilizados como dispersantes, emulsificantes o antiespumantes, para fregar platos y suavizantes textiles.","La fabricación de papel, fieltro o guata, impregnados, revestidos o recubiertos con jabones o detergentes.","La fabricación de preparaciones y agentes de actividad superficial (tensoactivos) utilizados para lavar y limpiar; para limpiar vidrios, alfombras; blanqueadores, desmanchadores y desengrasantes.","La obtención de glicerina cruda y demás derivados de la industria jabonera.","La fabricación de preparaciones capilares, incluidos los shampoos, lacas para fijar el cabello, preparados para alisar u ondular el cabello; preparados para afeitarse, y para antes o después de afeitarse, y preparados depilatorios.","La fabricación de preparados aromáticos de uso personal como perfumes, aguas de colonia o aguas de tocador.","La fabricación de preparados de belleza y maquillaje, incluso los preparados para manicure y pedicura tales como removedores; cremas solares y preparados bronceadores.","La fabricación de preparados para la higiene bucal y dental, incluso pastas y polvos para la fijación de dentaduras postizas.","La fabricación de otros preparados de perfumería, cosméticos y de tocador no clasificados en otra parte, tales como los desodorantes, las sales de baño y otros preparados de uso personal.","La elaboración de betunes y cremas para el cuero, para la madera; destapadores; bruñidores para carrocerías, vidrios y metales; cremas para pisos; pastas y polvos abrasivos, y productos similares en forma de papel, fieltro, guata, telas no tejidas, plásticos celulares o caucho celular, impregnados, revestidos o recubiertos de estas preparaciones.","La fabricación de preparados para perfumar o desodorizar ambientes.","La fabricación de ceras artificiales y ceras preparadas mediante mezclado de ceras."],"n":["La producción de ceras de origen animal como la cera de abejas. Se incluye en el código 0149, «Cría de otros animales n.c.p.».","La producción de ceras de origen vegetal como la cera carnauba, la cera de palma. Se incluye en el código 0230, «Recolección de productos forestales diferentes a la madera».","La obtención de ceras parafínicas. Se incluye en el código 1921, «Fabricación de productos de la refinación del petróleo».","La fabricación de glicerina sintética. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La extracción y refinación de aceites esenciales, y se incluye en el código 2029, «Fabricación de otros productos químicos n.c.p.»"],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["20","Fabricación de sustancias y productos químicos"],"g":["202","Fabricación de otros productos químicos"],"o":""}},{"c":"2029","d":"Fabricación de otros productos químicos n.c.p.","b":true,"m":"El Usuario Industrial con Código CIIU 2029 cuya Actividad Económica Principal es Fabricación de otros productos químicos n.c.p. es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["Los explosivos y pólvoras preparados a partir de azufre, nitratos, nitrocelulosa, trinitrotolueno (TNT), nitroglicerina, pólvora sin humo, pólvoras propulsoras, incluso propergoles (combustibles para cohetes), productos pirotécnicos como antorchas, encendedores, teas, etc., otros preparados explosivos como mechas detonadoras, de seguridad y mechas lentas (o de minería), cápsulas y cebos fulminantes, etc.","La fabricación de fuegos artificiales, bengalas de señales, dispositivos para señalización y demás artículos similares como cohetes, fósforos y cerillas.","La fabricación de gelatina y sus derivados como los tanatos, el agar-agar y sus derivados, colas de origen animal, colas y adhesivos preparados como las colas de gluten, los adhesivos preparados a base de caucho y plástico, obtenidos a partir de emulsiones o soluciones de polímeros.","La fabricación de peptonas y derivados extraídos de la carne, de la sangre, etc., y otras sustancias proteínicas n.c.p., como las albúminas y los caseinatos.","La fabricación de preparaciones para la concentración de minerales.","La extracción y refinación de aceites esenciales y resinoides.","La fabricación de extractos de productos aromáticos naturales.","La fabricación de aguas destiladas aromáticas (agua floral), obtenidas en procesos de destilación por arrastre con vapor.","La fabricación de mezclas de productos odoríferos para la elaboración de perfumes o alimentos.","La producción de sal mineralizada apta para ganado.","La fabricación de aceites y grasas modificadas químicamente.","La fabricación de preparaciones para destapar cañerías.","La fabricación de preparaciones anticongelantes y de preparaciones antidetonantes.","La fabricación de sustancias para el acabado de productos textiles como preparaciones mordientes, para el teñido, preparaciones ignífugas, fijadores del color, anti-encogimiento, suavizantes, humectantes, etc., las cuales consisten en mezclas de sustancias químicas como sulfatos, acetatos, óxidos metálicos y ésteres, aldehídos, aceites sulfonados, etc.","La fabricación de productos para el acabado del cuero como ligantes, impermeabilizantes, pinturas, lubricantes, constituidos por ceras emulsionantes resinosas, etc.","La fabricación de preparaciones para mejorar las propiedades del papel como su brillo, suavidad, generalmente a base de ceras, resinas, colas, polímeros acrílicos, gomas, etc.","La fabricación de polvos y pastas para soldadura blanda, dura y autógena, constituidas básicamente por el metal de aporte (aleaciones de estaño, plomo, cobre, etc.) y productos auxiliares para favorecer el contacto entre metales evitando la oxidación; constituidos básicamente por mezclas de zinc o de amonio, bórax, colofonia, lanolina, etc.","La fabricación de aditivos para cementos.","La fabricación de productos para el pulimento de metales, generalmente para el decapado o eliminación de los óxidos, herrumbre, etc., constituidos por sustancias abrasivas, ácidos, álcalis diluidos.","La fabricación de carbón activado, grafito artificial y demás minerales activados químicamente como la alúmina activada, níquel Randy (aleación níquel-aluminio), etc.","La fabricación de aditivos para aceites lubricantes: anti-desgaste, antioxidantes, antiespumantes, anticorrosivos, anti-herrumbre, etc.","La fabricación de líquidos para frenos hidráulicos.","La fabricación de pasta para moldear como las de entretenimiento de los niños.","La fabricación de preparados para acelerar la vulcanización del caucho.","La fabricación de catalizadores, intercambiadores iónicos, excepto los fabricados a base de polímeros y copolímeros.","La fabricación de otros productos químicos de aplicación industrial como anticorrosivos, neutralizantes, preparaciones plastificantes, desengrasantes, antiespumantes y espumantes, aditivos para concreto, impermeabilizantes, estabilizantes, adherentes, etc.","La fabricación de preparados y cargas para extintores e incluso la recarga de extintores.","La fabricación de anti-incrustantes para calderas.","La fabricación de reactivos compuestos para análisis químico, diagnóstico y análisis de laboratorio.","La fabricación de productos para tratamiento de aguas y otros productos químicos de uso industrial.","La fabricación de preparados químicos de usos fotográficos como emulsiones, reveladores, fijadores, reforzadores, etc.","La fabricación de placas fotográficas, películas, papeles y cartones sensibilizados para usos fotográficos y heliográficos.","La fabricación de tintas para escribir y dibujar utilizadas en bolígrafos, plumas, estilógrafos, plumígrafos, marcadores y demás elementos de escritura; tintas para sellos, tintas para sellos de seguridad, y tintas para sellos de impresión digital.","La producción de biodiesel a partir del aceite refinado de palma africana o a partir de cualquier otra fuente vegetal, sebos y grasas animales por procesos de transesterificación."],"n":["La producción de sal refinada grado alimenticio. Se incluye en el código 1089, «Elaboración de otros productos alimenticios n.c.p.».","La fabricación a granel de productos de composición química definida. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La obtención de productos volátiles mediante destilación de la madera, como la trementina y sus derivados, terpenos, mentol, alcanfor, colofonia. Se incluye en el código CIIU 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de productos químicos sintéticos para el tratamiento y curtido del cuero. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de sustancias aromáticas sintéticas. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de agua destilada. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de resinas de intercambio iónico preparadas a partir de polímeros y copolímeros. Se incluye en el código 2013, «Fabricación de plásticos en formas primarias».","La fabricación de emulsiones y soluciones poliméricas base para la preparación de adhesivos. Se incluye en el código CIIU 2013, «Fabricación de plásticos en formas primarias», o en el código 2014, «Fabricación de caucho sintético en formas primarias», según el caso.","La fabricación de tintas para impresión. Se incluye en el código 2022, «Fabricación de pinturas, barnices y revestimientos similares, tintas para impresión y masillas».","La elaboración de perfumes y artículos de tocador. Se incluye en el código 2023, «Fabricación de jabones y detergentes, preparados para limpiar y pulir; perfumes y preparados de tocador».","La fabricación de adhesivos a base de asfalto. Se incluye en el código 2399, «Fabricación de otros productos minerales no metálicos n.c.p.».","La fabricación de detonadores e inflamadores eléctricos. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de armas y municiones. Se incluye en el código 2520, «Fabricación de armas y municiones»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["20","Fabricación de sustancias y productos químicos"],"g":["202","Fabricación de otros productos químicos"],"o":""}},{"c":"2030","d":"Fabricación de fibras sintéticas y artificiales","b":true,"m":"El Usuario Industrial con Código CIIU 2030 cuya Actividad Económica Principal es Fabricación de fibras sintéticas y artificiales es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de fibras sintéticas elaboradas a partir de polímeros sintéticos que provienen de etileno, propileno, acrilonitrilo como los poliésteres, poliamidas, poliuretano, obteniéndose básicamente fibras como orlón, dacrón, poliésteres, nailon, teflón, polipropileno, desechos de fibras sintéticas, etc.","La fabricación de fibras discontinuas artificiales o sintéticas sin cardar, peinar ni elaborar de otro modo para su hilatura.","Las fibras proteicas o proteínicas, de origen animal o vegetal, fibras algínicas, obtenidas por transformación de ciertas algas.","La fabricación de fibras continuas o discontinuas, texturizadas o no, retorcidas o cableadas.","La fabricación de estopas de filamento artificial o sintético.","La fabricación de placas y tiras no filamentosas de fibras artificiales o sintéticas (por ejemplo, paja artificial).","La fabricación de hilados a partir de fibras continuas o filamentos sintéticos o artificiales, incluidos texturizados o no, retorcidos o cableados incluidos los hilados de gran resistencia, siempre y cuando este proceso esté integrado a la producción de las fibras.","La fabricación de monofilamentos o hebras sintéticas o artificiales."],"n":["La manufactura de hilos e hilados a partir de fibras artificiales o sintéticas cortadas. Se incluye en el código 1311, «Preparación e hilatura de fibras textiles», puesto que en este caso se requieren procesos de cardado y peinado para paralelizar las fibras y seleccionarlas de acuerdo con su tamaño y uniformidad.","La fabricación de hilos e hilados texturizados o no, trenzados, cableados o tratados de otra manera, a partir de fibras continuas o filamentos, o fibras cortadas, no integrada al proceso de obtención de las fibras. Se incluye en el código CIIU 1311, «Preparación e hilatura de fibras textiles».","La fabricación de hilados a partir de filamentos, estopas, fibras discontinuas o hilachas. Se incluye en el código 1311, «Preparación e hilatura de fibras textiles».","La fabricación de gránulos de polímeros sintéticos (poliéster, nylon, etc.) o de derivados de la celulosa. Se incluye en el código 2013, «Fabricación de plásticos en formas primarias»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["20","Fabricación de sustancias y productos químicos"],"g":["203","Fabricación de fibras sintéticas y artificiales"],"o":""}},{"c":"2100","d":"Fabricación de productos farmacéuticos, sustancias químicas medicinales y productos botánicos de uso farmacéutico","b":true,"m":"El Usuario Industrial con Código CIIU 2100 cuya Actividad Económica Principal es Fabricación de productos farmacéuticos, sustancias químicas medicinales y productos botánicos de uso farmacéutico es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de sustancias químicas utilizadas en la preparación de productos químicos farmacéuticos, ya sea mediante cultivos de microorganismos o mediante procesos químicos y que constituyen los ingredientes activos.","La fabricación de ampollas, tabletas, cápsulas, ampolletas, ungüentos, polvos o soluciones de medicamentos, etc.","Las vitaminas básicas, incluso proteínas, aminoácidos esenciales; el ácido ascórbico (vitamina C) y sus sales, complementos vitamínicos, etc.","La producción de ácido salicílico y acetilsalicílico con sus sales y ésteres.","La fabricación de medicamentos que actúan en la sangre: inhibidores de la coagulación; preparaciones anti-anémicas, sueros, antisueros, plasmas y otras fracciones de la sangre.","La fabricación de antiinfecciosos en general: antibióticos sistémicos; agentes sistémicos para infecciones por hongos; anti-micro-bacterianos; antivirales y vacunas.","La fabricación de productos químicos anticonceptivos de uso externo y de medicamentos anticonceptivos hormonales.","La fabricación de sustancias de diagnóstico: pruebas de diagnóstico (test de embarazo y ovulación).","La fabricación de sustancias radiactivas para realizar diagnósticos in vitro.","La fabricación de productos de biotecnología.","La fabricación de azúcares químicamente puros como glucosa, dextrosa, galactosa y glucósidos.","La fabricación de apósitos médicos impregnados, guatas medicinales, vendajes para fracturas y otros productos para suturas.","Los productos botánicos pulverizados, graduados, molidos o preparados; incluye los productos homeopáticos sólidos, líquidos o glóbulos, para uso farmacéutico.","Los derivados del opio, como la morfina, la cocaína y sus derivados para uso terapéutico.","Los demás alcaloides vegetales y glucósidos extraídos de plantas o semillas, como la quinina y la atropina, para uso terapéutico.","Las sulfas, sulfamidas y derivados, utilizados generalmente como antibióticos.","La fabricación de soluciones de uso hospitalario: soluciones intravenosas, soluciones de irrigación y la producción de agua esterilizada para ampolletas.","La elaboración de productos endocrinos y fabricación de extractos endocrinos, etc."],"n":["La elaboración de caseína. Se incluye en el código 1040, «Elaboración de productos lácteos».","La elaboración de lactosa (azúcar de leche). Se incluye en el código CIIU 1040, «Elaboración de productos lácteos».","La elaboración de azúcar sacarosa. Se incluye en el código 1071, «Elaboración y refinación de azúcar».","La elaboración de fructosa. Se incluye en el código CIIU 1071, «Elaboración y refinación de azúcar».","La elaboración de infusiones de hierbas (menta, verbena, manzanilla, etc.). Se incluye en el código 1089, «Elaboración de otros productos alimenticios n.c.p.».","La producción de agua mineral. Se incluye en el código 1104, «Elaboración de bebidas no alcohólicas; producción de aguas minerales y de otras aguas embotelladas».","La fabricación de sustancias y productos químicos que no sean grado farmacéutico, ni aptos para consumo humano o veterinario, como la fabricación de sustancias químicas grado industrial. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de agua destilada. Se incluye en el código CIIU 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación y preparación de radiofármacos terapéuticos utilizados en medicina nuclear. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La producción de gases medicinales como oxígeno, nitrógeno u otros. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La fabricación de cementos, amalgamas, ceras o compuestos para impresiones usados en odontología y demás productos para obturación dental. Se incluye en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","La fabricación de cemento para la reconstrucción de huesos. Se incluye en el código CIIU 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","La eliminación de desechos de la industria farmacéutica. Se incluye en el código 3822, «Tratamiento y disposición de desechos peligrosos».","El comercio al por mayor de productos farmacéuticos. Se incluye en el código 4645, «Comercio al por mayor de productos farmacéuticos, medicinales, cosméticos y de tocador».","El comercio al por menor de productos farmacéuticos. Se incluye en el código 4773, «Comercio al por menor de productos farmacéuticos y medicinales, cosméticos y artículos de tocador en establecimientos especializados».","Las actividades de investigación y desarrollo de productos farmacéuticos (incluidos los de biotecnología). Se incluyen en el código 7210, «Investigaciones y desarrollo experimental en el campo de las ciencias naturales y la ingeniería».","El envase y empaque de productos farmacéuticos a cambio de una retribución o por contrata. Se incluye en el código 8292, «Actividades de envase y empaque»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["21","Fabricación de productos farmacéuticos, sustancias químicas medicinales y productos botánicos de uso farmacéutico"],"g":["210","Fabricación de productos farmacéuticos, sustancias químicas medicinales y productos botánicos de uso farmacéutico"],"o":""}},{"c":"2211","d":"Fabricación de llantas y neumáticos de caucho","b":true,"m":"El Usuario Industrial con Código CIIU 2211 cuya Actividad Económica Principal es Fabricación de llantas y neumáticos de caucho es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de llantas de caucho para todo tipo de vehículos, incluidas las llantas y neumáticos para equipo o maquinaria móvil, las llantas neumáticas y las llantas sólidas o mullidas (blandas).","La fabricación de llantas para aeronaves, máquinas excavadoras, juguetes, muebles y para otros usos.","La fabricación de partes de llantas tales como bandas de rodamiento intercambiables y fajas de protección del neumático.","La fabricación de tiras (perfiles sin vulcanizar) para el reencauche de llantas.","La fabricación de neumáticos (cámara de aire) para llantas."],"n":["El reencauche de llantas usadas. Se incluye en el código 2212, «Reencauche de llantas usadas».","La fabricación de perfiles de caucho vulcanizado. Se incluye en el código 2219, «Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["22","Fabricación de productos de caucho y de plástico"],"g":["221","Fabricación de productos de caucho"],"o":""}},{"c":"2212","d":"Reencauche de llantas usadas","b":true,"m":"El Usuario Industrial con Código CIIU 2212 cuya Actividad Económica Principal es Reencauche de llantas usadas es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["El reencauche de llantas de caucho para todo tipo de vehículos, incluso para aeronaves.","El reencauche de llantas para equipo y maquinaria móvil para uso agrícola, industrial y minero.","La sustitución de bandas de rodamiento para todo tipo de llantas usadas."],"n":["La fabricación de llantas, neumáticos y fajas de protección del neumático. Se incluye en el código 2211, «Fabricación de llantas y neumáticos de caucho».","La fabricación de tiras (perfiladas sin vulcanizar) para el reencauche de llantas. Se incluye en el código CIIU 2211, «Fabricación de llantas y neumáticos de caucho».","La fabricación de materiales para la reparación de neumáticos. Se incluye en el código 2219, «Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.».","Los servicios de montaje y des-pinchado de llantas. Se incluyen en el código 4520, «Mantenimiento y reparación de vehículos automotores»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["22","Fabricación de productos de caucho y de plástico"],"g":["221","Fabricación de productos de caucho"],"o":""}},{"c":"2219","d":"Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.","b":true,"m":"El Usuario Industrial con Código CIIU 2219 cuya Actividad Económica Principal es Fabricación de formas básicas de caucho y otros productos de caucho n.c.p. es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de productos de caucho natural o sintético vulcanizado, sin vulcanizar o endurecido, caucho mezclado y caucho espumado o celular para procesos de transformación más complejos.","La fabricación de formas básicas, tales como planchas, láminas, varillas, tiras, barras, mangueras de caucho, perfiles y tubos, que son materia prima para la producción de diferentes artículos de caucho.","La fabricación de productos de caucho acabados o semiacabados; productos de caucho endurecido, vulcanizado o sin vulcanizar; productos de caucho espumado o celular, productos fabricados total o parcialmente en caucho natural o sintético o en gomas parecidas al caucho, productos a base de caucho regenerado.","La fabricación de mangueras, bandas transportadoras, correas, cintas de transmisión, artículos higiénicos y de farmacia, hilos, cuerdas de caucho, guantes, prendas de vestir, trajes isotérmicos y de buceo, cuyas piezas se unen por adhesión y no por costura.","La fabricación de cubiertas para rodillos.","La fabricación de colchones de caucho inflables y globos inflables.","La fabricación de grifos, llaves de paso, válvulas y artefactos similares de caucho vulcanizado no endurecido.","La fabricación de arandelas, conectores y sellos de caucho.","La fabricación de partes, piezas y accesorios de caucho para motores eléctricos y para todo tipo de aparatos eléctricos, electromecánicos o electrónicos.","La fabricación de materiales para la reparación de productos de caucho (parches, etc.).","La fabricación de tejidos textiles impregnados, revestidos, recubiertos o laminados con caucho en los que este material es el componente principal.","La fabricación de colchones de caucho para camas de agua.","La fabricación de peines de caucho duro, rulos y cepillos de caucho, artículos sexuales, preservativos, chupos para biberón, bolsas de agua caliente, gorros de baño y delantales de caucho.","El encauchado de hilados y tejidos."],"n":["La producción de caucho en plantaciones. Se incluye en el código 0230 «Recolección de productos forestales diferentes a la madera».","La fabricación de cuerdas, cordeles, cables, bramantes y redes de fibras textiles, estén o no impregnados, revestidos, cubiertos o forrados con caucho o material plástico. Se incluye en el código 1394 «Fabricación de cuerdas, cordeles, cables, bramantes y redes».","La fabricación de hilos de caucho revestido con materias textiles. Se incluye en el código 1399 «Fabricación de otros artículos textiles n.c.p.».","La fabricación de tejidos con hilos manufacturados, para cuerdas de alta tenacidad para llantas. Se incluye en el código CIIU 1399 «Fabricación de otros artículos textiles n.c.p.».","La fabricación de prendas de vestir de tejidos elásticos. Se incluye en el código 1410 «Confección de prendas de vestir, excepto prendas de piel».","La fabricación de artículos de vestuario en telas encauchadas cuyas piezas están unidas por costura. Se incluye en el código CIIU 1410 «Confección de prendas de vestir, excepto prendas de piel».","La fabricación de calzado de caucho. Se incluye en el código 1522 «Fabricación de otros tipos de calzado, excepto de cuero y piel».","La fabricación de partes de calzado de caucho. Se incluye en el código 1523 «Fabricación de partes de calzado».","La obtención de caucho sintético en formas primarias (líquidos o pastas, bloques irregulares, trozos, grupos, polvos, grumos, copos y masas no coherentes similares). Se incluye en el código 2014 «Fabricación de caucho sintético en formas primarias».","La fabricación de colas y adhesivos a base de caucho. Se incluye en el código 2029 «Fabricación de otros productos químicos n.c.p.».","La fabricación de perfiles de caucho vulcanizado para el reencauche de llantas. Se incluye en el código 2211 «Fabricación de llantas y neumáticos de caucho».","La fabricación de linóleo y recubrimientos duros para pisos. Se incluye en el código 2229 «Fabricación de artículos de plástico n.c.p.».","La fabricación de instrumentos científicos a partir de partes y piezas con componentes de caucho. Se incluye en el código 2651 «Fabricación de equipo de medición, prueba, navegación y control».","La fabricación de aparatos para distribuir energía eléctrica, conmutar, aislar, proteger o conectar circuitos. Se incluye en el código 2712 «Fabricación de aparatos de distribución y control de la energía eléctrica».","La fabricación de balsas inflables. Se incluye en el código 3011 «Construcción de barcos y de estructuras flotantes».","La fabricación de embarcaciones de recreo inflables. Se incluye en el código 3012 «Construcción de embarcaciones de recreo y deporte».","La fabricación de colchones de caucho celular (espumado) no enfundado. Se incluye en el código 3120 «Fabricación de colchones y somieres».","La fabricación de accesorios deportivos, por ejemplo, pelotas de caucho. Se incluye en el código 3230 «Fabricación de artículos y equipo para la práctica del deporte».","La fabricación de juegos y juguetes de caucho. Se incluye en el código 3240 «Fabricación de juegos, juguetes y rompecabezas».","La fabricación de artículos para uso médico, dental o quirúrgico a partir de partes y piezas con componentes de caucho. Se incluye en el código 3250 «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","La recuperación de productos de caucho como llantas usadas para obtener materias primas secundarias. Se incluye en el código 3830 «Recuperación de materiales»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["22","Fabricación de productos de caucho y de plástico"],"g":["221","Fabricación de productos de caucho"],"o":""}},{"c":"2221","d":"Fabricación de formas básicas de plástico","b":true,"m":"El Usuario Industrial con Código CIIU 2221 cuya Actividad Económica Principal es Fabricación de formas básicas de plástico es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La elaboración del plástico en formas básicas tales como monofilamentos (de dimensión transversal mayor a 1 mm), planchas, láminas, barras, varillas, perfiles, películas, hojas, tiras, tubos y mangueras; formas planas, sean autoadhesivas o no; plástico celular (espumado) o no; bloques de forma geométrica regular incluso impresos, sin cortar o simplemente cortados de forma rectangular.","La fabricación de etiquetas de material plástico sin impresión, sean autoadhesivas o no.","La fabricación de cintas de señalización y detención de seguridad de material plástico."],"n":["La obtención de plásticos en formas primarias. Se incluye en el código 2013, «Fabricación de plásticos en formas primarias».","La fabricación de artículos de caucho sintético o natural. Se incluye en el grupo 221, «Fabricación de productos de caucho».","La fabricación de artículos a partir del plástico en cualquiera de sus formas básicas. Se incluye en el código 2229, «Fabricación de artículos de plástico n.c.p.».","La fabricación de artículos a base de plástico recuperado. Se incluye en el código 2229, «Fabricación de artículos de plástico n.c.p.»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["22","Fabricación de productos de caucho y de plástico"],"g":["222","Fabricación de productos de plástico"],"o":""}},{"c":"2229","d":"Fabricación de artículos de plástico n.c.p.","b":true,"m":"El Usuario Industrial con Código CIIU 2229 cuya Actividad Económica Principal es Fabricación de artículos de plástico n.c.p. es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de artículos para envase de mercancías tales como: bolsas, sacos, cajones, frascos, botellas, garrafones y similares de plástico.","La fabricación de prendas de vestir de plástico cuyas piezas se unen por adhesión y no por costura.","La fabricación de artículos plásticos para la construcción tales como puertas, ventanas, marcos, postigos, persianas; cubrimientos plásticos para pisos, paredes y techos; artículos sanitarios, bañeras, duchas, lavabos, tazas de inodoro, cisternas de inodoros, artículos de fontanería, productos para el revestimiento de pisos, paredes en rollos, losetas plásticas (vinilo, linóleo, etc.), tanques y depósitos de plásticos.","La fabricación de accesorios de material plástico para tuberías (juntas, codos, racores, etcétera).","La fabricación de servicios de mesa, utensilios de cocina y artículos de tocador.","La fabricación de otros artículos de plástico unidos por adhesión como tocados (gorros de baño de plástico), artículos de vestuario (ejemplo: gabardinas, abrigos, etc.); material escolar y de oficina; rollos u hojas de celofán; accesorios para muebles, estatuillas y otros artículos de plástico para la decoración.","La fabricación de señales de plástico.","La fabricación de colchones de material plástico para camas de agua.","La fabricación de piedra artificial (por ejemplo: mármol artificial), artículos de tocado, cintas autoadhesivas, hormas para zapatos, boquillas de cigarros, peines, rulos de plástico, etc.","Correas de transporte y de transmisión.","La fabricación de papel de colgadura de material plástico.","La fabricación de artículos a partir del plástico en cualquiera de sus formas básicas.","La fabricación de artículos a base de plástico recuperado.","Accesorios para aislamiento, piezas de lámparas y accesorios para alumbrado."],"n":["La fabricación de artículos de vestuario en telas plásticas o telas plastificadas cuyas piezas se unan por costura. Se incluye en el código 1410 «Confección de prendas de vestir, excepto prendas de piel».","La fabricación de maletas, bolsos y artículos similares de plástico. Se incluye en el código 1513 «Fabricación de artículos de viaje, bolsos de mano y artículos similares; artículos de talabartería y guarnicionería elaborados en otros materiales».","La fabricación de calzado de plástico. Se incluye en el código 1522 «Fabricación de otros tipos de calzado, excepto calzado de cuero y piel».","La fabricación de partes calzado de plástico. Se incluye en el código 1523 «Fabricación de partes de calzado».","La fabricación de artículos trenzados o de cestería. Se incluye en el código 1690 «Fabricación de otros productos de madera; fabricación de artículos de corcho, cestería y espartería».","La fabricación de plástico en formas primarias. Se incluye en el código 2013 «Fabricación de plástico en formas primarias».","La fabricación de artículos de caucho sintético o natural. Se incluye en el código 2219 «Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.».","La fabricación de instrumentos científicos a partir de partes y piezas con componentes de plástico. Se incluye en el código 2651 «Fabricación de equipo de medición, prueba, navegación y control».","La fabricación de dispositivos de cableado de plástico no conductores de corriente incluido cajas plásticas de conexiones, tapas para tomas e interruptores. Se incluye en el código 2732 «Fabricación de dispositivos de cableado».","La fabricación de carrocerías de material plástico para vehículos automotores y otros vehículos. Se incluye en el código 2920 «Fabricación de carrocerías para vehículos automotores; fabricación de remolques y semirremolques».","La fabricación de partes, piezas y accesorios de material plástico para vehículos automotores, y se incluye en el código 2930 «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de muebles enteros o parcialmente de material plástico. Se incluye, en el código 3110 «Fabricación de muebles y en el código 3120, «Fabricación de colchones y somieres».","La fabricación de colchones de plástico celular (espumado) no enfundados. Se incluye en el código 3120 «Fabricación de colchones y somieres».","La fabricación de accesorios deportivos en material plástico. Se incluye en el código 3230 «Fabricación de artículos y equipo para la práctica del deporte».","La fabricación de juegos y juguetes en material plástico. Se incluye en el código 3240 «Fabricación de juegos, juguetes y rompecabezas».","La fabricación de elementos ópticos de plástico. Se incluye en el código 3250 «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","La fabricación de instrumentos y materiales médicos y dentales. Se incluyen en el código CIIU 3250 «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","La fabricación de árboles de Navidad y sus adornos, excepto los adornos de vidrio y eléctricos. Se incluye en el código 3290 «Otras industrias manufactureras n.c.p.».","La fabricación de equipos de seguridad en plástico (ej. cascos). Se incluye en el código CIIU 3290 «Otras industrias manufactureras n.c.p.»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["22","Fabricación de productos de caucho y de plástico"],"g":["222","Fabricación de productos de plástico"],"o":""}},{"c":"2310","d":"Fabricación de vidrio y productos de vidrio","b":true,"m":"El Usuario Industrial con Código CIIU 2310 cuya Actividad Económica Principal es Fabricación de vidrio y productos de vidrio es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de vidrio en masa y bajo otras formas, trabajado o no, incluidos las láminas, las planchas, y los tubos o las varillas.","La fabricación de vidrio plano de distintas características físicas, incluso vidrio con armado de alambre y vidrio coloreado o teñido.","La fabricación de vidrio de seguridad constituido por vidrio templado o laminado, o formado por hojas encoladas.","La fabricación de bloques de vidrio para pavimentar y de unidades aislantes de vidrio de capa múltiple.","La fabricación de espejos de vidrio.","La fabricación de lunas o lunetas de seguridad sin enmarcar para vehículos.","La fabricación de vidrio de seguridad para vehículos automotores, incluidos los conformados para parabrisas, ventanas, etcétera.","La fabricación de espejos retrovisores para vehículos.","La fabricación de botellas, frascos y otros envases de vidrio o cristal.","La fabricación de artículos de vidrio obtenidos por prensado o moldeado, utilizados en la construcción, por ejemplo, baldosas de vidrio; recipientes de vidrio, incluso tapas, tapones y artículos de cierre; las bombas de vidrio para recipientes aislantes; artículos de vidrio para la cocina y para la mesa, por ejemplo, vasos y otros artículos domésticos de vidrio o cristal.","La fabricación de cristalería de laboratorio como cajas para el cultivo de microorganismos (caja de Petri), buretas, campanas especiales y cuentagotas generalmente trabajados en vidrio especial, cristalería higiénica y farmacéutica como irrigadores, lavaojos, inhaladores, etc.","La fabricación de vidrios para relojes y análogos; vidrio óptico y piezas de vidrio óptico sin trabajar ópticamente.","La fabricación de piezas de vidrio utilizadas en bisutería, entre ellas joyas de fantasía como imitaciones de perlas finas y de coral.","La fabricación de fibras de vidrio (incluso lana de vidrio) e hilados de fibras de vidrio. Productos no tejidos de fibra de vidrio como esteras, colchones de aislamiento termo acústico, tapetes, paneles, tableros y artículos similares.","La fabricación de aislantes de vidrio y accesorios aislantes de vidrio.","La fabricación de figuras y adornos de vidrio.","La restauración de vitrales.","La fabricación de bulbos en vidrio para bombillas.","La fabricación de grifos, llaves de paso, válvulas y artefactos similares de vidrio."],"n":["La fabricación de telas tejidas con hilados de fibras de vidrio. Se incluye en el código 1312, «Tejeduría de productos textiles».","La fabricación de productos de lana de vidrio para aislamiento térmico. Se incluye en el código 2399, «Fabricación de otros productos minerales no metálicos n.c.p.».","La fabricación de elementos y piezas de vidrio óptico trabajados ópticamente; y la fabricación de fibras ópticas sin aislamiento. Se incluye en el código 2670, «Fabricación de instrumentos ópticos y equipo fotográfico».","La fabricación de cables de fibras ópticas para transmisión de imágenes en directo. Se incluye en el código 2731, «Fabricación de hilos y cables eléctricos y de fibra óptica».","La fabricación de lunas de seguridad enmarcadas y lunetas con dispositivos de conexión eléctrica a la red desempañante para vehículos automotores. Se incluye en el código 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de joyas de fantasía. Se incluye en el código 3210, «Fabricación de joyas, bisutería y artículos conexos».","La fabricación de juguetes de vidrio, por ejemplo canicas. Se incluye en el código 3240, «Fabricación de juegos, juguetes y rompecabezas».","La fabricación de material médico y de laboratorio clínico, incluso jeringas. Se incluye en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["23","Fabricación de otros productos minerales no metálicos"],"g":["231","Fabricación de vidrio y productos de vidrio"],"o":""}},{"c":"2391","d":"Fabricación de productos refractarios","b":true,"m":"El Usuario Industrial con Código CIIU 2391 cuya Actividad Económica Principal es Fabricación de productos refractarios es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de morteros, hormigones y cementos refractarios, constituidos por preparaciones de materiales específicos como dolomita, tierras especiales, etc., en proporciones definidas, mezclados con un aglomerante; utilizados posteriormente en el revestimiento interno de hornos y demás equipos sometidos a altas temperaturas.","La fabricación de artículos de cerámica para aislamiento térmico o acústico mediante el moldeado y la cochura de tierras silíceas fósiles, es decir, rocas formadas por restos de caparazones de infusorios fósiles (diatomeas).","La fabricación de ladrillos, bloques, losetas y otros artículos similares de cerámica refractaria.","La fabricación de productos de cerámica resistentes a elevadas temperaturas; por ejemplo, retortas, crisoles, muflas para la industria metalúrgica y química, etc.","La fabricación de artículos refractarios que contengan magnesita, dolomita o cromita."],"n":["La fabricación de artículos de cerámica no refractaria para uso doméstico. Se incluye en el código 2393, «Fabricación de otros productos de cerámica y porcelana», pero si se trata de artículos de cerámica no refractaria para construcción, se incluyen en el código 2392, «Fabricación de materiales de arcilla para la construcción».","La fabricación de cementos hidráulicos. Se incluye en el código 2394, «Fabricación de cemento, cal y yeso».","La fabricación de artículos de hormigón no refractario. Se incluye en el código 2395, «Fabricación de artículos de hormigón, cemento y yeso»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["23","Fabricación de otros productos minerales no metálicos"],"g":["239","Fabricación de productos minerales no metálicos n.c.p."],"o":""}},{"c":"2392","d":"Fabricación de materiales de arcilla para la construcción","b":true,"m":"El Usuario Industrial con Código CIIU 2392 cuya Actividad Económica Principal es Fabricación de materiales de arcilla para la construcción es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación industrial o artesanal de materiales de cerámica no refractaria para la construcción tales como: ladrillos, bloques para pisos, tejas, tubos de chimeneas, etc.","La fabricación de tubos, conductos, canalones y accesorios para tuberías de cerámica.","La fabricación de baldosas y losas para pavimentos, losetas, azulejos para la pared o para cañones de chimeneas, cubos de mosaico y productos de cerámica esmaltados o no.","La fabricación de bloques para pisos de arcilla cocida.","La fabricación de artefactos sanitarios de cerámica; por ejemplo: lavabos, bañeras, bidés, inodoros y demás artículos de cerámica para uso en construcción."],"n":["La fabricación de piedra artificial (ej. mármol artificial). Se incluye en el código 2229, «Fabricación de artículos de plástico n.c.p.».","La fabricación de productos de cerámica refractaria. Se incluye en el código 2391, «Fabricación de productos refractarios».","La fabricación de productos de cerámica no refractaria para uso doméstico. Se incluye en el código 2393, «Fabricación de otros productos de cerámica y porcelana»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["23","Fabricación de otros productos minerales no metálicos"],"g":["239","Fabricación de productos minerales no metálicos n.c.p."],"o":""}},{"c":"2393","d":"Fabricación de otros productos de cerámica y porcelana","b":true,"m":"El Usuario Industrial con Código CIIU 2393 cuya Actividad Económica Principal es Fabricación de otros productos de cerámica y porcelana es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de vajillas y otros artículos utilizados con fines domésticos o de aseo.","La fabricación de estatuillas, muebles de cerámica y otros artículos ornamentales de cerámica.","La fabricación de aparatos y utensilios de cerámica para laboratorio, para la industria química, para la industria en general o para la agricultura, como por ejemplo, bebederos, tinas, pilas, etc.","La fabricación de aisladores eléctricos de cerámica.","La fabricación de muebles de cerámica.","La fabricación de artículos de mesa, domésticos y de tocador de cerámica.","La fabricación de imanes cerámicos y de ferrita.","La fabricación de artículos de porcelana, loza, piedra o arcilla, o de alfarería común.","La fabricación de vasijas, tarros de cerámica y de artículos similares utilizados para transportar o envasar productos.","La fabricación de productos de cerámica no refractaria diferentes a aquellos que se utilizan para uso estructural.","La fabricación de grifos, llaves de paso, válvulas y artículos similares de materiales de cerámica.","La fabricación de productos de cerámica n.c.p."],"n":["La fabricación de piedra artificial (ej. mármol artificial). Se incluye en el código 2229, «Fabricación de artículos de plástico n.c.p.».","La fabricación de artículos de cerámica refractaria. Se incluye en el código 2391, «Fabricación de productos refractarios».","La fabricación de materiales de construcción de cerámica. Se incluye en el código 2392, «Fabricación de materiales de arcilla para la construcción».","La fabricación de aparatos sanitarios de cerámica. Se incluye en el código CIIU 2392, «Fabricación de materiales de arcilla para la construcción».","La fabricación de imanes metálicos permanentes. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de joyas de fantasía. Se incluye en el código 3210, «Fabricación de joyas, bisutería y artículos conexos».","La fabricación de juguetes de cerámica. Se incluye en el código 3240, «Fabricación de juegos, juguetes y rompecabezas».","La fabricación de dientes postizos. Se incluye en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["23","Fabricación de otros productos minerales no metálicos"],"g":["239","Fabricación de productos minerales no metálicos n.c.p."],"o":""}},{"c":"2394","d":"Fabricación de cemento, cal y yeso","b":true,"m":"El Usuario Industrial con Código CIIU 2394 cuya Actividad Económica Principal es Fabricación de cemento, cal y yeso es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de Clinker y cementos hidráulicos, incluidos cemento Portland, cemento aluminoso, cemento de escorias y cemento hiper-sulfatado.","La fabricación de cal viva (caliza y/o dolomita calcinada).","La fabricación de cal apagada.","La fabricación de cal hidráulica.","La fabricación de yesos a partir de yeso calcinado y/o sulfato de calcio.","La fabricación de dolomita calcinada."],"n":["La explotación de yeso. Se incluye en el código 0811, «Extracción de piedra, arena, arcillas comunes, yeso y anhidrita».","La fabricación de cementos, morteros, etc., refractarios. Se incluye en el código 2391, «Fabricación de productos refractarios».","La fabricación de artículos de cemento y de yeso. Se incluye en el código 2395, «Fabricación de artículos de hormigón, cemento y yeso».","La fabricación de mezclas preparadas y secas para hormigón y mortero. Se incluye en el código CIIU 2395, «Fabricación de artículos de hormigón, cemento y yeso».","La fabricación de cementos dentales. Se incluye en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["23","Fabricación de otros productos minerales no metálicos"],"g":["239","Fabricación de productos minerales no metálicos n.c.p."],"o":""}},{"c":"2395","d":"Fabricación de artículos de hormigón, cemento y yeso","b":true,"m":"El Usuario Industrial con Código CIIU 2395 cuya Actividad Económica Principal es Fabricación de artículos de hormigón, cemento y yeso es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de materiales y artículos prefabricados de hormigón, cemento, yeso o piedra artificial utilizados en la construcción como losetas, losas, baldosas, ladrillos, planchas, láminas, tableros, tubos, postes, etc.","La fabricación de componentes estructurales prefabricados de cemento, hormigón o piedra artificial para obras de construcción o de ingeniería civil.","La fabricación de materiales de construcción compuestos de sustancias vegetales (lana de madera, paja, cañas, juncos) aglomeradas con cemento, yeso u otro aglutinante mineral.","La fabricación de artículos de asbesto-cemento, fibrocemento de celulosa o materiales similares como láminas lisas y onduladas, tableros, losetas, tubos, tanques de agua, cisternas, lavabos, lavaderos, cántaros; marcos para ventanas y otros artículos.","La fabricación de morteros en polvo.","La fabricación de mezclas preparadas y secas para la elaboración de hormigón y mortero constituidas por arena, piedra, sustancia aglomerante (cemento) y agua.","La fabricación de otros artículos de hormigón, cemento y yeso tales como estatuas, muebles, bajorrelieves y altorrelieves, jarrones, macetas, etc.","La fabricación de artículos de hormigón no refractario."],"n":["La fabricación de cementos y morteros refractarios. Se incluye en el código 2391, «Fabricación de productos refractarios».","La fabricación de hilados y tela de asbesto. Se incluye en el código 2399, «Fabricación de otros productos minerales no metálicos n.c.p.»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["23","Fabricación de otros productos minerales no metálicos"],"g":["239","Fabricación de productos minerales no metálicos n.c.p."],"o":""}},{"c":"2396","d":"Corte, tallado y acabado de la piedra","b":true,"m":"El Usuario Industrial con Código CIIU 2396 cuya Actividad Económica Principal es Corte, tallado y acabado de la piedra es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["El corte, tallado y acabado de la piedra para la construcción de edificios, carreteras, muebles de piedra, monumentos funerarios, estatuas (no originales artísticas), andenes, techos y otros usos.","El trabajo de la piedra en bruto extraída de canteras."],"n":["Las actividades propias de las canteras como por ejemplo, la extracción de piedra en bruto sin desbastar. Se incluye en el código 0811, «Extracción de piedra, arena, arcillas comunes, yeso y anhidrita», y en el código 0812, «Extracción de arcillas de uso industrial, caliza, caolín y bentonitas».","La producción de piedras (muelas) de molino, piedras abrasivas y artículos similares. Se incluye en el código 2399, «Fabricación de otros productos minerales no metálicos n.c.p.».","Las actividades de escultores. Se incluye en el código 9005, «Artes plásticas y visuales»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["23","Fabricación de otros productos minerales no metálicos"],"g":["239","Fabricación de productos minerales no metálicos n.c.p."],"o":""}},{"c":"2399","d":"Fabricación de otros productos minerales no metálicos n.c.p.","b":true,"m":"El Usuario Industrial con Código CIIU 2399 cuya Actividad Económica Principal es Fabricación de otros productos minerales no metálicos n.c.p. es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de hilas, hilados y telas de asbesto; cordones y cordeles; elaborados con telas de asbesto como prendas de vestir, cubrecabezas, calzado, papel, fieltro, etc.","La fabricación de materiales de fricción sobre una base de asbesto, de otras sustancias minerales y de celulosa, combinados o no con otros materiales como por ejemplo, placas, bandas, etc.","La fabricación de materiales aislantes de origen mineral: lana de escorias, lana de roca y otras lanas minerales similares, vermiculita dilatada, arcillas dilatadas, materiales similares para aislamiento térmico o sonoro y para absorber el sonido.","La fabricación de productos de lana de vidrio.","La fabricación de artículos de asfalto o de materiales similares como, por ejemplo, losas, losetas, ladrillos, adhesivos a base de asfalto, brea de alquitrán de hulla, etc.","La producción de piedras de molino, de piedras de afilar o de pulir, de abrasivos naturales y artificiales, en polvo o en grano, aplicados sobre una base de material textil, de papel, de cartón y de otro material (por ejemplo, papel de lija).","La fabricación de productos de fibras de grafito y carbón (excepto electrodos y productos para aplicaciones eléctricas).","La fabricación de artículos elaborados con otras sustancias minerales no clasificadas en otra parte, incluso mica labrada y artículos de mica, de turba o de grafito (que no sean artículos eléctricos) o de otras sustancias minerales."],"n":["La fabricación de lana de vidrio y productos no tejidos de lana de vidrio. Se incluye en el código 2310, «Fabricación de vidrio y productos de vidrio».","La fabricación de juntas de grafito. Se incluye en el código 2819, «Fabricación de otros tipos de maquinaria y equipo de uso general n.c.p.».","La extracción de asbesto (amianto). Se incluye en el código 0899, «Extracción de otros minerales no metálicos n.c.p.».","La fabricación de artículos de materiales de fricción ensamblados como los frenos y los embragues. Se incluye en el código 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["23","Fabricación de otros productos minerales no metálicos"],"g":["239","Fabricación de productos minerales no metálicos n.c.p."],"o":""}},{"c":"2410","d":"Industrias básicas de hierro y de acero","b":true,"m":"El Usuario Industrial con Código CIIU 2410 cuya Actividad Económica Principal es Industrias básicas de hierro y de acero es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["Las operaciones de conversión por reducción del mineral de hierro en altos hornos y convertidores de oxígeno; o de escoria o chatarra ferrosa en hornos eléctricos; o por directa reducción del mineral de hierro sin fusión para obtener acero en bruto, el cual es fundido y refinado en el horno cuchara, y es vertido y solidificado en la colada continua para producir productos planos y largos semielaborados, los cuales son usados después de recalentados en operaciones de laminado, estirado y extrusión para fabricar productos terminados tales como: planchas, láminas, tiras, varillas, barras, tubos y perfiles huecos.","El funcionamiento de los altos hornos, hornos eléctricos, convertidores de acero, coladas continuas, talleres y/o trenes de laminado y de acabado, bancos de trefilación.","La producción de ferroaleaciones.","La fabricación de hierro granular (granalla) y polvo de hierro.","La producción de productos ferrosos mediante reducción directa de hierro y de otros productos de hierro esponjoso. La producción de hierro de pureza excepcional mediante electrólisis u otros procesos químicos.","La producción de arrabio y hierro en lingotes, bloques y en otras formas primarias, incluso hierro especular.","La refundición de lingotes de chatarra de hierro o acero.","La producción de coque, cuando constituye una actividad integrada a los procesos metalúrgicos (alto horno), para la obtención de acero.","La producción de acero mediante procesos neumáticos o de cocción.","La producción de lingotes de acero o de acero de aleación y de otras formas primarias de acero.","La producción de palanquillas, tochos, barras, palastros u otras formas de hierro, acero o acero de aleación en estado semiacabado.","La fabricación de productos de hierro, acero y acero de aleación, laminados, estirados, trefilados, extrudidos, entre otros procesos de manufactura. El procesamiento de estos productos puede ser en caliente o en frío, o puede empezar en caliente y terminar en frío.","Los productos manufacturados bajo estos procesos son:","Ángulos, perfiles y secciones de acero inoxidable u otra aleación del acero; barras y varillas de acero inoxidable u otra aleación del acero; productos laminados de hierro y acero sin alear; ángulos, material de construcción en acero para vías de ferrocarril (carriles o rieles no ensamblados).","Tubos y perfiles huecos en acero sin costura por medio del laminado, extrudido o estirado en caliente, o por medio del estirado o laminado en frío.","Tuberías y perfiles huecos en acero, soldados, remachados o unidos en forma similar, tubos soldados mediante conformación en frío o en caliente y por procesos de soldadura.","Conectores de tubo de acero: clavijas planas y clavijas con anillos forjados de acero, conectores de soldadura a tope de acero, conectores roscados o reforzados con hilos, y otros conectores de acero.","Barras o secciones de acero mediante el estirado en frío, rectificado o torneado, incluso barras plegadas o figuradas en frío.","Secciones abiertas mediante conformación progresiva en un laminador de rulos o mediante plegado en una prensa de productos laminados de acero.","Alambres de hierro y acero mediante trefilado o alargamiento en frío.","Planchas, rollos, platinas de hierro y acero, etc."],"n":["La producción de minerales de hierro sinterizados. Se incluye en el código 0710, «Extracción de minerales de hierro».","El funcionamiento de coquerías independientes. Se incluye en el código 1910, «Fabricación de productos de hornos de coque».","La producción de tubos, caños y perfiles huecos y de conexiones de tubos o caños en hierro fundido, hierro gris, hierro dúctil, hierro maleable o acero fundido, elaborados en talleres de fundición. Se incluyen en el código 2431, «Fundición de hierro y de acero».","La fabricación de hierro fundido y tubos de hierro o acero de fundición, sin costura, por fundición centrífuga. Se incluye en el código CIIU 2431, «Fundición de hierro y de acero».","Las operaciones de forja y de fundición realizadas como parte de la fabricación de un determinado tipo de producto. Se incluye en la clase correspondiente a la fabricación del producto, según sea el caso; por ejemplo, la fabricación de barandas forjadas para escalera se incluye en el código 2511, «Fabricación de productos metálicos para uso estructural».","La selección y la recuperación de chatarra de hierro y/o acero. Se incluyen en el código 3830, «Recuperación de materiales»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["24","Fabricación de productos metalúrgicos básicos"],"g":["241","Industrias básicas de hierro y de acero"],"o":""}},{"c":"2421","d":"Industrias básicas de metales preciosos","b":true,"m":"El Usuario Industrial con Código CIIU 2421 cuya Actividad Económica Principal es Industrias básicas de metales preciosos es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de productos primarios de metales preciosos (oro, plata y metales del grupo del platino), labrados (trabajados) o no, tales como: grumos, granos, lingotes, barras fundidas, gránulos, entre otros, o en barras laminadas, varillas, secciones, alambres, planchas, hojas y tiras, o en tubos, tuberías, barras huecas, hojuelas, polvo, entre otros.","La refinación de dichos metales preciosos mediante procesos químicos a fin de eliminar impurezas intrínsecas.","La producción de oro, plata y metales del grupo del platino (platino, paladio, rodio, iridio, osmio, rutenio, entre otros).","La producción de metales comunes enchapados en plata.","La producción de metales comunes o plata enchapados en oro.","La producción de metales comunes enchapados de platino y de metales del grupo platino.","La fabricación de láminas de metales preciosos.","La producción de aleaciones de metales preciosos.","La producción de semiproductos de metales preciosos."],"n":["Los procesos de lavado (mazamorreo) hasta separar el oro y la plata de otros elementos o impurezas (materiales no metálicos carentes de valor económico), siempre y cuando se realicen por cuenta del explotador en sitios cercanos a la mina. Se incluye en el código 0722, «Extracción de oro y otros metales preciosos».","La fabricación de cajas de metales preciosos para relojes. Se incluye en el código 2652, «Fabricación de relojes».","La fabricación de joyas de metales preciosos, monedas (incluso monedas de curso legal, sean o no de metales preciosos) y los demás artículos y piezas de artículos elaborados con metales preciosos o en chapados con metales preciosos. Se incluye en el código 3210, «Fabricación de joyas, bisutería y artículos conexos».","La selección y recuperación de materiales de desecho con contenido de metales preciosos. Se incluye en el código 3830, «Recuperación de materiales»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["24","Fabricación de productos metalúrgicos básicos"],"g":["242","Industrias básicas de metales preciosos y de metales no ferrosos"],"o":""}},{"c":"2429","d":"Industrias básicas de otros metales no ferrosos","b":true,"m":"El Usuario Industrial con Código CIIU 2429 cuya Actividad Económica Principal es Industrias básicas de otros metales no ferrosos es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La producción de metales comunes no ferrosos (aluminio, plomo, cinc, estaño, cromo, manganeso, níquel, entre otros) utilizando mineral en bruto, mineral en mata, otras materias primas intermedias entre el mineral en bruto y el metal (por ejemplo, alúmina), o desechos y chatarra de este tipo de metales.","La producción de alúmina, matas de cobre, y matas de níquel.","Las operaciones de fundición, de refinación electrolítica o de otra índole para producir metales comunes no ferrosos sin labrar o trabajar.","La fundición y la refinación de níquel, cobre, plomo, cromo, manganeso, cinc, aluminio, estaño u otros metales comunes no ferrosos y aleaciones de esos metales.","La fabricación de productos de metales comunes no ferrosos mediante laminado, trefilado, estirado o extrusión, tales como: hojas, planchas, tiras, barras, varillas, perfiles, alambres, tubos, tuberías y accesorios para tubos o tuberías. También comprende la obtención de polvos, gránulos y escamas de metales no ferrosos a partir de estos procesos.","La producción de aleaciones de metales comunes como aluminio, plomo, cinc, estaño, cobre, cromo, manganeso, níquel, etc.","La fabricación de semiproductos de metales comunes.","La fabricación de papel aluminio a partir de láminas de aluminio como componente primario.","La producción de alambre para fusibles o láminas para fusibles.","La producción de uranio metálico a partir de la pechblenda (dióxido de uranio) o de otros minerales.","La fundición y la refinación de uranio.","La fabricación de contrachapados de hojas delgadas en donde predomine el aluminio."],"n":["La extracción de minerales de níquel para la obtención de ferroníquel. Se incluye en el código 0723, «Extracción de minerales de níquel».","La fabricación de laminados y láminas metálicas (aluminio), en el caso de los laminados metálicos sobre una base de papel o cartón. Se incluye en el código 1701, «Fabricación de pulpas (pastas) celulósicas, papel y cartón».","El enriquecimiento de uranio. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La fundición de metales no ferrosos, cuyos productos resultantes de estos procesos no se encuentren clasificados en las divisiones 25 a 32. Se incluye en el código 2432, «Fundición de metales no ferrosos».","La selección y recuperación de chatarra y materiales de desecho metálicos no ferrosos. Se incluye en el código 3830, «Recuperación de materiales»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["24","Fabricación de productos metalúrgicos básicos"],"g":["242","Industrias básicas de metales preciosos y de metales no ferrosos"],"o":""}},{"c":"2431","d":"Fundición de hierro y de acero","b":true,"m":"El Usuario Industrial con Código CIIU 2431 cuya Actividad Económica Principal es Fundición de hierro y de acero es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["Las actividades de talleres de fundición de hierro y acero, tales como: modelación, moldeado, fundición y colada, limpieza y acabados, tratamiento térmico del hierro o acero, entre otras actividades.","La fabricación de productos semiacabados y acabados a partir de la fundición de: hierro blanco, hierro gris, hierro de grafito, hierro nodular o hierro dúctil, hierro maleable, acero.","La fabricación de tubos, caños y perfiles huecos y las conexiones de tubos o caños en hierro fundido, hierro gris, hierro dúctil, hierro maleable o acero de fundición.","La fabricación de tubos y caños de acero sin costura por fundición centrífuga, y accesorios para tubería en acero fundido.","La fabricación de piezas de acero con geometrías complejas por medio de la técnica de micro-fundición."],"n":["Las actividades de talleres de fundición de hierro o acero y la fabricación de piezas fundidas en hierro o acero de fundición (ej.: engranajes para automóviles). Se incluyen donde corresponda, en cualquiera de las categorías descritas en las divisiones 25 a 32.","El tratamiento térmico de metales ferrosos, cuando esta actividad no hace parte del proceso de fundición del hierro o del acero. Se incluye en el código 2592, «Tratamiento y revestimiento de metales, mecanizado ».","La fabricación de lingoteras. Se incluye en el código 2823, «Fabricación de maquinaria para la metalurgia ».","La fabricación de cajas de fundición, placas de fondo para moldes, modelos para moldes y moldes para metal (excepto las lingoteras) cuando no están integradas a las actividades de fundición de metales. Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["24","Fabricación de productos metalúrgicos básicos"],"g":["243","Fundición de metales"],"o":""}},{"c":"2432","d":"Fundición de metales no ferrosos","b":true,"m":"El Usuario Industrial con Código CIIU 2432 cuya Actividad Económica Principal es Fundición de metales no ferrosos es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["Las actividades de talleres de fundición de metales no ferrosos, tales como: modelación, moldeado, fundición y colada, limpieza y acabados, tratamiento térmico del metal, entre otras actividades.","La fabricación de productos semiacabados y acabados a partir de la fundición de aluminio, magnesio, titanio, cinc, entre otros metales no ferrosos, y de la aleación de estos metales; la fabricación de piezas a partir de la fundición de metal de alta y baja densidad, y de piezas con geometrías complejas por medio de la técnica de micro-fundición."],"n":["Las actividades de talleres de fundición de metales no ferrosos y la fabricación de piezas fundidas en metales no ferrosos o aleaciones de estos metales (ej.: anillos, válvulas y pistones para motores). Se incluyen donde corresponda en cualquiera de las categorías descritas en las divisiones 25 a 32.","El tratamiento térmico de metales no ferrosos, cuando esta actividad no hace parte del proceso de fundición de estos metales y sus aleaciones. Se incluye en el código 2592, «Tratamiento y revestimiento de metales, mecanizado».","La fabricación de lingoteras. Se incluye en el código 2823, «Fabricación de maquinaria para la metalurgia ».","La fabricación de cajas de fundición, placas de fondo para moldes, modelos para moldes y moldes para metal (excepto las lingoteras) cuando no están integrados a las actividades de fundición de metales. Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["24","Fabricación de productos metalúrgicos básicos"],"g":["243","Fundición de metales"],"o":""}},{"c":"2511","d":"Fabricación de productos metálicos para uso estructural","b":true,"m":"El Usuario Industrial con Código CIIU 2511 cuya Actividad Económica Principal es Fabricación de productos metálicos para uso estructural es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de estructuras metálicas o armazones, partes de estructuras metálicas, elaboradas de acero y productos similares tales como puentes y secciones de puentes, torres, por ejemplo, para la extracción en pozos de minas, torres eléctricas, entre otros; columnas, vigas, andamiajes tubulares, armaduras, arcos, cabios, es decir, listones atravesados a las vigas para formar suelos y techos; castilletes para bocas de pozos, soportes telescópicos, compuertas de esclusas, muelles, espigones, es decir, construcciones metálicas muy corrientes en los puertos marítimos para protegerlos contra el oleaje.","La fabricación de edificaciones y componentes prefabricados principalmente de metal (ej.: casetas de obra, oficinas, bodegas, hangares, elementos modulares para exposiciones, entre otros).","La fabricación de puertas y ventana
