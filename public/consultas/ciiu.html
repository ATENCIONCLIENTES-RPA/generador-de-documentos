s para llantas.","La fabricación de tejidos utilizados para el tapizado interior de vehículos automotores y para cinturones de seguridad."],"n":["La fabricación de tapices para pisos. Se incluye en el código 1393, «Fabricación de tapetes y alfombras para pisos».","La fabricación de artículos textiles para uso técnico tales como tela para tamices, tela de filtración, entre otros. Se incluye en el código 1399, «Fabricación de otros artículos textiles n.c.p.».","La fabricación de maletas, maletines, morrales, tulas y similares de lona. Se incluyen en el código 1513, «Fabricación de artículos de viaje, bolsos de mano y artículos similares; artículos de talabartería y guarnicionería elaborados en otros materiales».","La fabricación de mantas eléctricas. Se incluye en el código 2750, «Fabricación de aparatos de uso doméstico»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["13","Fabricación de productos textiles"],"g":["139","Fabricación de otros productos textiles"],"o":""}},{"c":"1393","d":"Fabricación de tapetes y alfombras para pisos","b":true,"m":"El Usuario Industrial con Código CIIU 1393 cuya Actividad Económica Principal es Fabricación de tapetes y alfombras para pisos es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de productos textiles, en piezas o a la medida, para el cubrimiento de pisos, producidos mediante el tejido, afelpado, trenzado, tundido, punzado, entre otros, utilizando materiales textiles tales como hilados de lana, de algodón, de fibras artificiales o sintéticas, de yute, de fique, de fibras de coco (bonote), de sisal y de fibras similares: tapices, alfombras, esteras, tapetes y recuadros de moqueta.","La fabricación de cubrimiento de pisos de fieltro punzado."],"n":["La fabricación de gobelinos o flandes, cañamazo y tapicería de aguja de punto de cruz que se utiliza en decoración de interiores o para recubrir paredes. Se incluye en el código 1392, «Confección de artículos con materiales textiles, excepto prendas de vestir».","La fabricación de esteras, esterillas o persianas de materiales trenzables. Se incluye en el código 1690, «Fabricación de otros productos de madera; fabricación de artículos de corcho, cestería y espartería».","La fabricación de cubrimientos para pisos en corcho, caucho o plástico, aunque tengan base de material textil. Se incluye en el código CIIU 1690, «Fabricación de otros productos de madera; fabricación de artículos de corcho, cestería y espartería»; el código 2219, «Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.», o el código 2229, «Fabricación de artículos de plástico n.c.p.», según el caso.","La fabricación de linóleo u otros productos de superficie dura para el cubrimiento de pisos. Se incluye en el código CIIU 2229, «Fabricación de artículos de plástico n.c.p.»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["13","Fabricación de productos textiles"],"g":["139","Fabricación de otros productos textiles"],"o":""}},{"c":"1394","d":"Fabricación de cuerdas, cordeles, cables, bramantes y redes","b":true,"m":"El Usuario Industrial con Código CIIU 1394 cuya Actividad Económica Principal es Fabricación de cuerdas, cordeles, cables, bramantes y redes es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de cuerdas, cordeles, cables, sogas, bramantes y artículos de hilados de fibras textiles, cintas o similares, estén impregnados o no, revestidos, cubiertos o forrados con caucho o plástico.","La fabricación de redes o mallas anudadas de cuerdas, cordeles y bramantes.","La fabricación de productos de cuerda o red tales como las redes de pesca, defensas para embarcaciones, cojines para descarga, eslingas, cuerdas y maromas con aros metálicos, las redes para deporte, cordones, mechas para traperos y artículos similares.","La confección de hamacas."],"n":["La fabricación de cordones para el calzado con los extremos rematados. Se incluye en el código 1399, «Fabricación de otros artículos textiles n.c.p.».","La fabricación de productos y artículos textiles para usos técnicos como mecha de materiales textiles. Se incluye en el código 1399, «Fabricación de otros artículos textiles n.c.p.».","La fabricación de redecillas para el cabello. Se incluye en el código 1410, «Confección de prendas de vestir, excepto prendas de piel».","La fabricación de cables metálicos. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["13","Fabricación de productos textiles"],"g":["139","Fabricación de otros productos textiles"],"o":""}},{"c":"1399","d":"Fabricación de otros artículos textiles n.c.p.","b":true,"m":"El Usuario Industrial con Código CIIU 1399 cuya Actividad Económica Principal es Fabricación de otros artículos textiles n.c.p. es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["Todas las actividades relacionadas con textiles o productos textiles, no especificadas en las divisiones: 13 «Fabricación de productos textiles»; 14 «Confección de prendas de vestir», y 15, «Curtido y recurtido de cueros; fabricación de calzado; fabricación de artículos de viaje, maletas, bolsos de mano y artículos similares, y fabricación de artículos de talabartería y guarnicionería; adobo y teñido de pieles».","Comprende la fabricación de artículos, tales como: tejidos estrechos, incluso los de urdimbre sin trama, de hilos o de fibras paralelas sujetos por una sustancia adhesiva, los procesos de acabado integrados con la fabricación de tejidos estrechos y tejidos especiales. Marbetes, insignias, escudos, etiquetas y artículos similares no bordados de materias textiles.","La fabricación de accesorios textiles para automotores.","La fabricación de cinta-tejido sensible a la presión (velcro).","La fabricación de cordones para el calzado con los extremos rematados.","La fabricación de artículos de pasamanería: trencillas, borlas, guantes, madroños y artículos similares.","La fabricación de tules y otros tejidos de mallas anudadas, de encajes y bordados, en piezas, tiras y motivos decorativos.","La fabricación de tejidos de red y del tipo que se utiliza para la confección de visillos de encaje tricotado en máquinas.","La fabricación de fieltro, incluso fieltros impregnados, bañados, recubiertos o laminados, y otros textiles no tejidos, incluso aquellos en que el plástico o el caucho son las sustancias adhesivas pero no la principal materia prima constitutiva.","La fabricación de tejidos impregnados, bañados, recubiertos o laminados con plástico.","La fabricación de hilados metalizados e hilados entorchados; hilos y cuerdas de caucho revestidos de materias textiles; hilados y bandas textiles recubiertos, impregnados, bañados o forrados con caucho o materias plásticas.","La fabricación de tejidos de hilados manufacturados de gran resistencia para cuerdas o lonas para llantas.","La fabricación de otros tejidos tratados o bañados: papel tela, lienzos preparados para pintores, bocací y tejidos endurecidos similares, tejidos bañados con goma o sustancias amiláceas.","La fabricación de artículos confeccionados de materiales textiles a partir de tejidos de producción propia comprendidos en esta clase.","La fabricación de aplicadores para cosméticos de material textil.","La fabricación de guata utilizada en acolchados y prendas de vestir.","La fabricación de artículos textiles diversos: mechas de materiales textiles, camisas para mecheros de gas incandescentes y tejidos tubulares para su fabricación, mangueras, correas transportadoras y de transmisión (estén o no reforzados con metal u otros materiales), y otros productos y artículos textiles para uso técnico, tales como: tela para tamices, tela de filtración, tejidos y fieltros utilizados en la fabricación de papel, y otros tejidos especiales como geotextiles."],"n":["La fabricación de sacos (bolsas) y talegos, para envases o empaques de cualquier material textil. Se incluye en el código 1392 «Confección de artículos con materiales textiles, excepto prendas de vestir».","La fabricación de fieltro punzado para el cubrimiento de pisos. Se incluye en el código 1393 «Fabricación de tapetes y alfombras para pisos».","La fabricación de guata de celulosa. Se incluye en el código 1701 «Fabricación de pulpas (pastas) celulósicas; papel y cartón».","La fabricación de guata de materiales textiles y los artículos de guata de materiales textiles, como los utilizados para fabricar tampones, toallas higiénicas y pañales desechables, elaborados principalmente con telas sin tejer o sin trama. Se incluyen en el código 1709 «Fabricación de otros artículos de papel y cartón».","La fabricación de correas transportadoras y de transmisión, de tejidos y de hilados o hilos impregnados, bañados, recubiertos o laminados con caucho, si el caucho es la principal materia prima. Se incluye en el código 2219 «Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.».","La fabricación de placas, planchas, láminas, cintas de caucho celular o de plástico celular, combinadas con material textil que se utiliza solo como material de refuerzo. Se incluyen en el código CIIU 2219 «Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.» y el código 2221 «Fabricación de formas básicas de plástico», según sea el caso.","La fabricación de tela hecha con hilos metálicos. Se incluye en el código 2599 «Fabricación de otros productos elaborados de metal n.c.p.»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["13","Fabricación de productos textiles"],"g":["139","Fabricación de otros productos textiles"],"o":""}},{"c":"1410","d":"Confección de prendas de vestir, excepto prendas de piel","b":true,"m":"El Usuario Industrial con Código CIIU 1410 cuya Actividad Económica Principal es Confección de prendas de vestir, excepto prendas de piel es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La confección de prendas de vestir. Los materiales pueden ser de todo tipo (excepto pieles finas a excepción de las utilizadas para fabricar sombreros y gorros) como telas, telas no tejidas, telas plastificadas, tejidos elásticos, encajes, cuero natural o artificial, materiales trenzables, entre otros. Estos materiales pueden estar bañados, impregnados o encauchados. En principio, el material se corta en piezas que luego se empalman mediante costura.","Se incluyen tanto las labores ordinarias de producción, como aquellas realizadas por contrata.","La confección de prendas de vestir sobre medidas y/o en serie.","La confección de prendas de vestir de cuero o cuero regenerado, incluido el cuero utilizado para la confección de accesorios de trabajo industriales, tales como los protectores de cuero para soldar.","La confección de ropa de trabajo.","La confección de otras prendas de vestir y artículos en tejido de punto y ganchillo, cuando son fabricados con telas o hilados, de telas no tejidas, entre otros, para mujeres hombres y niños: abrigos, trajes, conjuntos, chaquetas, pantalones, faldas, entre otros.","La confección de ropa interior y ropa de dormir de telas tejidas, de punto y ganchillo, de encaje, entre otros, para hombres, mujeres y niños: camisas, camisetas, calzones, calzoncillos, pijamas, camisones, batas, blusas, combinaciones, sujetadores, entre otros.","La confección de ropa de bebé.","Las sudaderas, vestidos de baño, trajes para practicar deporte, trajes para esquiar, entre otros.","La fabricación de sombreros y gorros, incluso de piel.","La confección de otros accesorios de vestir, guantes, cinturones, chales, corbatas, corbatines, redecillas para el cabello, artículos de tocado de peletería (cuero), entre otros.","La confección de chalecos antibalas especiales para dama y para caballero.","La confección de tapabocas; fajas y corsés no ortésicos.","La fabricación de calzado de material textil sin aplicación de suelas.","La confección de partes de los productos mencionados.","La fabricación de prendas de vestir adornadas con piel."],"n":["La confección de prendas de vestir de piel (excepto artículos de tocado, tales como sombreros, gorros, entre otros). Se incluyen en el código 1420 «Fabricación de artículos de piel».","La manufactura de prendas en tejidos de punto y ganchillo directamente en su forma. Se incluye en el código 1430 «Fabricación de artículos de punto y ganchillo».","La fabricación de calzado. Se incluye en el grupo 152 «Fabricación de calzado».","La fabricación de prendas de vestir de caucho o plástico cuyas piezas se unen por adhesión y no por costura. Se incluyen en el código 2219 «Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.» y el código 2229 «Fabricación de artículos de plástico n.c.p.», respectivamente.","La fabricación de guantes y gorros de cuero, cascos y demás accesorios para practicar deportes (rodilleras, musleras, entre otros). Se incluye en el código 3230 «Fabricación de artículos y equipo para la práctica del deporte».","La fabricación de fajas, corsés y similares para fines ortésicos. Se incluye en el código 3250 «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","La fabricación de cascos de seguridad. Se incluye en el código 3290 «Otras industrias manufactureras n.c.p.».","La confección de prendas de vestir y cubrecabezas de asbesto. Se incluyen en el código 2399 «Fabricación de otros productos minerales no metálicos n.c.p.».","El arreglo de prendas de vestir. Se incluye en el código 9529 «Mantenimiento y reparación de otros efectos personales y enseres domésticos».","La fabricación de ropa ignífuga y otras prendas de protección que no sean de asbesto. Se incluye en el código 3290 «Otras industrias manufactureras n.c.p.»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["14","Confección de prendas de vestir"],"g":["141","Confección de prendas de vestir, excepto prendas de piel"],"o":""}},{"c":"1420","d":"Fabricación de artículos de piel","b":true,"m":"El Usuario Industrial con Código CIIU 1420 cuya Actividad Económica Principal es Fabricación de artículos de piel es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de artículos de piel: prendas de vestir y accesorios de piel (excepto gorros, sombreros, entre otros); artículos de piel confeccionados con pieles alargadas, planchas, cuadrados, tiras, hojas que contienen cuero o fibras de cuero, entre otros; artículos diversos de piel: alfombras, pufs sin relleno y paños para pulimento industrial.","La fabricación de pieles artificiales y de artículos confeccionados con estas pieles."],"n":["La producción de pieles finas sin curtir. Se incluye en los grupos 014, «Ganadería», y 017, «Caza ordinaria y mediante trampas y actividades de servicio conexas».","La producción de pieles y cueros sin curtir. Se incluye en el código 1011, «Procesamiento y conservación de carne y productos cárnicos».","La producción de pieles de imitación, telas de pelo largo obtenidas mediante la tejeduría ordinaria y de punto. Se incluye en el código 1312, «Tejeduría de productos textiles», o en el código 1391, «Fabricación de tejidos de punto y ganchillo», respectivamente.","La fabricación de sombreros o partes de sombreros de piel y la confección de prendas de vestir forradas o adornadas en piel. Se incluyen en el código 1410, «Confección de prendas de vestir, excepto prendas de piel».","La fabricación de prendas de vestir adornadas con piel. Se incluye en el código CIIU 1410, «Confección de prendas de vestir, excepto prendas de piel».","El adobo o recurtido y teñido de pieles. Se incluye en el código 1511, «Curtido y recurtido de cueros; recurtido y teñido de pieles».","La fabricación de botas o zapatos con partes de piel. Se incluye en el código 1521, «Fabricación de calzado de cuero y piel, con cualquier tipo de suela»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["14","Confección de prendas de vestir"],"g":["142","Fabricación de artículos de piel"],"o":""}},{"c":"1430","d":"Fabricación de artículos de punto y ganchillo","b":true,"m":"El Usuario Industrial con Código CIIU 1430 cuya Actividad Económica Principal es Fabricación de artículos de punto y ganchillo es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de «panty-medias», leotardos (trusas), medias, calcetines y demás artículos de calcetería, incluso de compresión progresiva (por ejemplo, medias para várices), de punto. Normalmente estos artículos se tejen directamente en su forma.","La fabricación de jerséis, suéteres, chalecos y artículos análogos de punto y ganchillo.","La fabricación de escarpines y similares, sin suela aplicada."],"n":["La fabricación de tejidos de punto o ganchillo. Se incluyen en el código 1391,«Fabricación de tejidos de punto y ganchillo».","La confección de prendas de vestir a partir de telas de punto y ganchillo. Se incluye en el código 1410, «Confección de prendas de vestir, excepto prendas de piel».","La confección de artículos para el hogar con materiales textiles. Se incluye en el código 1392, «Confección de artículos con materiales textiles, excepto prendas de vestir»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["14","Confección de prendas de vestir"],"g":["143","Fabricación de artículos de punto y ganchillo"],"o":""}},{"c":"1511","d":"Curtido y recurtido de cueros; recurtido y teñido de pieles","b":true,"m":"El Usuario Industrial con Código CIIU 1511 cuya Actividad Económica Principal es Curtido y recurtido de cueros; recurtido y teñido de pieles es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["El recurtido y teñido de pieles finas, cueros y pieles sin depilar, incluye las operaciones tales como: descarnadura (extracción de grasa y tejidos subcutáneos), raspado (igualar la piel por proceso de cepillado del lado de la carne), curtido, recurtido, engrase, blanqueado, esquilado (corte), depilado y teñido de pieles y cueros con pelo.","La producción de cueros curtidos (cueros imputrescibles) y adobados o recurtido (cueros con procesos más allá del curtido con excepción del engrasado); el curtido puede ser vegetal, mineral o químico al cromo.","La fabricación de cueros gamuzados, apergaminados, charolados, metalizados, grabados.","La fabricación de cueros regenerados."],"n":["La producción de pieles y cueros sin curtir como parte de las actividades ganaderas. Se incluye en el grupo 014, «Ganadería».","La producción de pieles y cueros en verde (sin curtir) como parte de las actividades de las plantas de beneficio animal. Se incluye en el código 1011, «Procesamiento y conservación de carne y productos cárnicos».","La confección de prendas de vestir de cuero. Se incluye en el código 1410, «Confección de prendas de vestir, excepto prendas de piel».","La fabricación de cuero de imitación a partir de productos distintos del cuero natural. Se incluye en el código 1312, «Tejeduría de productos textiles».","La fabricación de otros artículos de cuero como juguetes caninos de carnaza. Se incluye en el código 1512, «Fabricación de artículos de viaje, bolsos de mano y artículos similares elaborados en cuero, y fabricación de artículos de talabartería y guarnicionería»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["15","Curtido y recurtido de cueros; fabricación de calzado; fabricación de artículos de viaje, maletas, bolsos de mano y artículos similares, y fabricación de artículos de talabartería y guarnicionería; adobo y teñido de pieles"],"g":["151","Curtido y recurtido de cueros; fabricación de artículos de viaje, bolsos de mano y artículos similares, y fabricación de artículos de talabartería y guarnicionería, adobo y teñido de pieles"],"o":""}},{"c":"1512","d":"Fabricación de artículos de viaje, bolsos de mano y artículos similares elaborados en cuero, y fabricación de artículos de talabartería y guarnicionería","b":true,"m":"El Usuario Industrial con Código CIIU 1512 cuya Actividad Económica Principal es Fabricación de artículos de viaje, bolsos de mano y artículos similares elaborados en cuero, y fabricación de artículos de talabartería y guarnicionería es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de artículos de viaje, maletas, morrales, bolsos de mano, carteras y similares, de cuero, y cuero regenerado; elaboración de artículos de talabartería (artículos en cuero) y guarnicionería (por ejemplo: artículos para caballería como monturas y arneses de equitación), además otros artículos de cuero natural, cuero regenerado o combinaciones de estos con otros materiales, siempre que el material básico sea el cuero.","La fabricación de maletines, maletas escolares, confeccionados en cuero natural o recuperado, o combinaciones de estos con otros materiales, siempre que la materia constitutiva básica sea el cuero.","La fabricación de otros artículos de cuero, como juguetes caninos de carnaza.","Fabricación de correas de reloj no metálicas en cuero natural o cuero regenerado.","La fabricación de artículos diversos de cuero o cuero regenerado: correas de transmisión, embalajes, entre otros.","Fabricación de cordones de cuero para zapatos.","La fabricación de látigos y fustas (barra delgada y flexible para dirigir el caballo) en cuero.","Fabricación de tiros, frenos, estribos, hebillas, traíllas, rodilleras, bozales, abrigos para perros y artículos similares para animales."],"n":["La confección de prendas de vestir de cuero. Se incluye en el código 1410, «Confección de prendas de vestir, excepto prendas de piel».","La confección de guantes y sombreros de cuero. Se incluye en el código CIIU 1410, «Confección de prendas de vestir, excepto prendas de piel».","La fabricación de calzado de cuero. Se incluye en el código 1521, «Fabricación de calzado de cuero y piel, con cualquier tipo de suela».","La fabricación de sillines en cuero para bicicletas. Se incluye en el código 3092, «Fabricación de bicicletas y de sillas de ruedas para personas con discapacidad».","La fabricación de correas de reloj de metales preciosos y correas de reloj de metales no preciosos. Se incluye en el código 3210, «Fabricación de joyas, bisutería y artículos conexos».","La fabricación de cinturones de seguridad en cuero natural, artificial o regenerado para reparadores de líneas y otros cinturones de uso industrial en cuero. Se incluye en el código 3290, «Otras industrias manufactureras n.c.p.»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["15","Curtido y recurtido de cueros; fabricación de calzado; fabricación de artículos de viaje, maletas, bolsos de mano y artículos similares, y fabricación de artículos de talabartería y guarnicionería; adobo y teñido de pieles"],"g":["151","Curtido y recurtido de cueros; fabricación de artículos de viaje, bolsos de mano y artículos similares, y fabricación de artículos de talabartería y guarnicionería, adobo y teñido de pieles"],"o":""}},{"c":"1513","d":"Fabricación de artículos de viaje, bolsos de mano y artículos similares; artículos de talabartería y guarnicionería elaborados en otros materiales","b":true,"m":"El Usuario Industrial con Código CIIU 1513 cuya Actividad Económica Principal es Fabricación de artículos de viaje, bolsos de mano y artículos similares; artículos de talabartería y guarnicionería elaborados en otros materiales es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de maletas, maletines, morrales, bolsos de mano y artículos similares, así como artículos de talabartería y guarnicionería confeccionados con cualquier tipo de material, excepto el cuero; por ejemplo: madera, plástico, materiales sintéticos e imitaciones de cuero, o combinaciones de estos con otros materiales, textiles, fibras vulcanizadas, entre otros, siempre y cuando se use la misma tecnología que en el caso del cuero.","La fabricación de correas para reloj no metálicas en materiales textiles, plástico, sintéticos, entre otros."],"n":["La fabricación de sillines para bicicletas en materiales sintéticos, plásticos e imitaciones de cuero. Se incluye en el código 3092, «Fabricación de bicicletas y de sillas de ruedas para personas con discapacidad».","La fabricación de correas de reloj de metales preciosos y correas de reloj de metales no preciosos. Se incluye en el código 3210, «Fabricación de joyas, bisutería y artículos conexos».","La fabricación de cinturones de seguridad para reparadores de líneas y otros cinturones de uso industrial. Se incluyen en el código 3290, «Otras industrias manufactureras n.c.p.».","La fabricación de maletas, morrales, bolsos de mano y artículos similares confeccionados en cuero. Se incluye en el código 1512, «Fabricación de artículos de viaje, bolsos de mano y artículos similares elaborados en cuero, y fabricación de artículos de talabartería y guarnicionería»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["15","Curtido y recurtido de cueros; fabricación de calzado; fabricación de artículos de viaje, maletas, bolsos de mano y artículos similares, y fabricación de artículos de talabartería y guarnicionería; adobo y teñido de pieles"],"g":["151","Curtido y recurtido de cueros; fabricación de artículos de viaje, bolsos de mano y artículos similares, y fabricación de artículos de talabartería y guarnicionería, adobo y teñido de pieles"],"o":""}},{"c":"1521","d":"Fabricación de calzado de cuero y piel, con cualquier tipo de suela","b":true,"m":"El Usuario Industrial con Código CIIU 1521 cuya Actividad Económica Principal es Fabricación de calzado de cuero y piel, con cualquier tipo de suela es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de calzado de cuero y piel con cualquier tipo de suela, y fabricado mediante procesos tales como corte, costura, montaje, engomado, etc.","La fabricación de botas o zapatos con partes de piel.","La fabricación de botines, polainas y artículos similares, de cuero o piel, con cualquier tipo de suela.","La fabricación de calzado deportivo o casual y el especializado para la práctica de deportes, elaborado en cuero."],"n":["La fabricación de otros tipos de calzado independientemente de la materia constitutiva y mediante procesos tales como corte, costura, montaje, engomado, etc. Se incluye en el código 1522, «Fabricación de otros tipos de calzado, excepto calzado de cuero y piel».","La fabricación de partes del calzado. Se incluye en el código 1523, «Fabricación de partes del calzado».","La obtención del cuero recuperado a partir de retales de cuero, para utilizarlo en la fabricación del calzado. Se incluye en la el código 3830, «Recuperación de materiales»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["15","Curtido y recurtido de cueros; fabricación de calzado; fabricación de artículos de viaje, maletas, bolsos de mano y artículos similares, y fabricación de artículos de talabartería y guarnicionería; adobo y teñido de pieles"],"g":["152","Fabricación de calzado"],"o":""}},{"c":"1522","d":"Fabricación de otros tipos de calzado, excepto calzado de cuero y piel","b":true,"m":"El Usuario Industrial con Código CIIU 1522 cuya Actividad Económica Principal es Fabricación de otros tipos de calzado, excepto calzado de cuero y piel es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de calzado para todo uso (excepto el calzado ortopédico), de cualquier material excepto de cuero y piel, de asbesto y de otro material textil sin aplicación de suelas.","Las materias primas utilizadas pueden ser: caucho, plástico, materiales textiles, madera o combinación de estos y otros materiales. Se pueden emplear en la fabricación de procesos como corte y costura de las piezas, engomado, moldeado o cualquier otro proceso.","La fabricación de calzado deportivo o casual y el especializado para la práctica de deportes, elaborado en otros materiales textiles."],"n":["La fabricación de calzado de cuero. Se incluye en el código 1521, «Fabricación de calzado de cuero y piel, con cualquier tipo de suela».","La fabricación de calzado ortopédico. Se incluye en el código 3250, «Fabricación de instrumentos, aparatos y materiales médicos y odontológicos (incluido mobiliario)».","La fabricación de calzado de asbesto. Se incluye en el código 2399, «Fabricación de otros productos minerales no metálicos n.c.p.».","La fabricación de calzado de material textil sin suela aplicada. Se incluye en el código 1410, «Confección de prendas de vestir, excepto prendas de piel».","El calzado con patines o esquís fijos, y otros tipos de calzado especializado para la práctica del deporte no contemplados en esta clase. Se incluye en el código 3230, «Fabricación de artículos y equipo para la práctica del deporte».","El calzado que tenga características de juguete. Se incluye en el código 3240, «Fabricación de juegos, juguetes y rompecabezas».","La fabricación de escarpines y similares, sin suela aplicada. Se incluye en la el código 1430, «Fabricación de artículos de punto y ganchillo»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["15","Curtido y recurtido de cueros; fabricación de calzado; fabricación de artículos de viaje, maletas, bolsos de mano y artículos similares, y fabricación de artículos de talabartería y guarnicionería; adobo y teñido de pieles"],"g":["152","Fabricación de calzado"],"o":""}},{"c":"1523","d":"Fabricación de partes del calzado","b":true,"m":"El Usuario Industrial con Código CIIU 1523 cuya Actividad Económica Principal es Fabricación de partes del calzado es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de partes del calzado, tales como capelladas, punteras, contrafuertes, plantillas, suelas, tacones, tapas, etc., de cuero, madera, plástico, caucho, metal y material textil."],"n":["N/A"],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["15","Curtido y recurtido de cueros; fabricación de calzado; fabricación de artículos de viaje, maletas, bolsos de mano y artículos similares, y fabricación de artículos de talabartería y guarnicionería; adobo y teñido de pieles"],"g":["152","Fabricación de calzado"],"o":""}},{"c":"1610","d":"Aserrado, acepillado e impregnación de la madera","b":true,"m":"El Usuario Industrial con Código CIIU 1610 cuya Actividad Económica Principal es Aserrado, acepillado e impregnación de la madera es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["Las actividades de los aserraderos (industrias de primera transformación de la madera que provee una segunda industria de transformación como carpintería, ebanistería, construcción, etc.) y plantas acepilladoras (lugar en donde se labra con cepillo la madera), sean o no móviles, en bosques y otros lugares.","El aserrado de madera en bruto constituida por troncos y trozas y aserrado de trozas escuadradas y costeras para producir maderos.","La acepilladura y aserrado, en combinación o por separado, para producir troncos y maderos desbastados, y piezas o cortes corrientes.","La transformación de madera rebanada o desenrollada de un espesor mayor al que se utiliza en los tableros contrachapados.","El tableado, descortezado y desmenuzado de troncos.","La impregnación y el tratamiento químico de la madera con preservativos y otras sustancias inmunizantes (productos concentrados hidrosolubles, diseñados para la protección de madera aserrada contra hongos e insectos).","La fabricación de lana de madera, harina de madera, astillas y partículas de madera, cuando consisten en una actividad primaria.","La fabricación de tabletas para la ensambladura de pisos de madera, incluso para los pisos de parqué.","La fabricación de traviesas de madera (durmientes) para vías férreas.","El secado de la madera."],"n":["La extracción y transformación de madera en bruto (descortezada y simplemente escuadrada). Se incluyen en el código 0220, «Extracción de madera».","La fabricación de hojas de madera para enchapado, suficientemente delgadas para producir madera contrachapada, tableros y paneles. Se incluye en el código 1620, «Fabricación de hojas de madera para enchapado; fabricación de tableros contrachapados, tableros laminados, tableros de partículas y otros tableros y paneles».","La fabricación de tejas, ripias, doseles y artículos similares de madera. Se incluye en el código 1630, «Fabricación de partes y piezas de madera, de carpintería y ebanistería para la construcción».","La fabricación de tableros y paneles ensamblados para pisos de madera (duelas), incluso para los pisos de parqué. Se incluye en el código CIIU 1630, «Fabricación de partes y piezas de madera, de carpintería y ebanistería para la construcción»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["16","Transformación de la madera y fabricación de productos de madera y de corcho, excepto muebles; fabricación de artículos de cestería y espartería"],"g":["161","Aserrado, acepillado e impregnación de la madera"],"o":""}},{"c":"1620","d":"Fabricación de hojas de madera para enchapado; fabricación de tableros contrachapados, tableros laminados, tableros de partículas y otros tableros y paneles","b":true,"m":"El Usuario Industrial con Código CIIU 1620 cuya Actividad Económica Principal es Fabricación de hojas de madera para enchapado; fabricación de tableros contrachapados, tableros laminados, tableros de partículas y otros tableros y paneles es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de hojas de madera para enchapado, suficientemente delgadas para producir madera enchapada, tableros y paneles contrachapados y para otros fines. Las hojas pueden obtenerse mediante aserrado, rebanado y desenrollo (mondadura), y pueden estar alisadas, teñidas, bañadas, impregnadas, reforzadas sobre una cara con papel o tela, o cortadas de manera que conforman un motivo decorativo.","La producción de madera aglomerada.","La fabricación de tableros contrachapados, tableros de madera enchapada y otros productos similares de madera laminada, y la fabricación de tableros de partículas y de fibra. La fabricación de estos productos se caracteriza por la utilización de prensas de alta presión y, a veces, por el uso de colas (encolada).","La fabricación de madera laminada para enchapado.","La fabricación de madera compactada."],"n":["La fabricación de madera rebanada o desenrollada de un espesor mayor que la que se utiliza para producir madera enchapada y tableros contrachapados. Se incluye en el código 1610, «Aserrado, acepillado e impregnación de la madera»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["16","Transformación de la madera y fabricación de productos de madera y de corcho, excepto muebles; fabricación de artículos de cestería y espartería"],"g":["162","Fabricación de hojas de madera para enchapado; fabricación de tableros contrachapados, tableros laminados, tableros de partículas y otros tableros y paneles"],"o":""}},{"c":"1630","d":"Fabricación de partes y piezas de madera, de carpintería y ebanistería para la construcción","b":true,"m":"El Usuario Industrial con Código CIIU 1630 cuya Actividad Económica Principal es Fabricación de partes y piezas de madera, de carpintería y ebanistería para la construcción es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de productos de madera utilizados principalmente en la industria de la construcción, como: maderaje, incluso vigas, cabios, jabalcones, tabiques (excepto los auto-estables) y productos similares que se utilizan con fines estructurales y en el sostenimiento de vanos, andamios y otras construcciones provisionales.","Las partes y piezas de carpintería: puertas, ventanas, contraventanas y sus marcos, con o sin herrajes como bisagras, cerraduras, entre otros; escaleras, marquesinas, barandales, entre otros; bloques, listones, entre otros, ensamblados en tableros o paneles para pisos de madera, incluso los de parqué.","Los doseles y molduras de madera, tabletas, tejas y ripias.","Los tableros de madera celular, artesonados, armarios empotrados y artículos que formen parte de la estructura.","La fabricación de piezas ensambladas o no que claramente hacen parte de estos productos, así como la instalación de partes o piezas de carpintería.","La fabricación de casas y/o edificios prefabricados, o de elementos similares constitutivos principalmente de madera.","La fabricación de armazones de madera laminadas, encoladas y armazones de madera prefabricados con uniones de metal.","La fabricación de divisiones de madera de carácter fijo."],"n":["La fabricación de tablas y paneles para pisos de madera y de parqué no ensamblados. Se incluye en el código 1610, «Aserrado, acepillado e impregnación de la madera».","La fabricación de persianas venecianas, artículos de moblaje del tipo aplique, como percheros para ropa y sombreros y para empotrar, como armarios de cocina y bibliotecas, pero no muebles en pie. Se incluye en el código 1690, «Fabricación de otros productos de madera; fabricación de artículos de corcho, cestería y espartería».","La construcción de edificaciones prefabricadas principalmente de metal. Se incluye en el código 2511, «Fabricación de productos metálicos para uso estructural».","La fabricación de divisiones de madera de carácter removible. Se incluye en el código 3110, «Fabricación de muebles»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["16","Transformación de la madera y fabricación de productos de madera y de corcho, excepto muebles; fabricación de artículos de cestería y espartería"],"g":["163","Fabricación de partes y piezas de madera, de carpintería y ebanistería para la construcción"],"o":""}},{"c":"1640","d":"Fabricación de recipientes de madera","b":true,"m":"El Usuario Industrial con Código CIIU 1640 cuya Actividad Económica Principal es Fabricación de recipientes de madera es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de cajas, cajones, jaulas, barriles y recipientes similares de madera, carretes de madera, paletas-caja y otras bandejas de madera para operaciones de carga; fabricación de toneles, barricas, cubas, tinas y otros productos de tonelería de madera incluidas las partes de esos productos. Por ejemplo, duelas de madera, así como las demás piezas de madera, acabadas o sin acabar, pero reconocibles como partes de manufacturas de tonelería, tales como las tapas y los zunchos de madera de longitud determinada con entalladuras de ensamblado en los extremos."],"n":["La fabricación de maletas de madera. Se incluye en el código 1513, «Fabricación de artículos de viaje, bolsos de mano y artículos similares; artículos de talabartería y guarnicionería elaborados en otros materiales».","La fabricación de baúles de madera no revestidos con otro material. Se incluye en el código 1690, «Fabricación de otros productos de madera; fabricación de artículos de corcho, cestería y espartería».","La fabricación de cestos y recipientes de materiales trenzables. Se incluye en el código CIIU 1690, «Fabricación de otros productos de madera; fabricación de artículos de corcho, cestería y espartería»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["16","Transformación de la madera y fabricación de productos de madera y de corcho, excepto muebles; fabricación de artículos de cestería y espartería"],"g":["164","Fabricación de recipientes de madera"],"o":""}},{"c":"1690","d":"Fabricación de otros productos de madera; fabricación de artículos de corcho, cestería y espartería","b":true,"m":"El Usuario Industrial con Código CIIU 1690 cuya Actividad Económica Principal es Fabricación de otros productos de madera; fabricación de artículos de corcho, cestería y espartería es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de productos de madera no clasificados en otra parte, tales como: herramientas; monturas y mangos de cepillos; escobas; paraguas; bastones y similares; estatuillas y otros objetos ornamentales en madera; perchas para ropa; artículos de marquetería (ej.: marcos de madera para espejos y fotos) y taracea; baúles; joyeros; estuches para cubertería y artículos similares; utensilios de cocina y para uso doméstico; persianas venecianas; mobiliario del tipo aplique como percheros para ropa y sombreros y para empotrar como armarios para cocina y bibliotecas, pero que no se consideran como muebles en pie.","La fabricación de hormas y tensores de madera para zapatos y botas.","La fabricación de tapas, canillas, bobinas, carretes y artículos similares de madera torneada utilizados para el enrollado de hilos y alambres.","La fabricación de otros artículos de madera no clasificados en otra parte.","La elaboración de corcho natural para obtener productos, tales como corcho descortezado, toscamente escuadrado o en forma de bloques, hojas, planchas o tiras. Fabricación de corcho aglomerado. Fabricación de artículos de corcho natural o aglomerado tales como cubrimiento de pisos.","La fabricación de trenzas o artículos similares de materiales trenzables. Fabricación de productos similares unidos en ramales paralelos o tejidos entre sí en formas planas.","La fabricación de esteras, esterillas o persianas de materiales trenzables.","La fabricación de cestos, artículos de mimbre y otros artículos de materiales trenzables o con cintas, ramales o trenzas.","La elaboración de bastidores para lienzos de artistas.","La fabricación de bloques para la elaboración de pipas de cigarro y productos similares de madera.","La fabricación de herramientas mecánicas simples de medición elaboradas en madera.","La fabricación de troncos de chimenea hechos de madera prensada o de otros materiales prensados, como moleduras de café o de habas de soja."],"n":["La fabricación de esteras o esterillas de materias textiles. Se incluye en el código 1393 «Fabricación de tapetes y alfombras para pisos».","La fabricación de maletas de madera. Se incluye en el código 1513 «Fabricación de artículos de viaje, bolsos de mano y artículos similares; artículos de talabartería y guarnicionería elaborados en otros materiales».","La fabricación de calzado de madera. Se incluye en el código 1522 «Fabricación de otros tipos de calzado, excepto calzado de cuero y piel».","La fabricación de partes calzado de madera. Se incluye en el código 1523 «Fabricación de partes de calzado».","La fabricación de fósforos (cerillas). Se incluye en el código 2029 «Fabricación de otros productos químicos n.c.p.».","La fabricación de cajas para aparatos de relojería. Se incluye en el código 2652 «Fabricación de relojes».","La fabricación de lámparas y accesorios para iluminación. Se incluye en el código 2740 «Fabricación de equipos eléctricos de iluminación».","La fabricación de carretes y bobinas que forman parte de maquinaria textil. Se incluye en el código 2826 «Fabricación de maquinaria para la elaboración de productos textiles, prendas de vestir y cueros».","La fabricación de muebles. Se incluye en el código 3110 «Fabricación de muebles».","La fabricación de joyas de fantasía. Se incluye en el código 3210 «Fabricación de joyas, bisutería y artículos conexos».","La fabricación de juguetes de madera. Se incluye en el código 3240 «Fabricación de juegos, juguetes y rompecabezas».","La fabricación de cepillos y escobas. Se incluye en el código 3290 «Otras industrias manufactureras n.c.p.».","La fabricación de flotadores (salvavidas) de corcho. Se incluye en el código CIIU 3290 «Otras industrias manufactureras n.c.p.».","La fabricación de ataúdes. Se incluye en el código 3290 «Otras industrias manufactureras n.c.p.».","Las actividades de las marqueterías, que son establecimientos dedicados a la enmarcación de cuadros y otros. Se incluyen en el código 4752 «Comercio al por menor de artículos de ferretería, pinturas y productos de vidrio en establecimientos especializados»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["16","Transformación de la madera y fabricación de productos de madera y de corcho, excepto muebles; fabricación de artículos de cestería y espartería"],"g":["169","Fabricación de otros productos de madera; fabricación de artículos de corcho, cestería y espartería"],"o":""}},{"c":"1701","d":"Fabricación de pulpas (pastas) celulósicas; papel y cartón","b":true,"m":"El Usuario Industrial con Código CIIU 1701 cuya Actividad Económica Principal es Fabricación de pulpas (pastas) celulósicas; papel y cartón es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de pulpa (pasta) de madera: mecánica, química (soluble o no soluble, blanqueada, semi-blanqueada o sin blanquear) y semi-química.","La fabricación de pasta a partir de borra (pelusa) de algodón y de otras materias celulósicas fibrosas mediante procesos mecánicos, químicos o semi-químicos.","La eliminación de tinta y fabricación de pasta a partir de desechos de papel o cartón, trapos, bagazo, etc.","La fabricación de guata de celulosa y materiales de fibras de celulosa, excepto guata de materiales textiles.","La fabricación de papel y cartón no acondicionados para la venta al por menor.","La fabricación de papel y cartón no cuché y sin revestir.","La fabricación de papel y cartón cuché (couché, estucado, esmaltado o satinado), o papel de impresión cubierto con una capa de caolín, en rollos o en hojas.","La fabricación de papel periódico y de otros papeles para imprimir o escribir.","La fabricación de rollos continuos para la fabricación de papel higiénico, papel facial, servilletas, pañuelos y papeles similares para aseo personal.","La fabricación de papel para cigarrillos.","La fabricación de papel y cartón en rollos, sin revestir.","La fabricación de papel Kraft rizado o plegado para la elaboración de sacos, bolsas y similares.","La fabricación de papel semi-químico para acanalar, papel paja y demás papeles para acanalar.","La fabricación de papeles y cartones sulfurizados (pergamino vegetal); de papeles impermeables a la grasa, de papeles para calcar o glaseados, transparentes o translúcidos; de papel y cartón multilaminar.","La fabricación de papeles y cartones formados hoja por hoja (papel hecho a mano).","La fabricación de papel crepé rizado o plegado; papeles y cartones compuestos (por ejemplo, papeles y cartones impregnados con betún u otra sustancia adherente).","La fabricación de papeles y cartones mixtos, no revestidos superficialmente ni impregnados.","La fabricación de papeles y cartones rizados, plegados, gofrados o perforados.","La fabricación de papel y cartón revestidos, recubiertos o impregnados.","La fabricación de papel carbón o papel esténcil en rollos de grandes hojas.","La fabricación de laminados y láminas metálicas (aluminio), en el caso de los laminados sobre una base de papel o cartón.","La reelaboración de pasta, papel y cartón (fabricación de papel y cartón de base) a partir de papel o cartón reciclado para la elaboración de guata de celulosa y materiales de fibras de celulosa; la fabricación de papel o cartón Kraft; papel carbón y esténcil en rollos; papel cuché revestido, recubierto o impregnado, papel crepé rizado o plegado; además el procesamiento adicional del papel y del cartón (bañado, recubierto e impregnado con diversos materiales), siempre y cuando el papel o el cartón se constituyan en el elemento base o principal."],"n":["La fabricación de papel y cartón ondulado (corrugado). Se incluye en el código 1702, «Fabricación de papel y cartón ondulado (corrugado), fabricación de envases, empaques y de embalajes de papel y cartón».","La fabricación de guata de materiales textiles. Se incluye en el código 1709, «Fabricación de otros artículos de papel y cartón».","La fabricación de papel y cartón con presentación acondicionada para la venta al por menor. Se incluye en el código CIIU 1709, «Fabricación de otros artículos de papel y cartón».","La fabricación de artículos moldeados de pastas celulósicas. Se incluye en el código 1709, «Fabricación de otros artículos de papel y cartón».","La fabricación de artículos de papel, cartón o pulpa para ser procesados posteriormente. Se incluye en el código 1709, «Fabricación de otros artículos de papel y cartón».","La impresión sobre papel y cartón, cuando la impresión se desarrolla como actividad principal (las actividades de impresión no se integran verticalmente a la fabricación de papel y cartón). Se incluye en el código 1811, «Actividades de impresión».","La fabricación de papel revestido o impregnado con sustancias que sean el principal elemento constitutivo, por ejemplo: los papeles impregnados con jabones y detergentes. Se incluye en el código 2023, «Fabricación de jabones y detergentes, preparados para limpiar y pulir; perfumes y preparados de tocador». Los papeles y guatas impregnados o recubiertos con sustancias farmacéuticas de uso médico se incluyen en el código 2100, «Fabricación de productos farmacéuticos, sustancias químicas medicinales y productos botánicos de uso farmacéutico».","La fabricación de papeles y cartones sensibilizados para usos fotográficos y heliográficos. Se incluye en el código 2029, «Fabricación de otros productos químicos n.c.p.».","La fabricación de papeles abrasivos. Se incluye en el código 2399, «Fabricación de otros productos minerales no metálicos n.c.p.».","La fabricación de papel aluminio a partir de láminas de aluminio como componente primario. Se incluye en el código 2429, «Industrias básicas de otros metales no ferrosos».","La recuperación y clasificación de papel. Se incluye en el código 3830, «Recuperación de materiales»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["17","Fabricación de papel, cartón y productos de papel y cartón"],"g":["170","Fabricación de papel, cartón y productos de papel y cartón"],"o":""}},{"c":"1702","d":"Fabricación de papel y cartón ondulado (corrugado); fabricación de envases, empaques y de embalajes de papel y cartón.","b":true,"m":"El Usuario Industrial con Código CIIU 1702 cuya Actividad Económica Principal es Fabricación de papel y cartón ondulado (corrugado); fabricación de envases, empaques y de embalajes de papel y cartón. es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de papel o cartón ondulado, corrugado o acanalado.","La fabricación de envases y embalajes de papel o cartón ondulado (corrugado); la fabricación de envases plegables de cartón, la fabricación de envases de cartón rígido; la fabricación de cajones, cajas y estuches armados o plegados, de papel o cartón no ondulado; la fabricación de sacos y bolsas de papel para empaque; la fabricación de otros empaques de papel y cartón, incluso archivadores, la fabricación de sobres para discos gramo-fónicos y artículos similares sin impresión.","La fabricación de los demás empaques de papel o cartón, incluso carpetas para archivo y artículos similares para oficina."],"n":["La fabricación de sobres para correspondencia (sobres-carta). Se incluye en el código 1709, «Fabricación de otros artículos de papel y cartón».","La fabricación de artículos de pasta (pulpa) de papel moldeada o prensada (por ejemplo: platos y vasos, bandejas, cajas para empacar huevos, etc.). Se incluye en el código CIIU 1709, «Fabricación de otros artículos de papel y cartón».","La impresión sobre los productos descritos en las inclusiones de esta clase, cuando la impresión corresponda a la actividad principal, o cuando la impresión no esté integrada con la fabricación de papel y cartón y productos de papel y cartón. Se incluye en el código 1811, «Actividades de impresión».","La recuperación y clasificación de papel y cartón, y de envases, empaques y embalajes de papel o cartón. Se incluye en el código 3830, «Recuperación de materiales»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["17","Fabricación de papel, cartón y productos de papel y cartón"],"g":["170","Fabricación de papel, cartón y productos de papel y cartón"],"o":""}},{"c":"1709","d":"Fabricación de otros artículos de papel y cartón","b":true,"m":"El Usuario Industrial con Código CIIU 1709 cuya Actividad Económica Principal es Fabricación de otros artículos de papel y cartón es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de papeles y cartones con presentación acondicionada para la venta al por menor y la fabricación de artículos de papel y cartón: fabricación de papel para imprimir y escribir listo para su uso, fabricación de papel para impresoras de computadores listo para su uso, fabricación de papel de autocopiado listo para su uso, fabricación de papel esténcil o para plantillas y papel carbón listos para su uso, etc.","La fabricación de sobres para correspondencia (sobres-carta), aerogramas, esquelas o tarjetas postales no ilustradas.","La fabricación de cajas de sobres, carpetas y otros productos análogos (de papel y cartón) que contienen un surtido de artículos para correspondencia.","La fabricación de papel higiénico fraccionado, pañuelos, pañitos faciales, toallas, servilletas y otros artículos similares de papel, cartón o pasta moldeada, para uso doméstico, como por ejemplo, bandejas, platos y vasos.","La fabricación de guata de materiales textiles y los artículos de guata de materiales textiles como los tampones y toallas higiénicas, pañales desechables y otros artículos similares.","La fabricación de otros artículos moldeados de papel, cartón o pasta de papel como cajas para empacar huevos, canillas de bobinas, carretes, tubos, conos (para el enrollamiento de hilados, textiles o alambres), tapas; papel y cartón de filtro; papel en rollos o en hojas cuadrangulares o circulares; papel de carta u otros papeles utilizados para escribir o para gráficos, cortados en distintos tamaños o formas, estampados o perforados para varios usos tales como los utilizados en los telares con mecanismos de Jacquard; papel engomado o adhesivo, en hojas, cintas o rollos (cinta de enmascarar); etiquetas en blanco e impresas.","La fabricación de libros de registros, libros de contabilidad, cuadernos, cubiertas para libros, agendas para listas de teléfonos, álbumes, talonarios para facturas, recibos y similares, y demás artículos de papelería de uso educativo o comercial.","La fabricación de papel de colgadura y papeles similares para cubrir muros, incluyendo papel de colgadura de material textil y recubierto de vinilo, y papeles diáfanos para vidrieras.","La fabricación de papel de regalo.","La fabricación de artículos de fantasía de papel y cartón (confetis, serpentinas, artículos decorativos para tarjetas, sobres y regalos, y artículos similares)."],"n":["La fabricación de guata utilizada en acolchados y prendas de vestir en materiales textiles. Se incluye en el código 1399 «Fabricación de otros artículos textiles n.c.p.».","La fabricación de guata de celulosa y de otros materiales de fibras de celulosa, diferente de la guata de materiales textiles. Se incluye en el código 1701 «Fabricación de pulpas (pastas) celulósicas; papel y cartón».","La fabricación de papel o cartón en presentación no acondicionada para la venta al por menor, en rollos u hojas. Se incluye en el código CIIU 1701 «Fabricación de pulpas (pastas) celulósicas; papel y cartón».","La fabricación de artículos para envases, empaques y embalajes. Se incluye en el código 1702 «Fabricación de papel y cartón ondulado (corrugado); fabricación de envases, empaques y de embalajes de papel y cartón».","La impresión sobre los productos descritos en las inclusiones de esta clase, cuando la impresión corresponda a la actividad principal, o cuando la impresión no esté integrada con la fabricación de papel y cartón y productos de papel y cartón. Se incluye en el código 1811 «Actividades de impresión».","La fabricación de placas fotográficas, películas, papeles y cartones sensibilizados para usos fotográficos y heliográficos. Se incluye en el código 2029 «Fabricación de otros productos químicos n.c.p.».","La fabricación de papel de colgadura de material plástico. Se incluye en el código 2229 «Fabricación de artículos de plástico n.c.p.».","La fabricación de naipes y la fabricación de juegos y juguetes de papel y cartón. Se incluyen en el código 3240 «Fabricación de juegos, juguetes y rompecabezas».","La recuperación, separación y clasificación de papel y cartón, y de artículos de papel o cartón tales como carpetas, sobres, tubos, conos, formas continuas, entre otros productos. Se incluye en el código 3830 «Recuperación de materiales»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["17","Fabricación de papel, cartón y productos de papel y cartón"],"g":["170","Fabricación de papel, cartón y productos de papel y cartón"],"o":""}},{"c":"1811","d":"Actividades de impresión","b":true,"m":"El Usuario Industrial con Código CIIU 1811 cuya Actividad Económica Principal es Actividades de impresión es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La impresión de periódicos, libros de todo tipo, incluso libros animados, la impresión de publicaciones periódicas (revistas, folletos); mapas, directorios telefónicos y similares.","La impresión de tarjetas para tabulación, cuadernos para dibujo, cuadernos de ejercicios y similares.","La impresión de sellos postales, timbres fiscales y papel moneda, formas para cheques y letras, bonos y demás documentos de título valor, entre otros.","La impresión de tarjetas con cinta magnética o con circuito integrado (tarjetas inteligentes) utilizadas en tarjetas de crédito, débito, para acceso a sitios restringidos, transporte masivo, tarjetas SIM y similares.","La impresión litográfica de envases, empaques y embalajes.","La impresión de tarjetas postales y juegos didácticos, cromos, estampas, naipes, calcomanías, etc.","La impresión de materiales publicitarios, tales como: carteles y avisos litográficos; afiches; catálogos publicitarios; almanaques y calendarios; diarios y agendas temáticas; formularios comerciales; papel de correspondencia, y otros materiales impresos.","La impresión directa sobre productos de papel, madera, plástico, vidrio, metal y cerámica.","La impresión directa sobre textiles y prendas de vestir por impresión serigráfica u otras técnicas de impresión similares.","La impresión en etiquetas o marbetes (por impresión litográfica, fotograbado, flexo-gráfica, entre otros), realizada a cambio de una retribución o por contrata."],"n":["La fabricación de etiquetas de papel o cartón. Se incluye en el código 1709 «Fabricación de otros artículos de papel y cartón».","La elaboración de artículos de papel, tales como carpetas, sobres, papel para escribir en diferentes tamaños. Se incluye en el código CIIU 1709 «Fabricación de otros artículos de papel y cartón».","La fabricación de libros de registros, libros de contabilidad, cuadernos y artículos similares. Se incluyen en el código 1709 «Fabricación de otros artículos de papel y cartón».","La fabricación de envases, empaques y embalajes impresos, cuando la actividad de impresión esté integrada con la fabricación de estos empaques y se incluyen en la clase a la cual pertenece el sustrato o el soporte sobre el cual se ejecuta la impresión: la fabricación de empaques de cartón impresos que se incluye en el código 1702 «Fabricación de papel y cartón ondulado (corrugado), fabricación de envases, empaques y de embalajes de papel y cartón» y la fabricación de bolsas de plástico impresas que se incluye en el código 2229 «Fabricación de artículos de plástico n.c.p.».","La fabricación de tintas para impresión litográfica, flexo-gráfica, offset, fotograbado, tipográfica, e impresiones similares. Se incluye en el código 2022 «Fabricación de pinturas, barnices y revestimientos similares, tintas para impresión y masillas».","La fabricación de circuitos impresos. Se incluye en el código 2610 «Fabricación de componentes y tableros electrónicos».","Las actividades de edición de materiales impresos. Según el caso se incluyen en el código 5811 «Edición de libros»; el código 5812 «Edición de directorios y listas de correo»; el código 5813 «Edición de periódicos, revistas y otras publicaciones periódicas», y el código 5819 «Otros trabajos de edición».","La producción de material original realizado por autores, compositores, ingenieros, arquitectos y otros profesionales y artistas. Se incluye según se trate en cualquiera de las divisiones contenidas dentro de la sección M «Actividades profesionales, científicas y técnicas» (divisiones 69 a 75).","Las actividades de reproducción para el público en general, de copias heliográficas (fotocopias, xerocopias, etc.). Se incluyen en el código 8219 «Fotocopiado, preparación de documentos y otras actividades especializadas de apoyo a oficina»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["18","Actividades de impresión y de producción de copias a partir de grabaciones originales"],"g":["181","Actividades de impresión y actividades de servicios relacionados con la impresión"],"o":""}},{"c":"1812","d":"Actividades de servicios relacionados con la impresión","b":true,"m":"El Usuario Industrial con Código CIIU 1812 cuya Actividad Económica Principal es Actividades de servicios relacionados con la impresión es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La entrada de datos incluyendo la exploración y el reconocimiento de caracteres ópticos.","La composición corriente, composición tipográfica, fotocomposición, incorporación de datos antes de la impresión, incluso mediante escaneado y reconocimiento óptico de caracteres, composición electrónica.","Los servicios de preparación de placas, incluida la composición de imágenes y de placas (para imprentas tipográficas y de offset).","El grabado de cilindros para roto grabado.","Los procesos que se realizan directamente en las planchas (también planchas de fotopolímeros).","La preparación de planchas y tintes para el estampado y la impresión en relieve.","La preparación para la impresión de obras artísticas, incluso piedras litográficas y planchas de madera preparadas.","La producción de pruebas de impresión.","La producción de productos de reprografía, el diseño de productos impresos; por ejemplo, bocetos, diagramas, patrones, etc.","La encuadernación de hojas impresas para confeccionar libros, folletos, revistas, catálogos, etc., mediante colado, ensamblado, cosido, engomado, encolado, basteado, encuadernación con adhesivo, recortado, estampado en oro.","Otras actividades gráficas como el estampado en hueco y el estampado a troquel, la impresión de libros en braille, el troquelado y el perforado, el estampado en relieve, el barnizado y el laminado, el alzado, el encarte, el plegado, etc."],"n":["N/A"],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["18","Actividades de impresión y de producción de copias a partir de grabaciones originales"],"g":["181","Actividades de impresión y actividades de servicios relacionados con la impresión"],"o":""}},{"c":"1820","d":"Producción de copias a partir de grabaciones originales","b":true,"m":"El Usuario Industrial con Código CIIU 1820 cuya Actividad Económica Principal es Producción de copias a partir de grabaciones originales es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La producción de copias de música y otros sonidos en discos gramo-fónicos, discos compactos y cintas magnetofónicas a partir de grabaciones originales.","La producción de copias de discos flexibles, duros o compactos, a partir de originales.","La producción de copias de programas de informática, a partir de originales.","La duplicación de copias de películas cinematográficas, a partir de originales."],"n":["La producción de material impreso. Se incluye en el código 1811, «Actividades de impresión».","La edición de software. Se incluye en el código 5820, «Edición de programas de informática (software)».","La producción y distribución de películas, cintas de video y películas en DVD o medios similares. Se incluye, según corresponda, en el código 5911, «Actividades de producción de películas cinematográficas, videos, programas, anuncios y comerciales de televisión»; el código 5912, «Actividades de posproducción de películas cinematográficas, videos, programas, anuncios y comerciales de televisión»; y el código 5913, «Actividades de distribución de películas cinematográficas, vídeos, programas, anuncios y comerciales de televisión».","La reproducción de rollos de películas para distribución teatral. Se incluye en el código CIIU 5912, «Actividades de posproducción de películas cinematográficas, video, programas, anuncios y comerciales de televisión».","La producción de grabaciones originales para discos o material de audio. Se incluye en el código 5920, «Actividades de grabación de sonido y edición de música»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["18","Actividades de impresión y de producción de copias a partir de grabaciones originales"],"g":["182","Producción de copias a partir de grabaciones originales"],"o":""}},{"c":"1910","d":"Fabricación de productos de hornos de coque","b":true,"m":"El Usuario Industrial con Código CIIU 1910 cuya Actividad Económica Principal es Fabricación de productos de hornos de coque es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La producción de coque y semicoque a partir de la hulla y el lignito, ya sea en grandes baterías de coquización o pequeños hornos de colmena.","La producción de gas de coquería, aunque generalmente el funcionamiento de hornos de coque sea utilizado parcial o totalmente para el abastecimiento de los mismos hornos.","La producción de alquitrán de hulla y de lignito crudo.","La producción de brea y coque de brea.","La aglomeración de coque."],"n":["La gasificación del carbón in situ. Se incluye en el código 0510, «Extracción de hulla (carbón de piedra)».","La producción de derivados químicos a partir de los subproductos de la coquización, cuando no se realiza integrada a la fabricación del coque, como los productos de la destilación del alquitrán de hulla tales como hidrocarburos aromáticos (benceno y tolueno), y se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La producción de coque cuando constituye un proceso metalúrgico (alto horno) para la obtención de acero. Se incluye en el código 2410, «Industrias básicas de hierro y de acero»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["19","Coquización, fabricación de productos de la refinación del petróleo y actividad de mezcla de combustibles"],"g":["191","Fabricación de productos de hornos de coque"],"o":""}},{"c":"1921","d":"Fabricación de productos de la refinación del petróleo","b":true,"m":"El Usuario Industrial con Código CIIU 1921 cuya Actividad Económica Principal es Fabricación de productos de la refinación del petróleo es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La producción de combustible gaseoso como etano, propano y butano. Esta mezcla al comprimirla pasa al estado líquido y se conoce como gas licuado de petróleo (GLP).","La producción de combustibles líquidos como gasolinas, queroseno, diésel, bencina, etc.","El procesamiento y la mezcla de disolventes derivados del petróleo para la obtención de otros con propiedades y aplicaciones particulares, como por ejemplo, thinner.","El procesamiento de derivados del petróleo tales como las bases lubricantes, combustibles, disolventes, etc., para mejorar algunas de sus propiedades, mediante la adición de antioxidantes, anticorrosivos, etc.","La producción de productos petroquímicos e industriales tales como: disolventes alifáticos, benceno, tolueno y xilenos mezclados, propileno, ciclohexano, bases lubricantes, asfaltos, azufre petroquímico y arrotar (alquitrán).","La fabricación y obtención de derivados de la refinación y purificación de las bases lubricantes como la vaselina, cera parafínica, parafina y ceras.","La producción de aceite de alumbrado, grasas lubricantes y otros productos, a partir del petróleo crudo y de minerales bituminosos (excepto el carbón o hulla), o que resultan de su procesamiento por destilación fraccionada, o extracción con solventes como el asfalto, ácidos nafténicos, etc.","La fabricación de briquetas de hulla (carbón de piedra) y lignito.","La fabricación de briquetas de petróleo."],"n":["La explotación de yacimientos de petróleo para la producción de petróleo crudo. Se incluye en el código 0610, «Extracción de petróleo crudo».","El tratamiento de solventes y otros derivados del petróleo para su recuperación y la rectificación de alcoholes. Se incluye en el código 3830, «Recuperación de materiales».","El tratamiento de suelos, aguas superficiales y subterráneas in situ (en el lugar) o ex situ (fuera del lugar) contaminados por derrames de petróleo. Se incluye en el código 3900, «Actividades de saneamiento ambiental y otros servicios de gestión de desechos».","La comercialización al por mayor de combustibles y productos conexos. Se incluye en el código 4661, «Comercio al por mayor de combustibles sólidos, líquidos, gaseosos y productos conexos».","La comercialización al por menor de combustibles y productos conexos. Se incluye en el código 4731, «Comercio al por menor de combustible para automotores»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["19","Coquización, fabricación de productos de la refinación del petróleo y actividad de mezcla de combustibles"],"g":["192","Fabricación de productos de la refinación del petróleo"],"o":""}},{"c":"1922","d":"Actividad de mezcla de combustibles","b":true,"m":"El Usuario Industrial con Código CIIU 1922 cuya Actividad Económica Principal es Actividad de mezcla de combustibles es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["Las mezclas de gasolinas con alcohol carburante (etanol anhidro) y mezclas de diésel de petróleo o petrodiésel con biodiésel; donde se utilizan notaciones abreviadas según el porcentaje por volumen de alcohol carburante en la mezcla conocidas como E10, E20, etc., o biodiésel en la mezcla como B5, B15, etc."],"n":["La producción de combustibles líquidos como gasolinas. Se incluye en el código 1921, «Fabricación de productos de la refinación del petróleo».","La fabricación de diésel derivado del petróleo. Se incluye en el código CIIU 1921, «Fabricación de productos de la refinación del petróleo».","La producción de etanol con contenido de humedad mayor a 0,5 %. Se incluye en el código 2011, «Fabricación de sustancias y productos químicos básicos».","La producción de biodiésel a partir de aceite refinado de palma africana o a partir de cualquier otra fuente vegetal, sebos y grasas animales, por procesos de transesterificación. Se incluye en el código 2029, «Fabricación de otros productos químicos n.c.p.».","La producción de glicerina sintética. Se incluye en el código CIIU 2011, «Fabricación de sustancias y productos químicos básicos».","La comercialización al por mayor de combustibles y productos conexos. Se incluye en el código 4661, «Comercio al por mayor de combustibles sólidos, líquidos, gaseosos y productos conexos».","La comercialización al por menor de combustibles y productos conexos. Se incluye en el código 4731, «Comercio al por menor de combustible para automotores»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["19","Coquización, fabricación de productos de la refinación del petróleo y actividad de mezcla de combustibles"],"g":["192","Fabricación de productos de la refinación del petróleo"],"o":""}},{"c":"2011","d":"Fabricación de sustancias y productos químicos básicos","b":true,"m":"El Usuario Industrial con Código CIIU 2011 cuya Actividad Económica Principal es Fabricación de sustancias y productos químicos básicos es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de gases industriales, gases inorgánicos comprimidos, gases licuados y gases medicinales como oxígeno, nitrógeno y gases halógenos como el cloro y el flúor; los gases refrigerantes producidos a partir de hidrocarburos como los freones; gas carbónico (hielo seco), aire líquido o comprimido, mezclas de estos gases con aplicaciones específicas y gases aislantes.","La fabricación de colorantes y pigmentos de cualquier fuente, en forma básica o como concentrados.","La producción de elementos químicos aislados y sus isótopos: metales alcalinos y alcalinotérreos como el calcio, y el fósforo; metales de transición (excepto el hierro, y metales preciosos), metaloides (silicio) y no metales (azufre).","La producción de compuestos químicos inorgánicos (excepto ácido nítrico).","Los ácidos inorgánicos, tales como sulfúrico, sulfhídrico, clorhídrico, fluorhídrico, y sus sales como sulfatos, sulfuros, sulfitos, cloruros, cloratos, cloritos, bromatos, perbromatos, yodatos y peryodatos, fosfatos, fosfitos, boratos, cromatos y dicromatos, permanganatos, cianuros, fluoruros, etc.","Las bases como óxidos básicos e hidróxidos: óxidos de calcio, hidróxido de sodio (sosa cáustica o soda cáustica) e hidróxido de potasio (potasa cáustica) excepto amoniaco.","El enriquecimiento de minerales de uranio y torio y producción de elementos combustibles para reactores nucleares.","La fabricación de uranio empobrecido en U235 y sus compuestos, torio y sus compuestos.","La producción de compuestos químicos orgánicos como hidrocarburos, ácidos carboxílicos, anhídridos, aldehídos, cetonas, ésteres, éteres, epóxidos, tioles, sulfuros, aminas, amidas, alcoholes, fenoles, nitrilos, etc.","La fabricación de hidrocarburos saturados aislados, insaturados (olefinas o alquenos como: etileno, propileno, butadieno, isopreno, etc.), compuestos aromáticos (cíclicos insaturados como: benceno, tolueno, estireno); sus derivados halogenados (cloruro de vinilo, cloroformo), derivados sulfonados, nitrados o nitrosados, etc.","La fabricación de alcoholes (metílico, propílico, etc.), fenoles (resorcinol e hidroquinona); alcoholes cíclicos, y éteres (éter etílico).","La fabricación de alcohol etílico no desnaturalizado (potable), fabricación de alcohol etílico desnaturalizado (impotable) de cualquier concentración y alcohol carburante.","La fabricación de alcohol carburante a partir de caña de azúcar, cereales, hortalizas, raíces, tubérculos o a partir de otra fuente vegetal.","Los ácidos mono y policarboxílicos (tales como el fórmico, y el benzoico; ácidos grasos como el esteárico, el oleico y sus sales), sus anhídridos y derivados halogenados, sulfonados, nitrados y nitrosados.","Las sales orgánicas (tales como acetatos, ftalatos, estearatos, benzoatos, formiatos, acrilatos, tartratos, etc.).","La fabricación de glicerina sintética.","Las aminas (tales como la etilendiamina, anilina); amidas (benzamida y acetanilida); los nitrilos (acrilonitrilo); las lactonas y las lactamas (caprolactama).","La producción de carbón vegetal mediante la destilación de la madera.","Otros compuestos orgánicos, incluidos la extracción de productos volátiles mediante destilación de madera, como la trementina y sus derivados, terpenos, mentol, alcanfor y colofonia.","Los agentes sintéticos orgánicos e inorgánicos para el tratamiento y curtido del cuero como los derivados del ácido gálico, del ácido tánico y las sales básicas de cromo.","La producción de sustancias y productos químicos mediante procesos biotecnológicos, utilizando para ello cultivos de microorganismos (procesos fermentativos) o preparaciones enzimáticas solubles e inmovilizadas, y células inmovilizadas, y las sustancias químicas producidas por estos métodos tales como los ácidos: cítrico, láctico, glucónico, glutámico, etc.","La producción de aguas destiladas.","Los productos del tipo de los utilizados como agentes avivadores fluorescentes o como luminóforos.","La fabricación de sustancias básicas químicamente definidas, utilizadas en la preparación de los productos característicos de plaguicidas y otros productos químicos de uso agropecuario.","El tostado de piritas de hierro.","La obtención de magnesio a través de procesos de separación o transformación química a partir de fuentes minerales.","La fabricación de disolventes o diluyentes sin mezclar de constitución químicamente definida.","La fabricación y preparación de radiofármacos terapéuticos utilizados en medicina nuclear."],"n":["La extracción de hidrocarburos como metano, etano, propano o butano provenientes de yacimientos de gas. Se incluye en el código 0620, «Extracción de gas natural».","La fabricación en refinería de metano y propano. Se incluye en el código 1921, «Fabricación de productos de la refinación del petróleo».","La producción de levadura para la alimentación, así como la elaboración de vinagre. Se incluye en el código 1089, «Elaboración de otros productos alimenticios n.c.p.»","La elaboración de bebidas alcohólicas destiladas. Se incluye en el código 1101, «Destilación, rectificación y mezcla de bebidas alcohólicas».","La producción de bebidas alcohólicas en general mediante microorganismos. Se incluye en el código 1102, «Elaboración de bebidas fermentadas no destiladas», o en el código 1103, «Producción de malta, elaboración de cervezas y otras bebidas malteadas», según el caso.","La producción de combustibles líquidos y gaseosos como mezcla de gases obtenidos de la destilación de petróleo denominado gas licuado de petróleo (GLP). Se incluye en el código 1921, «Fabricación de productos de la refinación del petróleo».","La fabricación de abonos y compuestos inorgánicos nitrogenados; la fabricación de ácido nítrico, amoníaco, cloruro de amonio, nitritos y nitratos de potasio, y la fabricación de carbonatos de amonio. Se incluyen en el código 2012, «Fabricación de abonos y compuestos inorgánicos nitrogenados».","La fabricación de plásticos en formas primarias y caucho sintético en formas primarias. Se incluye en el código 2013, «Fabricación de plásticos en formas primarias», y el código 2014, «Fabricación de caucho sintético en formas primarias», respectivamente.","La fabricación de pigmentos, tintes, opacificadores y tintes preparados. Se incluye en el código 2022, «Fabricación de pinturas, barnices y revestimientos similares, tintas para impresión y masillas».","La fabricación de glicerina o glicerol crudo. Se incluye en el código 2023, «Fabricación de jabones y detergentes, preparados para limpiar y pulir; perfumes y preparados de tocador».","La extracción y refinación de aceites esenciales. Se incluye en el código 2029, «Fabricación de otros productos químicos n.c.p.».","La fabricación de aguas destiladas aromáticas (agua floral). Se incluye en el código 2029, «Fabricación de otros productos químicos n.c.p.».","La fabricación de agua esterilizada para inyectables. Se incluye en el código 2100, «Fabricación de productos farmacéuticos, sustancias químicas medicinales y productos botánicos de uso farmacéutico».","La producción de ácido salicílico y ácido acetilsalicílico. Se
