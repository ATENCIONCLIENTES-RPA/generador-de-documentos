en el código 3830, «Recuperación de materiales».","El mantenimiento y la reparación de vehículos automotores. Se incluye en el código 4520, «Mantenimiento y reparación de vehículos automotores»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["29","Fabricación de vehículos automotores, remolques y semirremolques"],"g":["291","Fabricación de vehículos automotores y sus motores"],"o":""}},{"c":"2920","d":"Fabricación de carrocerías para vehículos automotores; fabricación de remolques y semirremolques","b":true,"m":"El Usuario Industrial con Código CIIU 2920 cuya Actividad Económica Principal es Fabricación de carrocerías para vehículos automotores; fabricación de remolques y semirremolques es BENEFICIARIO DEL DESCUENTO.\nSI requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de carrocerías (incluidas las cabinas) diseñadas para ser montadas sobre chasis de vehículos automotores; carrocerías para vehículos sin chasis y carrocerías de monocasco; carrocerías para vehículos de transporte de personas, camiones y vehículos de uso especial; carrocerías metálicas, de madera, plástico o combinaciones de estos u otros materiales.","La fabricación de remolques y semirremolques diseñados para ser remolcados por vehículos automotores; del tipo utilizado para vivienda o para acampar; para el transporte de mercancías, tales como remolques cisterna, remolques nodriza (porta-automóviles) y de mudanzas; cureñas para cañones de artillería; remolques para exposiciones, presentación de mercancías o con fines publicitarios, etc.; para el transporte de pasajeros y para otros fines, incluso remolques para el transporte combinado por ferrocarril y carreteras.","La fabricación de carrocerías para remolques y semirremolques, metálicas, de madera, plástico y/o combinaciones de estos u otros materiales.","La fabricación de contenedores (incluso contenedores para el transporte de fluidos), especialmente diseñados y equipados para su acarreo por uno o más medios de transporte.","La fabricación, el ensamble y la instalación de carrocerías blindadas para vehículos automotores."],"n":["La fabricación de tanques, cisternas o recipientes similares de metal utilizados habitualmente como equipo fijo para el almacenamiento o la producción de los establecimientos industriales. Se incluye en el código 2512, «Fabricación de tanques, depósitos y recipientes de metal, excepto los utilizados para el envase o transporte de mercancías».","La fabricación de recipientes utilizados para el envase o transporte de mercancías como latas para productos alimenticios, barriles, tambores, bidones, tarros, y cajas. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de remolques y semirremolques diseñados especialmente para uso agropecuario y que estén equipados usualmente con accesorios o enganches para acoplar cortadoras, esparcidoras u otros artefactos. Se incluye en el código 2821, «Fabricación de maquinaria agropecuaria y forestal».","La fabricación de maquinaria agropecuaria montada sobre remolques. También se incluye en el código CIIU 2821, «Fabricación de maquinaria agropecuaria y forestal».","La fabricación de partes, piezas y accesorios para carrocerías de vehículos automotores no clasificados en otra parte, tales como parachoques, airbags, entre otros. Se incluye en el código 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de partes y piezas blindadas para vehículos automotores. Se incluye en el código CIIU 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de vehículos de tracción animal. Se incluye en el código 3099, «Fabricación de otros tipos de equipo de transporte n.c.p.».","El mantenimiento y la reparación especializado de contenedores para transporte multimodal. Se incluye en el código 3311, «Mantenimiento y reparación especializado de productos elaborados en metal».","El desmantelamiento y la trituración de remolques, semirremolques, carrocerías y contenedores multimodal. Se incluye en el código 3830, «Recuperación de materiales».","La creación y colocación de anuncios publicitarios en automóviles y autobuses. Se incluyen en el código 7310, «Publicidad»."],"r":"SI","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["29","Fabricación de vehículos automotores, remolques y semirremolques"],"g":["292","Fabricación de carrocerías para vehículos automotores; fabricación de remolques y semirremolques"],"o":""}},{"c":"2930","d":"Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores","b":true,"m":"El Usuario Industrial con Código CIIU 2930 cuya Actividad Económica Principal es Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de tanques, cisternas o recipientes similares de metal utilizados habitualmente como equipo fijo para el almacenamiento o la producción de los establecimientos industriales. Se incluye en el código 2512, «Fabricación de tanques, depósitos y recipientes de metal, excepto los utilizados para el envase o transporte de mercancías».","La fabricación de recipientes utilizados para el envase o transporte de mercancías como latas para productos alimenticios, barriles, tambores, bidones, tarros, y cajas. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de remolques y semirremolques diseñados especialmente para uso agropecuario y que estén equipados usualmente con accesorios o enganches para acoplar cortadoras, esparcidoras u otros artefactos. Se incluye en el código 2821, «Fabricación de maquinaria agropecuaria y forestal».","La fabricación de maquinaria agropecuaria montada sobre remolques. También se incluye en el código CIIU 2821, «Fabricación de maquinaria agropecuaria y forestal».","La fabricación de partes, piezas y accesorios para carrocerías de vehículos automotores no clasificados en otra parte, tales como parachoques, airbags, entre otros. Se incluye en el código 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de partes y piezas blindadas para vehículos automotores. Se incluye en el código CIIU 2930, «Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores».","La fabricación de vehículos de tracción animal. Se incluye en el código 3099, «Fabricación de otros tipos de equipo de transporte n.c.p.».","El mantenimiento y la reparación especializado de contenedores para transporte multimodal. Se incluye en el código 3311, «Mantenimiento y reparación especializado de productos elaborados en metal».","El desmantelamiento y la trituración de remolques, semirremolques, carrocerías y contenedores multimodal. Se incluye en el código 3830, «Recuperación de materiales».","La creación y colocación de anuncios publicitarios en automóviles y autobuses. Se incluyen en el código 7310, «Publicidad»."],"n":["La fabricación de tejidos utilizados para el tapizado interior de vehículos automotores. Se incluye en el código 1392, «Confección de artículos con materiales textiles, excepto prendas de vestir».","La fabricación de tejidos utilizados para cinturones de seguridad. Se incluye en el código CIIU 1392, «Confección de artículos con materiales textiles, excepto prendas de vestir».","La fabricación de artículos confeccionados como fundas para automóviles y neumáticos. Se incluye en el código 1392 CIIU, «Confección de artículos con materiales textiles, excepto prendas de vestir».","La fabricación de neumáticos. Se incluye en el código 2211, «Fabricación de llantas y neumáticos de caucho».","La fabricación de mangueras, correas, ligas, soportes, empaques, boceles, bujes y otros productos de caucho. Se incluye en el código 2219, «Fabricación de formas básicas de caucho y otros productos de caucho n.c.p.».","La fabricación de lunas de seguridad sin enmarcar. Se incluye en el código 2310, «Fabricación de vidrio y productos de vidrio».","La fabricación de espejos de vidrio con marco o sin él, incluidos los espejos retrovisores para vehículos. Se incluye en el código CIIU 2310, «Fabricación de vidrio y productos de vidrio».","La fabricación de sistemas de alarma contra robo y alarmas de incendios que envían señales a estación de control. Se incluye en el código 2630, «Fabricación de equipos de comunicación».","La fabricación de baterías para vehículos automotores. Se incluye en el código 2720, «Fabricación de pilas, baterías y acumuladores eléctricos».","La fabricación de equipo eléctrico destinado a la iluminación para vehículos automotores. Se incluye en el código 2740, «Fabricación de equipos eléctricos de iluminación».","La fabricación de sirenas, bocinas y timbres eléctricos. Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de electroimanes, elementos de sujeción eléctrica, embragues, frenos, acoplamientos, abrazaderas o cabezales alzadores electromagnéticos o de imán permanente. Se incluye en el código CIIU 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de partes de motores; por ejemplo, válvulas de admisión y de escape, y pistones. Se incluye en el código 2811, «Fabricación de motores, turbinas y partes para motores de combustión interna».","La fabricación de bombas para vehículos automotores y motores. Se incluye en el código 2813, «Fabricación de otras bombas, compresores, grifos y válvulas».","La fabricación de las piezas internas del motor, tales como árboles de levas, cigüeñales y sus cojinetes. Se incluye en el código 2814, «Fabricación de cojinetes, engranajes, trenes de engranajes y piezas de transmisión».","La fabricación de cajas de engranajes, ejes de transmisión, dispositivos para cambios de marchas, embragues y poleas, diferentes a los utilizados en vehículos automotores. Se incluye en el código CIIU 2814, «Fabricación de cojinetes, engranajes, trenes de engranajes y piezas de transmisión».","La fabricación de motores para vehículos automotores. Se incluye en el código 2910, «Fabricación de vehículos automotores y sus motores».","La fabricación de chasises equipados con motor. Se incluye en el código CIIU 2910, «Fabricación de vehículos automotores y sus motores».","La fabricación de asientos y sillas, tapizadas o no, para trenes y aviones. Se incluye en la clase 3020, «Fabricación de locomotoras y de material rodante para ferrocarriles», y el código 3030, «Fabricación de aeronaves, naves espaciales y de maquinaria conexa», respectivamente.","El desmantelamiento de vehículos automotores con el fin de reducir y revender sus piezas reutilizables. Se incluye en el código 3830 Recuperación de materiales.","El mantenimiento, la reparación y la instalación de partes, piezas y accesorios para vehículos automotores. Se incluyen en el código 4520, «Mantenimiento y reparación de vehículos automotores»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["29","Fabricación de vehículos automotores, remolques y semirremolques"],"g":["293","Fabricación de partes, piezas (autopartes) y accesorios (lujos) para vehículos automotores"],"o":""}},{"c":"3011","d":"Construcción de barcos y de estructuras flotantes","b":true,"m":"El Usuario Industrial con Código CIIU 3011 cuya Actividad Económica Principal es Construcción de barcos y de estructuras flotantes es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La construcción de barcos (excepto yates y otras embarcaciones para deportes o recreo), incluida la fabricación de secciones de buques y barcos.","La construcción de embarcaciones para uso comercial (barco transbordador o ferry, barcos mercantes, petroleros, remolcadores, entre otros) o para el transporte de pasajeros, particularmente las embarcaciones de usos múltiples.","La construcción de embarcaciones diseñadas para la navegación marítima, costera o fluvial.","La construcción de barcos para pesca y embarcaciones pesqueras para el procesamiento de pescado (barcos factoría).","La construcción de embarcaciones no motorizadas para transporte de carga en puertos (por ejemplo, gabarras).","La construcción de embarcaciones de fondeo fijo (por ejemplo: barcos faros).","La construcción de embarcaciones cuyo uso principal no es la navegación (por ejemplo, dragas).","La construcción de aerodeslizadores (excepto los de tipo recreativo).","La construcción de embarcaciones con cascos similares a los de barcos de recreo pero equipadas especialmente para su uso comercial o conexo.","La construcción de buques de guerra o combate, embarcaciones navales auxiliares y artefactos, como los barcos para el transporte de tropas (nodrizas), y barcos hospitales y logísticos.","La construcción de embarcaciones diseñadas o equipadas para la investigación científica.","La construcción de estructuras flotantes: puertos flotantes, pontones, balsas inflables para uso no recreativo, diques flotantes, plataformas de perforación flotante o sumergible, pistas flotantes, barcazas, embarcaderos, boyas, depósitos flotantes, grúas flotantes, entre otros.","La reconstrucción o conversión de embarcaciones o estructuras flotantes realizada en fábrica.","La fabricación de sillas y asientos utilizados en embarcaciones y estructuras flotantes."],"n":["La fabricación de partes y piezas de embarcaciones, diferentes a secciones importantes del casco: fabricación de las velas. Se incluye en el código 1392, «Confección de artículos con materiales textiles, excepto prendas de vestir».","La fabricación de hélices y palas para hélices de propulsión para barcos. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de las anclas d turas flotantes».","La fabricación de tablas de vela y tablas de surf. Se incluye en el código 3230, «Fabricación de artículos y equipo para la práctica del deporte».","El mantenimiento y la reparación de embarcaciones de recreo y deporte. Se incluye en el código 3315, «Mantenimiento y reparación especializado de equipo de transporte, excepto los vehículos automotores, motocicletas y bicicletas».","El desguace o desmantelamiento de embarcaciones. Se incluye en el código 3830, «Recuperación de materiales».","La instalación de acabado e interiores como techos, instalación de puertas, mamparas, coberturas de madera para embarcaciones y botes. Se incluye en el código 4330, «Terminación y acabado de edificios y obras de ingeniería civil»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["30","Fabricación de otros tipos de equipo de transporte"],"g":["301","Construcción de barcos y otras embarcaciones"],"o":""}},{"c":"3020","d":"Fabricación de locomotoras y de material rodante para ferrocarriles","b":true,"m":"El Usuario Industrial con Código CIIU 3020 cuya Actividad Económica Principal es Fabricación de locomotoras y de material rodante para ferrocarriles es BENEFICIARIO DEL DESCUENTO.\nNO requiere revisión y SI requiere presentar Hoja 6 RUT.","p":["La fabricación de locomotoras de ferrocarril: locomotoras propulsadas por una fuente de energía exterior o por acumuladores eléctricos; locomotoras diésel, eléctricas; locomotoras propulsadas por motores de encendido por compresión o por otros medios (por ejemplo, turbinas de gas, máquinas de vapor, motores de encendido por chispa eléctrica) y ténderes de locomotora.","La fabricación de vagones de pasajeros, furgones y vagones de plataforma autopropulsados de tranvía o de ferrocarril, cualquiera sea la fuerza motriz, incluidos los vehículos autopropulsados de mantenimiento o de servicio para tranvías o ferrocarriles (por ejemplo, vagones-taller, grúas, vagones de ensayos).","La fabricación de material rodante no autopropulsado para tranvías o ferrocarriles: vagones de pasajeros, furgones de carga, vagones cisternas, furgones y vagones de tipo volquete y furgones taller, vagones grúas y similares.","La fabricación de partes y piezas especiales de locomotoras o tranvías o de su material rodante: bogues, ejes y ruedas; frenos y piezas de frenos; ganchos y mecanismos de enganche, topes y piezas de tope; amortiguadores (excepto muelles); bastidores de vagones y locomotoras; carrocerías; plataformas de intercomunicación, entre otros.","La fabricación de equipo mecánico (incluso electromecánico) de señalización, seguridad, control o regulación del tráfico para ferrovías, carreteras, vías de navegación interiores, playas de estacionamiento, instalaciones portuarias o aeropuertos. Se trata de aparatos cuyas señales se ponen en funcionamiento desde un centro de mando, que generalmente se encuentra a cierta distancia, mediante manivelas, palancas, varillas, alambres, cadenas, entre otros; mediante dispositivos hidroneumáticos; o mediante motores eléctricos (por ejemplo, equipo de cajas de señales, aparatos de manejo de las agujas, frenos de carril, aparatos automáticos de señales para niebla, mecanismos de control de pasos a nivel).","La fabricación de asientos para ferrocarriles.","La fabricación de locomotoras y de vagones para minería.","La reconstrucción o conversión de locomotoras y vagones de ferrocarril realizada en fábrica."],"n":["La fabricación de rieles sin ensamblar. Se incluye en el código 2410, «Industrias básicas de hierro y de acero».","La fabricación de accesorios ensamblados para vías de ferrocarril. Se incluye en el código 2599, «Fabricación de otros productos elaborados de metal n.c.p.».","La fabricación de motores eléctricos y sus partes. Se incluye en el código 2711, «Fabricación de motores, generadores y transformadores eléctricos».","La fabricación de equipo eléctrico de señalización, seguridad o regulación del tráfico para ferrovías, carreteras, s espaciales equipadas o no, para la vida en el espacio.","La fabricación de vehículos de lanzamiento de naves espaciales.","La fabricación de aparatos de entrenamiento de vuelo en tierra.","La fabricación de artefactos y dispositivos para el aterrizaje sobre cubierta y dispositivos similares.","La fabricación de partes, piezas y accesorios de los productos antes mencionados; principales ensamblajes tales como fuselajes, alas, puertas, paneles de mando, trenes de aterrizaje, incluso flotadores de hidroavión, depósitos de combustibles, góndolas, entre otros.","La fabricación de partes especiales de ensamblajes principales, diseñadas para su instalación en aeronaves; partes de globos y dirigibles y partes de naves espaciales y de vehículos de lanzamiento.","La fabricación de hélices, rotores de helicóptero y palas de hélice propulsadas.","La fabricación de motores del tipo utilizado generalmente para la propulsión de aeronaves.","La fabricación de motores de combustión interna con émbolos de movimiento rectilíneo o rotatorio y de encendido por chispa eléctrica para aeronaves y la reconstrucción de dichos motores.","La fabricación de turborreactores, turbopropulsores (turbohélices) y turboventiladores para aeronaves.","La fabricación de motores de reacción: estatorreactores, pulsorreactores y motores de cohetes.","La fabricación de partes y piezas para turborreactores, turbopropulsores (turbohélices), turboventiladores, estatorreactores, motores de cohetes y similares.","La fabricación de simuladores de vuelo.","La fabricación de asientos para aeronaves.","La fabricación de misiles balísticos intercontinentales (ICBM).","La reconstrucción o conversión en fábrica de aeronaves y de motores de aeronaves."],"n":["La fabricación de paracaídas. Se incluye en el código 1392, «Confección de artículos con materiales textiles, excepto prendas de vestir».","La fabricación de proyectiles, misiles y otras municiones de uso militar. Se incluye en el código 2520, «Fabricación de armas y municiones».","La fabricación de equipo de telecomunicación para satélites. Se incluye en el código 2630, «Fabricación de equipos de comunicación».","La fabricación de sistemas de navegación aérea. Se incluye en el código 2651, «Fabricación de equipo de medición, prueba, navegación y control».","La fabricación de instrumentos de navegación y de otros aparatos utilizados en aeronaves. Se incluye en el código CIIU 2651, «Fabricación de equipo de medición, prueba, navegación y control».","La fabricación de equipo de iluminación para aeronaves. Se incluye en el código 2740, «Fabricación de equipos eléctricos de iluminación».","La fabricación de aparatos y dispositivos eléctricos de encendido o de arranque para motores de combustión interna, de encendido por chispa o por compresión (diferentes a los utilizados en vehículos automotores). Se incluye en el código 2790, «Fabricación de otros tipos de equipo eléctrico n.c.p.».","La fabricación de pistones, anillos para pistones, carburadores y demás partes de motores de combustión interna para aeronaves. Se incluye en el código 2811, «Fabricación de motores, turbinas, y partes para motores de combustión interna».","La fabricación de equipos lanzadores de aeronaves, catapultas transportadoras de aeronaves y equipo relacionado. Se incluye en el código 2829, «Fabricación de otros tipos de maquinaria y equipo de uso especial n.c.p.».","El mantenimiento y la reparación de aeronaves y de motores de aeronaves. Se incluye en el código 3315, «Mantenimiento y reparación especializado de equipo de transporte, excepto los vehículos automotores, motocicletas y bicicletas».","El desmantelamiento y la trituración de aeronaves y partes de aeronaves. Se incluye en el código 3830, «Recuperación de materiales»."],"r":"NO","h":"SI","k":{"s":["Sección C","INDUSTRIAS MANUFACTURERAS"],"v":["30","Fabricación de otros tipos de equipo de transporte"],"g":["303","Fabricación de aeronaves, naves espaciales y de maquinaria conexa"],"o":""}},{"c":"304
