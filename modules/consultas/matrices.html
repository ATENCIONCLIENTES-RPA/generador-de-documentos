<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script>
/* Tema: se resuelve antes del primer pintado para evitar destellos. */
(function(){var K="ciiu.theme",d=document.documentElement;
function read(){try{var v=localStorage.getItem(K);if(v==="light"||v==="dark"||v==="auto")return v;}catch(e){}
try{var a=localStorage.getItem("essa-theme")||localStorage.getItem("essa_cm_theme");if(a==="light"||a==="dark")return a;}catch(e){}
return "light";}
function resolve(p){return p==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):p;}
function paint(p){var r=resolve(p);d.setAttribute("data-theme",r);d.setAttribute("data-theme-pref",p);return r;}
window.__ciiuTheme={key:K,read:read,resolve:resolve,paint:paint,mq:matchMedia("(prefers-color-scheme: dark)")};
paint(read());})();
</script>
<style>
  /* Se oculta hasta que el CSS del módulo esté aplicado: evita que los SVG
     sin estilo se pinten a tamaño máximo durante la carga. */
  html{background:#F8FAFC}
  html[data-theme="dark"]{background:#11151D}
  body{visibility:hidden}
</style>
<script>
(function(){var r=function(){try{var b=document.body;if(b&&getComputedStyle(b).visibility==='hidden')b.style.visibility='visible';}catch(e){}};
window.addEventListener('error',r,true);setTimeout(r,8000);})();
</script>
